<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
  <script src="./modules/outfit-preview.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <script nomodule src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer-legacy.js"></script>
</head>
<body class="anime-bg min-h-screen p-5">
  <main class="max-w-5xl mx-auto">
    <header class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <a href="#" id="backBtn" class="btn btn-ghost text-sm">Back</a>
        <h1 class="site-title text-2xl font-bold accent-underline">Shop</h1>
      </div>
      <div class="text-sm">Coins: <strong id="coins">0</strong></div>
    </header>

    <section class="manga-bubble p-3">
      <!-- 3-column layout: categories (L) | preview (C) | items list (R) -->
      <div class="shop-grid items-start">
        <!-- Categories -->
        <aside class="max-h-[70vh] overflow-auto pr-1">
          <div class="font-medium mb-2">Categories</div>
          <div id="catList" class="flex md:flex-col gap-2 overflow-x-auto pb-1"></div>
        </aside>

        <!-- Preview (sticky) -->
        <div class="flex items-start justify-center sm:sticky top-2">
          <div class="text-center">
            <div id="mvWrap" class="inline-block relative" style="display:none; width:200px; height:220px; overflow:hidden; z-index:1;">
              <model-viewer id="mvShop" class="float-slow absolute inset-0" camera-controls exposure="1" shadow-intensity="0.6" interaction-prompt="none"></model-viewer>
            </div>
            <div id="equipSummary" class="text-xs text-gray-700 mt-1"></div>
            <div id="equipChips" class="flex flex-wrap gap-1 justify-center mt-1"></div>
            <div class="mt-2">
              <button id="anchorDebugToggle" class="btn btn-ghost text-xs">Anchor Debug</button>
            </div>
            <div id="anchorDebug" class="hidden text-left text-xs mt-2 p-2 border-2 border-black bg-white rounded">
              <div class="mb-1 font-semibold">Adjust Slot</div>
              <div class="mb-1">Slot:
                <select id="adSlot" class="border px-1 py-0.5 text-xs"></select>
              </div>
              <div class="grid grid-cols-3 gap-1 mb-1">
                <label>X <input id="adPosX" type="number" step="0.005" class="border px-1 py-0.5 w-20"></label>
                <label>Y <input id="adPosY" type="number" step="0.005" class="border px-1 py-0.5 w-20"></label>
                <label>Z <input id="adPosZ" type="number" step="0.005" class="border px-1 py-0.5 w-20"></label>
              </div>
              <div class="grid grid-cols-3 gap-1 mb-1">
                <label>RotX° <input id="adRotX" type="number" step="1" class="border px-1 py-0.5 w-20"></label>
                <label>RotY° <input id="adRotY" type="number" step="1" class="border px-1 py-0.5 w-20"></label>
                <label>RotZ° <input id="adRotZ" type="number" step="1" class="border px-1 py-0.5 w-20"></label>
              </div>
              <div class="mb-1">
                <label>Scale <input id="adScale" type="number" step="0.01" class="border px-1 py-0.5 w-24"></label>
              </div>
              <div class="flex gap-2">
                <button id="adApply" class="btn btn-primary text-xs">Apply</button>
                <button id="adReset" class="btn btn-amber text-xs">Reset</button>
                <button id="adLog" class="btn btn-ghost text-xs">Log Nodes</button>
              </div>
              <div id="adInfo" class="mt-1 text-gray-600"></div>
            </div>
            <div class="text-xs text-gray-600 mt-2">Tap a category and equip/buy to preview.</div>
          </div>
        </div>

        <!-- Items list -->
        <div class="max-h-[70vh] overflow-auto pr-1" id="itemsPane">
          <div class="font-medium mb-2" id="catTitle">Items</div>
          <div id="catalog" class="grid grid-cols-1 gap-2"></div>
        </div>
      </div>
    </section>

    <div class="mt-3 flex items-center gap-2">
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const catalogEl = $('#catalog');
    const coinsEl = $('#coins');
    const tutorLink = $('#tutorLink');
    const catList = $('#catList');
    const catTitle = $('#catTitle');
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        try { if (history.length > 1) history.back(); else location.href = 'lesson.html'; }
        catch (e) { location.href = 'lesson.html'; }
      });
    }

    // No 2D mascot fallback; preview shows only 3D models

    async function api(path, opts){
      const r = await fetch(path, opts||{});
      let data = null;
      try { data = await r.json(); } catch (e) { data = null; }
      if (!r.ok) return data || { ok:false, error: `HTTP ${r.status}` };
      return data;
    }
    let SELECTED = 'upgrades';
    const FORCE_OVERLAY_SLOT = 'top';
    // Scene-graph attachment: slot anchors (approximate). Adjust as needed.
    const SLOT_ANCHORS_DEFAULT = {
      // General body regions
      head:  { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      torso: { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      body:  { position:[0, 0.00, 0], rotation:[0,0,0], scale:[1,1,1] },
      legs:  { position:[0, -0.06, 0], rotation:[0,0,0], scale:[1,1,1] },
      feet:  { position:[0, -0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      arms:  { position:[0.02, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      hands: { position:[0.04, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      // Clothing synonyms
      hat:   { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      hair:  { position:[0, 0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      mask:  { position:[0, 0.08, 0.06], rotation:[0,0,0], scale:[1,1,1] },
      top:   { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      outfit:{ position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] },
      boots: { position:[0, -0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      skirt: { position:[0, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      belt:  { position:[0, -0.01, 0.01], rotation:[0,0,0], scale:[1,1,1] },
      bag:   { position:[-0.05, 0.02, -0.03], rotation:[0,0,0], scale:[1,1,1] },
      misc:  { position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] }
    };
    // Accessory pool (offscreen model-viewers) to load GLBs for scene-graph cloning
    const accPool = document.createElement('div'); accPool.id = 'accPool'; accPool.style.display = 'none'; document.body.appendChild(accPool);
    const accCache = new Map(); // id -> { mv, ready:Promise }
    function accessoryViewerFor(id, src){
      let rec = accCache.get(id);
      if (rec && rec.mv && rec.mv.getAttribute('src') === src) return rec;
      const mv = document.createElement('model-viewer'); mv.setAttribute('src', src); mv.setAttribute('reveal','auto');
      accPool.appendChild(mv);
      const ready = new Promise(res=>{ if(mv.model){ res(mv); return;} mv.addEventListener("load", async ()=>{ try{ await mv.updateComplete; }catch(e){} res(mv); }, {once:true}); });
      rec = { mv, ready }; accCache.set(id, rec); return rec;
    }
    function getBaseRoot(mv){ try { return (mv && mv.model && (mv.model.scene || mv.model)) || null; } catch (e) { return null; } }
    function getSceneFromViewer(mv){ try { return (mv && mv.model && (mv.model.scene || mv.model)) || null; } catch (e) { return null; } }
    function getThree(){ try { return (window.THREE||null); } catch (e) { return null; } }
    function computeBounds(root){ try { const THREE = getThree(); if(!THREE||!root) return null; const box = new THREE.Box3(); let has=false; root.updateWorldMatrix?.(true,true); root.traverse?.(o=>{ try{ if (o.isMesh && o.geometry){ if(!o.geometry.boundingBox && o.geometry.computeBoundingBox) o.geometry.computeBoundingBox(); const bb = o.geometry.boundingBox && o.geometry.boundingBox.clone(); if (bb){ bb.applyMatrix4(o.matrixWorld); if(has) box.union(bb); else { box.copy(bb); has=true; } } } }catch(_){}}); return has?box:null; } catch (e) { return null; } }
    function clearAttachments(mv){ try { (mv.__attachments||[]).forEach(obj=>{ try { const root=getBaseRoot(mv); if(root && obj && obj.parent===root) root.remove(obj); } catch (e) {} }); mv.__attachments=[]; } catch (e) { mv.__attachments=[]; } }
    async function attachAccessoriesToBase(mv, equip, itemsMap){
      try {
        let root = getBaseRoot(mv); if(!root){ await new Promise(res=> mv?.addEventListener("load", res, {once:true})); try{ await mv.updateComplete; }catch(e){} root = getBaseRoot(mv); if(!root) return false; }
        clearAttachments(mv);
        const slots = Object.keys(equip||{}).filter(s=>s!=='model');
        const added = [];
        for (const slot of slots){
          const it = itemsMap.get(equip[slot]); if(!it || !it.model) continue;
          const rec = accessoryViewerFor(it.id, it.model); await rec.ready;
          const srcScene = getSceneFromViewer(rec.mv); if(!srcScene || !srcScene.clone) continue;
          const obj = srcScene.clone(true);
          const a = (SLOT_ANCHORS||SLOT_ANCHORS_DEFAULT)[slot] || (SLOT_ANCHORS||SLOT_ANCHORS_DEFAULT).misc;
          try {
            // Attach first so world matrices are valid
            try { root.add(obj); } catch (e) {}
            // Auto-scale accessory height relative to base height
            const baseBox = computeBounds(root);
            const accBox0 = computeBounds(obj);
            if (baseBox && accBox0) {
              const baseH = Math.max(1e-6, baseBox.max.y - baseBox.min.y);
              const accH  = Math.max(1e-6, accBox0.max.y - accBox0.min.y);
              var target = 0.25; if (slot==='top' || slot==='torso' || slot==='body') target = 0.35;
              var s = (target * baseH) / accH;
              if (isFinite(s) && s>0 && s<10) obj.scale.set(s,s,s);
            }
            if (obj.position) { obj.position.set(a.position[0], a.position[1], a.position[2]); }
            if (obj.rotation) { obj.rotation.set(a.rotation[0], a.rotation[1], a.rotation[2]); }
            added.push(obj);
          } catch (e) {}
        }
        mv.__attachments = added;
        return added.length > 0;
      } catch (e) { return false; }
    }
    function categoriesFrom(items){
      const cats = [];
      if ((items||[]).some(it=>it.kind==='upgrade')) cats.push({ id:'upgrades', label:'Upgrades', filter:(it)=>it.kind==='upgrade' });
      // Characters category
      if ((items||[]).some(it=>it.kind==='cosmetic' && it.slot==='model')) cats.push({ id:'model', label:'Characters', filter:(it)=>it.kind==='cosmetic' && it.slot==='model' });
      // Dynamic clothing categories by slot
      const slots = Array.from(new Set((items||[]).filter(it=>it.kind==='cosmetic' && it.slot && it.slot!=='model').map(it=>it.slot)));
      const names = { outfit:'Outfits', hat:'Hats', hair:'Hair', mask:'Masks', top:'Tops', legs:'Legwear', boots:'Boots', skirt:'Skirts', belt:'Belts', bag:'Bags', misc:'Accessories' };
      const labelFor = (s)=> names[s] || (s.charAt(0).toUpperCase()+s.slice(1));
      slots.forEach(s=> cats.push({ id:s, label:labelFor(s), filter:(it)=>it.kind==='cosmetic' && it.slot===s }));
      return cats;
    }
    function renderCats(cats){
      catList.innerHTML = '';
      cats.forEach(c=>{
        const b = document.createElement('button');
        b.className = 'btn btn-ghost text-sm whitespace-nowrap ' + (SELECTED===c.id ? 'ring-2' : '');
        b.textContent = c.label; b.dataset.id = c.id;
        b.addEventListener('click', ()=>{ SELECTED = c.id; catTitle.textContent = c.label; renderItems(); });
        catList.appendChild(b);
      });
      const cur = cats.find(x=>x.id===SELECTED) || cats[0];
      if (cur) catTitle.textContent = cur.label;
    }
    let _items = [], _wallet = { coins:0, owned:{}, equipped:{} }, _cats = [];
    async function loadAll(){
      const [cat, wall] = await Promise.all([
        api('/api/shop/catalog'),
        api('/api/wallet')
      ]).catch(()=>[{items:[]},{coins:0,owned:{},equipped:{}}]);
      _items = cat.items||[]; _wallet = wall||{coins:0,owned:{},equipped:{}};
      coinsEl.textContent = String(_wallet.coins||0);
      renderPreview();
      _cats = categoriesFrom(_items);
      renderCats(_cats);
      renderItems();
    }

    async function renderPreview(){
      const equip = _wallet.equipped||{};
      const itemsMap = new Map((_items||[]).map(x=>[x.id,x]));
      const mv = document.getElementById('mvShop');
      // Prefer 3D model when available
      try {
        const modelItem = equip.model && itemsMap.get(equip.model);
        if (modelItem && modelItem.model && mv) {
          mv.src = modelItem.model;
          (function(){ const wrap=document.getElementById('mvWrap'); if(wrap) wrap.style.display='inline-block'; })();
          // 3D only
          try { mv.pause(); } catch (e) {}
          // Nudge animation to show change
          try { mv.classList.remove('animate-pulse'); void mv.offsetWidth; mv.classList.add('animate-pulse'); setTimeout(()=>mv.classList.remove('animate-pulse'), 300); } catch (e) {}
        } else { const wrap=document.getElementById('mvWrap'); if(wrap) wrap.style.display='none'; }
      } catch (e) {}
      // Attach clothing via plugin (scene-graph)
      try {
        function loadAnchorOverrides(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch (e) { return {}; } }
        window.__ofp = window.__ofp || (window.OutfitPreview && window.OutfitPreview.create({ mv: mv, overrides: loadAnchorOverrides() }));
        if (window.__ofp) {
          window.__ofp.setOverrides(loadAnchorOverrides());
          window.__ofp.update(equip, _items||[]);
          await window.__ofp.attachAll();
        }
      } catch (e) { console.warn('preview attach failed', e); }
      // Update equipped summary so user sees immediate feedback
      try {
        const eqList = [];
        Object.keys(equip||{}).forEach(slot => {
          if (slot==='model') return;
          const it = itemsMap.get(equip[slot]);
          if (it) eqList.push(`${slot}: ${it.name}`);
        });
        const sum = document.getElementById('equipSummary');
        if (sum) sum.textContent = eqList.length ? ('Equipped: ' + eqList.join(' | ')) : '';
      } catch (e) {}
      // No fallback preview
      // Render equipped chips with quick remove buttons + refresh Anchor panel slots
      try {
        const chips = document.getElementById('equipChips');
        while (chips.firstChild) chips.removeChild(chips.firstChild);
        const slotsEquipped = Object.keys(equip||{}).filter(s=>s!=='model');
        slotsEquipped.forEach(slot => {
          if (slot==='model') return;
          const it = itemsMap.get(equip[slot]);
          if (!it) return;
          const b = document.createElement('button');
          b.className = 'btn btn-ghost text-xs';
          b.innerHTML = `${it.name} <span aria-hidden="true">x</span>`;
          b.title = `Remove ${it.name}`;
          b.addEventListener('click', async ()=>{
            try {
              const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ slot }) });
              if (!res.ok && res.error) { alert(res.error); return; }
              _wallet.equipped = res.equipped || _wallet.equipped || {};
              renderPreview();
              renderItems();
            } catch (e) {}
          });
          chips.appendChild(b);
        });
        // Anchor Debug: populate slot list
        try {
          const sel = document.getElementById('adSlot');
          if (sel) {
            sel.innerHTML='';
            slotsEquipped.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
          }
        } catch (e) {}
      } catch (e) {}
    }
    function cardHtml(it, owned, equipped){
      const ownedBadge = '<span class="text-green-700 text-xs">Owned</span>';
      const equipBtn = (disabled=false)=>`<button data-equip="${it.id}" class="btn btn-ghost btn-equip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Equip</button>`;
      const unequipBtn = (disabled=false)=>`<button data-unequip="${it.id}" class="btn btn-amber btn-unequip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Unequip</button>`;
      const buyBtn = `<button data-buy="${it.id}" class="btn btn-primary btn-buy">Buy</button>`;
      let action = buyBtn;
      if (owned[it.id]) {
        if (it.kind==='cosmetic') {
          const slot = it.slot;
          const isEquipped = equipped && equipped[slot] === it.id;
          action = `${equipBtn(false)} ${unequipBtn(!isEquipped)}`;
        } else {
          action = ownedBadge;
        }
      }
      const sub = it.kind==='upgrade' ? 'Upgrade' : (it.slot ? it.slot : 'Cosmetic');
      return `
        <div class="p-3 rounded-xl border-2 border-black bg-white shadow">
          <div class="font-semibold">${it.name}</div>
          <div class="text-xs text-gray-600 mb-2">${sub}</div>
          <div class="flex items-center justify-between">
            <div class="text-sm">Price: <strong>${it.price}</strong></div>
            <div class="flex items-center gap-2">${action}</div>
          </div>
        </div>`;
    }
    function renderItems(){
      const owned = _wallet.owned||{}; const equipped = _wallet.equipped||{};
      const cats = _cats;
      const cat = cats.find(c=>c.id===SELECTED) || cats[0];
      const list = (cat ? _items.filter(cat.filter) : _items);
      catalogEl.innerHTML='';
      list.forEach(it=>{
        const wrap = document.createElement('div');
        wrap.innerHTML = cardHtml(it, owned, equipped);
        const node = wrap.firstElementChild; catalogEl.appendChild(node);
      });
      try { if (owned['upgrade-tutor-basic'] && tutorLink) tutorLink.classList.remove('hidden'); else if (tutorLink) tutorLink.classList.add('hidden'); } catch (e) {}
      bindActions();
      try { document.getElementById('itemsPane').scrollTop = 0; } catch (e) {}
    }
    function bindActions(){
      catalogEl.querySelectorAll('[data-buy]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-buy');
        const res = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        // Auto-equip cosmetics on purchase for preview
        if (id.startsWith('cos-')) {
          await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        }
        loadAll();
      }));
      catalogEl.querySelectorAll('[data-equip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-equip');
        if (e.currentTarget.disabled) return;
        try {
          // Auto-buy if not owned
          const ownedMap = _wallet.owned || {};
          if (!ownedMap[id]) {
            const buy = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
            if (buy && buy.error) { alert(buy.error); return; }
            _wallet.owned = buy?.owned || _wallet.owned || {};
          }
          const res = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
          if (res && res.error) { alert(res.error); return; }
          // Optimistic UI update
          const it = (_items||[]).find(x=>x.id===id);
          if (it && it.slot) {
            _wallet.equipped = _wallet.equipped || {};
            _wallet.equipped[it.slot] = id;
          }
          renderPreview();
          renderItems();
          await loadAll();
        } catch (err) { console.error('Equip failed', err); }
      }));
      catalogEl.querySelectorAll('[data-unequip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-unequip');
        if (e.currentTarget.disabled) return;
        try {
          const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
          if (res && res.error) { alert(res.error); return; }
          // Optimistic UI update
          const it = (_items||[]).find(x=>x.id===id);
          if (it && it.slot && _wallet.equipped) delete _wallet.equipped[it.slot];
          renderPreview();
          renderItems();
          await loadAll();
        } catch (err) { console.error('Unequip failed', err); }
      }));
    }

    loadAll();
  </script>
</body>
</html>
