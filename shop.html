<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
  <style>
    /* Pose buttons: match pill styling, blue accent */
    .pose-btn {
      border: 1px solid #000;
      background: #f2f8ff;
      color: #0d3b66;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      transition: all 0.15s ease;
      box-shadow: 2px 4px 0 rgba(0,0,0,0.35);
    }
    .pose-btn:hover {
      border-color: #0d99ff;
      color: #0d99ff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.12);
    }
    .pose-btn.pose-active {
      background: #0d99ff;
      color: #fff;
      border-color: #0d99ff;
      box-shadow: 0 4px 10px rgba(13,153,255,0.35);
    }
    /* Keep long all-in-one toggle lists reachable without forcing page scroll */
    #aioTogglePanel {
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding-right: 4px;
    }
    @media (max-width: 759px) {
      #aioTogglePanel {
        max-height: none;
        overflow: visible;
        padding-right: 0;
      }
    }
  </style>
  <script src="./modules/outfit-preview.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="./vendor/model-viewer.min.js"></script>
  <script type="module">
    import * as THREE from './vendor/three.module.js';
    import { GLTFLoader } from './vendor/GLTFLoader.js';
    import { OrbitControls } from './vendor/OrbitControls.js';
    import { TransformControls } from './vendor/TransformControls.js';
    window.__THREE = THREE; window.THREE = window.THREE || THREE; window.__GLTFLoader = GLTFLoader; window.__OrbitControls = OrbitControls; window.__TransformControls = TransformControls;
  </script>
</head>
<body class="anime-bg min-h-screen p-5">
  <main class="max-w-5xl mx-auto">
    <header class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <a href="#" id="backBtn" class="btn btn-ghost text-sm">Back</a>
        <h1 class="site-title text-2xl font-bold accent-underline">Shop</h1>
      </div>
      <div class="text-sm">Coins: <strong id="coins">0</strong></div>
    </header>

    <section class="manga-bubble p-3">
      <!-- 3-column layout: categories (L) | preview (C) | items list (R) -->
      <div class="shop-grid items-start" style="grid-template-columns:200px 620px 1fr;">
        <!-- Categories -->
        <aside class="pr-3 w-full md:w-[190px] space-y-3">
          <div id="catList" class="flex flex-col gap-2"></div>
        </aside>

        <!-- Preview (sticky) -->
        <div class="flex items-start justify-center" style="position:static;">
          <div class="text-center">
            <div id="mvWrap" class="inline-block relative" style="display:none; width:420px; height:520px; overflow:hidden; z-index:1; box-sizing:border-box;">
              <model-viewer id="mvShop" class="float-slow absolute inset-0" style="width:100%; height:100%;" camera-controls exposure="1" shadow-intensity="0.6" interaction-prompt="none"></model-viewer>
            </div>
            <div id="tvWrap" class="inline-block relative" style="display:inline-block; width:420px; height:520px; overflow:hidden; z-index:1; box-sizing:border-box;"></div>
            <div id="equipSummary" class="text-xs text-gray-700 mt-1"></div>
            <div id="equipChips" class="flex flex-wrap gap-1 justify-center mt-1"></div>
            <div id="basemeshNotice" class="text-xs text-amber-700 mt-2 flex items-center justify-center gap-2" style="display:none;">
              <span id="basemeshNoticeText"></span>
              <button id="browseChars" class="btn btn-xs btn-dark">Change Character</button>
            </div>
            <div id="colorControls" class="mt-3 w-full max-w-xs mx-auto text-left space-y-2">
              <div id="eyeColorRow" class="color-row">
                <label for="eyeColorPick" class="color-label">Eye Color</label>
                <input id="eyeColorPick" type="color" value="#31a2ff" class="color-input flex-1" />
                <button id="eyeApplyBtn" class="btn btn-primary text-xs px-3 py-1">Apply</button>
              </div>
              <div id="hatColorRow" class="color-row" style="display:none;">
                <label for="hatColorPick" class="color-label">Headwear</label>
                <input id="hatColorPick" type="color" value="#8a4b20" class="color-input flex-1" />
              </div>
              <div id="bootColorRow" class="color-row" style="display:none;">
                <label for="bootColorPick" class="color-label">Footwear</label>
                <input id="bootColorPick" type="color" value="#6b4b2a" class="color-input flex-1" />
              </div>
              <div id="bagColorRow" class="color-row" style="display:none;">
                <label for="bagColorPick" class="color-label">Bag</label>
                <input id="bagColorPick" type="color" value="#5a4632" class="color-input flex-1" />
              </div>
            </div>
            <div id="poseControls" class="mt-3">
              <div class="text-xs font-medium mb-1">Pose</div>
              <div id="poseButtons" class="flex flex-wrap gap-1 justify-center"></div>
            </div>
            <!-- Anchor Debug removed -->
            <div class="text-xs text-gray-600 mt-2">Tap a category and equip/buy to preview.</div>
          </div>
        </div>

        <!-- Items list -->
        <div class="pr-1 w-full self-start" id="itemsPane" style="max-height:none; overflow:visible;">
          <div class="font-medium mb-2" id="catTitle"></div>
          <div id="catalog" class="grid grid-cols-2 gap-3"></div>
        </div>
      </div>
    </section>

    <div class="mt-3 flex items-center gap-2">
      <button id="applyBtn" class="btn btn-primary">Apply Changes</button>
      <button id="applyNavBtn" class="btn btn-dark">Apply & Continue to Lessons</button>
      <span id="applyStatus" class="text-xs text-gray-600"></span>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const catalogEl = $('#catalog');
    const coinsEl = $('#coins');
    const tutorLink = $('#tutorLink');
    const catList = $('#catList');
    const catTitle = $('#catTitle');
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => { e.preventDefault(); try { const last=(function(){ try { return localStorage.getItem('lastLessonHref'); } catch { return null; } })(); const href = last || 'lesson.html?lesson=greetings-001'; location.href = href; } catch (_) { location.href = 'lesson.html?lesson=greetings-001'; } });
    }

    // Anchor Debug toggle + Log wiring
    (function(){
      const anchorToggle = document.getElementById('anchorDebugToggle');
      if (anchorToggle && !anchorToggle.__wired) {
        anchorToggle.__wired = true;
        anchorToggle.addEventListener('click', ()=>{
          const panel = document.getElementById('anchorDebug');
          if (!panel) return;
          if (panel.classList.contains('hidden')) panel.classList.remove('hidden'); else panel.classList.add('hidden');
        });
      }
      const adLog = document.getElementById('adLog');
      if (adLog && !adLog.__wired) {
        adLog.__wired = true;
        adLog.addEventListener('click', ()=>{
          try {
            let names = [];
            if (window.__useTV && window.TV && typeof window.TV.getNodeNames === 'function') {
              names = window.TV.getNodeNames()||[];
            } else if (window.__ofp && typeof window.__ofp.getNodeNames === 'function') {
              names = window.__ofp.getNodeNames()||[];
            }
            const info = document.getElementById('adInfo');
            if (info) info.textContent = (names && names.length) ? ('Nodes: ' + names.join(', ')) : 'No nodes or model not loaded yet.';
            console.log('[Anchor Debug] Model nodes:', names);
          } catch (e) {}
        });
      }
    })();

    // No 2D mascot fallback; preview shows only 3D models

    const FORCE_MV_PREVIEW = false; // prefer Three.js TV preview; model-viewer only if TV fails
    // Clear user overrides so positioning isn’t influenced before framing
    (function resetOverrides(){
      try { localStorage.setItem('anchorOverrides','{}'); } catch {}
      try { localStorage.setItem('baseMeshScale','1'); } catch {}
    })();
    try { console.log('[shop] FORCE_MV_PREVIEW', FORCE_MV_PREVIEW); } catch {}
    async function api(path, opts){
      try {
        const url = (typeof path === 'string')
          ? (path.startsWith('http') ? path : new URL(path, location.origin).toString())
          : String(path||'');
        const r = await fetch(url, opts||{});
        let data = null;
        try { data = await r.json(); } catch (e) { data = null; }
        if (!r.ok) return data || { ok:false, error: `HTTP ${r.status}` };
        return data;
      } catch (e) {
        console.warn('api failed', path, e);
        return { ok:false, error: String(e) };
      }
    }
    let SELECTED = 'model';
    let LAST_MODEL_ID = null;
    let MODEL_CHANGED = false;
    const FORCE_OVERLAY_SLOT = 'top';
    const SLOT_LABELS = {
      head:'Head',
      hat:'Hat',
      hair:'Hair',
      mask:'Mask',
      torso:'Torso',
      top:'Top',
      body:'Top',
      outfit:'Outfit',
      legs:'Legwear',
      skirt:'Skirt',
      boots:'Footwear',
      feet:'Footwear',
      belt:'Belt',
      bag:'Bag',
      misc:'Accessory',
      arms:'Arms',
      hands:'Hands'
    };
    const CATEGORY_GROUPS = [
      { id:'headwear', label:'Headwear', slots:['hat','hair','mask'] },
      { id:'tops', label:'Tops', slots:['top','torso','body'] },
      { id:'outfits', label:'Outfits', slots:['outfit'] },
      { id:'legwear', label:'Legwear', slots:['legs','skirt'] },
      { id:'footwear', label:'Footwear', slots:['boots','feet'] },
      { id:'belts', label:'Belts', slots:['belt'] },
      { id:'bags', label:'Bags & Accessories', slots:['bag','misc'] }
    ];
    const NAME_OVERRIDES = {
      'cos-bottesgreen':'Green Boots',
      'cos-bottes':'Adventurer Boots',
      'cos-amorarm':'Arm Guard',
      'cos-greenoutfit':'Green Outfit',
      'cos-ninjassuit':'Ninja Suit'
    };
    const COLOR_CATEGORY_RULES = {
      hat:new Set(['headwear','hat','hair']),
      boot:new Set(['footwear','boots','feet']),
      bag:new Set(['bags','bag','misc'])
    };
    const ARMORARM_KEY = 'miscArmorArms';
    const isArmorArm = (id)=>{ try { return /armorarm|amorarm/i.test(String(id||'')); } catch { return false; } };
    const ARMORARM_DEFAULT_OFFSETS = {
      // These come from your existing saved anchors for L/R so we always have a sane forearm placement
      left:{
        pos:[-0.034403016805831535, 0.04411172206355481, 0.0390447441387427],
        rot:[-0.019854197659057184, 0.28876278671539896, 2.075238667617461],
        scl:[1,1,1]
      },
      right:{
        pos:[-0.029601914289105795, -0.0056423670045653695, 0.02200428201841935],
        rot:[2.957661836177801, -0.6321156150147867, 1.0030662658174405],
        scl:[1,1,1]
      }
    };
    const ARMORARM_DEFAULT_ANCHORS = {
      shared:{ position:[0, 0.502, 0.003], rotation:[0,0,0], scale:[1,1,1] },
      left:{ position:[-0.034403016805831535, 0.04411172206355481, 0.0390447441387427], rotation:[-0.019854197659057184, 0.28876278671539896, 2.075238667617461], scale:[1,1,1] },
      right:{ position:[-0.029601914289105795, -0.0056423670045653695, 0.02200428201841935], rotation:[2.957661836177801, -0.6321156150147867, 1.0030662658174405], scale:[1,1,1] }
    };
    const loadArmorArmsLocal = ()=>{ try { const a=JSON.parse(localStorage.getItem(ARMORARM_KEY)||'[]'); return Array.isArray(a)?a.filter(Boolean):[]; } catch { return []; } };
    const saveArmorArmsLocal = (arr)=>{ try { localStorage.setItem(ARMORARM_KEY, JSON.stringify(arr||[])); } catch {} };
    function readArmorOffset(key){
      try {
        const raw = JSON.parse(localStorage.getItem(key)||'null');
        if (raw && typeof raw==='object') return raw;
      } catch {}
      try {
        const ov = JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{};
        const val = ov[key];
        if (val && typeof val==='object') {
          return {
            pos: val.pos || val.position || [0,0,0],
            rot: val.rot || val.rotation || [0,0,0],
            scl: val.scl || val.scale || [1,1,1]
          };
        }
      } catch {}
      try {
        if (/^armorarmOffset[LR]$/.test(String(key||''))) {
          const side = key.endsWith('R') ? 'right' : 'left';
          const fallback = (ARMORARM_DEFAULT_OFFSETS && ARMORARM_DEFAULT_OFFSETS[side]) ? ARMORARM_DEFAULT_OFFSETS[side] : null;
          if (fallback) return fallback;
        }
      } catch {}
      return null;
    }
    function writeArmorOffset(key, data){
      try {
        if (data) localStorage.setItem(key, JSON.stringify(data)); else localStorage.removeItem(key);
      } catch {}
      try {
        const ov = JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{};
        if (data) {
          ov[key] = {
            position: data.pos || data.position || [0,0,0],
            rotation: data.rot || data.rotation || [0,0,0],
            scale: data.scl || data.scale || [1,1,1]
          };
        } else {
          delete ov[key];
        }
        localStorage.setItem('anchorOverrides', JSON.stringify(ov));
      } catch {}
      try { pushServerAnchorsSoon(); } catch {}
    }
    const ANIMATION_DURATIONS = {
      'anim_crouch':0.292,
      'anim_crouchiddle':0.583,
      'anim_dying':0.75,
      'anim_flip':1.208,
      'anim_iddle':0.375,
      'anim_iddle.001':0.375,
      'anim_jump':0.875,
      'anim_push':0.792,
      'anim_run':0.542,
      'anim_uncrouch':0.417,
      'anim_walk':0.792
    };
    const POSE_PRESETS = [
      { id:'neutral', label:'Neutral' },
      { id:'idle', label:'Idle', animation:'anim_iddle', fraction:0.25, hold:false },
      { id:'arms', label:'Arms Out', animation:'anim_push', fraction:0.45, hold:false },
      { id:'walk', label:'Walk', animation:'anim_walk', fraction:0.5, hold:false },
      { id:'run', label:'Run', animation:'anim_run', fraction:0.35, hold:false },
      { id:'crouch', label:'Crouch', animation:'anim_crouch', fraction:0.95, hold:true }
    ];
    let CURRENT_POSE_ID = 'neutral';
    let __poseRetryTimer = null;
    let POSE_SNAPSHOTS = null;
    let __poseSnapshotsPromise = null;
    function startCase(str){
      return String(str||'')
        .replace(/[_-]+/g,' ')
        .replace(/([a-z])([A-Z])/g,'$1 $2')
        .replace(/\s+/g,' ')
        .trim()
        .replace(/\b\w/g,c=>c.toUpperCase());
    }
    function friendlySlotLabel(slot){
      if (slot==='model') return '';
      return SLOT_LABELS[slot] || startCase(slot||'');
    }
    function formatItemName(it){
      if(!it) return '';
      const id = String(it.id||'');
      const raw = NAME_OVERRIDES[id] || NAME_OVERRIDES[it.name] || it.name || id;
      const cleaned = String(raw||'')
        .replace(/\b3d\b/ig,'')
        .replace(/\bmodel\b/ig,'')
        .replace(/\s+/g,' ')
        .trim();
      return startCase(cleaned);
    }
    // Scene-graph attachment: slot anchors (approximate). Adjust as needed.
    const SLOT_ANCHORS_DEFAULT = {
      // General body regions
      head:  { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      torso: { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      body:  { position:[0, 0.00, 0], rotation:[0,0,0], scale:[1,1,1] },
      legs:  { position:[0, -0.06, 0], rotation:[0,0,0], scale:[1,1,1] },
      feet:  { position:[0, -0.35, 0], rotation:[0,0,0], scale:[1,1,1] },
      arms:  { position:[0.02, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      hands: { position:[0.04, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      // Clothing synonyms
      hat:   { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      hair:  { position:[0, 0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      mask:  { position:[0, 0.08, 0.06], rotation:[0,0,0], scale:[1,1,1] },
      top:   { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      outfit:{ position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] },
      boots: { position:[0, -0.355, 0], rotation:[0,0,0], scale:[1,1,1] },
      skirt: { position:[0, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      belt:  { position:[0, -0.01, 0.01], rotation:[0,0,0], scale:[1,1,1] },
      bag:   { position:[-0.05, 0.02, -0.03], rotation:[0,0,0], scale:[1,1,1] },
      misc:  { position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] }
    };
    // Seed a sane per-item default for armor shoes to sit slightly forward
    (function seedDefaultItemAnchors(){
      try {
        const key = 'cos-armorshoe';
        const ov = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })();
        const locks = (function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })();
        if (!locks[key] && !ov[key]) { ov[key] = { position:[0, -0.39, 0.06], rotation:[0,0,0], scale:[1,1,1] }; localStorage.setItem('anchorOverrides', JSON.stringify(ov)); }
        // Apply same forward offset to all boots by default (slot-level)
        // and to feet slot for any items categorized there.
        let changed = false;
        if (!locks.boots && !ov.boots) { ov.boots = { position:[0,-0.39,0.06], rotation:[0,0,0], scale:[1,1,1] }; changed = true; }
        if (!locks.feet  && !ov.feet)  { ov.feet  = { position:[0,-0.39,0.06], rotation:[0,0,0], scale:[1,1,1] }; changed = true; }
        // Per-item nudges: raise further so feet don't poke through
        // Larger margin per request
        const targetY = -0.30;  // ~9cm above boots baseline (-0.39)
        const targetZ = 0.06;
        const candidates = ['cos-ninjashoe', 'cos-bottesgreen', 'cos-bottes'];
        for (const k of candidates){
          if (!locks[k] && !ov[k]) { ov[k] = { position:[0, targetY, targetZ], rotation:[0,0,0], scale:[1,1,1] }; changed = true; }
        }
        // Ninjashoe needs a separate higher placement (only if not locked and missing)
        (function(){ try { const id='cos-ninjashoe'; const y=-0.26, z=0.06; if (!locks[id] && !ov[id]) { ov[id] = { position:[0,y,z], rotation:[0,0,0], scale:[1,1,1] }; changed=true; } } catch{} })();
        if (changed) localStorage.setItem('anchorOverrides', JSON.stringify(ov));
      } catch {}
    })();
    // Seed defaults for armor arms so they always have per-side anchors even when localStorage is empty
    (function seedArmorArmAnchors(){
      try {
        const ov = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })();
        const locks = (function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })();
        const def = ARMORARM_DEFAULT_ANCHORS || {};
        const candidates = [
          ['cos-amorarm', def.shared || def.left || def.right],
          ['cos-amorarm-left', def.left || def.shared || def.right],
          ['cos-amorarm-right', def.right || def.shared || def.left],
          ['cos-amorarm-l', def.left || def.shared || def.right],
          ['cos-amorarm-r', def.right || def.shared || def.left],
          ['cos-amorarmx', def.left || def.shared || def.right]
        ];
        let changed=false;
        for (const [id,val] of candidates){
          if (!id || !val) continue;
          if (locks[id]) continue;
          if (!ov[id]) { ov[id] = { position:[...val.position], rotation:[...val.rotation], scale:[...val.scale] }; changed=true; }
        }
        if (changed) localStorage.setItem('anchorOverrides', JSON.stringify(ov));
      } catch {}
    })();
    // Accessory pool (offscreen model-viewers) to load GLBs for scene-graph cloning
    const accPool = document.createElement('div'); accPool.id = 'accPool';
    accPool.style.position = 'absolute'; accPool.style.left = '-9999px'; accPool.style.top = '0'; accPool.style.width = '1px'; accPool.style.height = '1px'; accPool.style.overflow = 'hidden';
    document.body.appendChild(accPool);
    // ---- Anchor sync helpers (server <-> localStorage) ----
    async function fetchServerAnchors(){
      try {
        const res = await fetch('/api/anchors', { cache:'no-store' });
        if (!res.ok) return false; const data = await res.json();
        const cur = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })();
        // Prefer local overrides (e.g. from Anchor Tool) over server values
        const merged = Object.assign({}, data.anchors||{}, cur);
        localStorage.setItem('anchorOverrides', JSON.stringify(merged));
        if (data.locks && typeof data.locks==='object') localStorage.setItem('anchorLocks', JSON.stringify(Object.assign({}, (function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })(), data.locks)));
        return true;
      } catch { return false; }
    }
    let __syncTimer=null; async function pushServerAnchorsSoon(){ try { if(__syncTimer) return; __syncTimer=setTimeout(async()=>{ __syncTimer=null; try { const anchors=(function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })(); const locks=(function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })(); await fetch('/api/anchors', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ anchors, locks, merge:true }) }); } catch {} }, 1500); } catch {} }
    const accCache = new Map(); // id -> { mv, ready:Promise }
    async function accessoryViewerFor(id, src){
      let rec = accCache.get(id);
      if (rec && rec.mv && rec.mv.getAttribute('src') === src) return rec;
      // Ensure custom element is defined
      try { if (window.customElements && window.customElements.whenDefined) await window.customElements.whenDefined('model-viewer'); } catch {}
      const mv = document.createElement('model-viewer');
      mv.setAttribute('src', src);
      mv.setAttribute('reveal','auto');
      mv.setAttribute('preload','true');
      mv.style.width = '1px'; mv.style.height = '1px';
      accPool.appendChild(mv);
      const ready = new Promise(res=>{
        const done = ()=>{ try { res(mv); } catch { res(mv); } };
        let settled = false;
        const mark = (label)=>{ try { console.log('[attach] event', label, src); } catch(_){} };
        const tryDone = ()=>{

    function applyBootColorToRoot(root, hex){
      try {
        if (!root || !hex) return false;

        const traverse = root.traverse ? (fn)=>root.traverse(fn) : (fn)=>{ (function walk(o){ try{ fn(o); (o.children||[]).forEach(walk); }catch(e){} })(root); };
        // First: strict match on boot_tint material or object name
        traverse((o)=>{
          try {
            if (!o || !o.isMesh) return;
            const arr = Array.isArray(o.material) ? o.material : (o.material?[o.material]:[]);

            for (let i=0;i<arr.length;i++){

        if (!changed) {

              } catch {}
            };
            root.traverse?.(o=>{ try { if (o && !o.isMesh) markIfBoot(o); } catch {} });
            for (const g of targets){
              try {
                g.traverse?.(o=>{
                  try {
                    if (!o || !o.isMesh) return;
                    const arr = Array.isArray(o.material) ? o.material : (o.material?[o.material]:[]);
                    for (let i=0;i<arr.length;i++){

    // React to Anchor Tool adjustments in real time (multi-window)

    const HIDE_BUY_BTNS = new Set(['upgrade-tutor-basic','upgrade-tutor-pro','upgrade-hint-plus','upgrade-freeze-plus','upgrade-shield-start']);
    function cardHtml(it, owned, equipped){
      const curModel = (equipped||{}).model || 'model-basemesh';
      const isCompat = (function(){ try{ if(it.kind==='upgrade'||it.slot==='model') return true; const list=it.compatibleWith; if(!Array.isArray(list)||!list.length) return true; return list.includes(curModel);}catch{return true;} })();
      const ownedBadge = '<span class="text-green-700 text-xs font-semibold">Owned</span>';

      const unequipBtn = (disabled=false)=>`<button data-unequip="${it.id}" class="btn btn-amber btn-unequip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Unequip</button>`;
      const buyBtn = `<button data-buy="${it.id}" class="btn btn-primary btn-buy">Buy</button>`;
      let action = (HIDE_BUY_BTNS.has(it.id) ? '' : buyBtn);
      if (owned[it.id]) {
        if (it.kind==='cosmetic') {
          const slot = it.slot;
          const val = equipped && equipped[slot];

          action = isCompat ? `${equipBtn(false)} ${unequipBtn(!isEquipped)}` : '<span class="text-xs text-gray-500">Not compatible</span>';
        } else {
          action = ownedBadge;
        }
      }
      const sub = it.kind==='upgrade'

          <div class="flex items-start justify-between gap-3">

    function renderItems(){
      const owned = _wallet.owned||{}; const equipped = _wallet.equipped||{};

    // Apply button: persist current preview equipment to server (top-most per slot)
    (function(){
      const btn = document.getElementById('applyBtn'); const btnNav = document.getElementById('applyNavBtn'); const status = document.getElementById('applyStatus');
      async function applyEquip(navigateAfter=false){
        if (btn) btn.disabled = true; if (btnNav) btnNav.disabled = true; if (status) status.textContent = 'Applying...';
        try {
          const want = (function flatten(eq){ const out={}; Object.keys(eq||{}).forEach(k=>{ if(k==='model'){ out.model=eq.model; return; } const v=eq[k]; if (Array.isArray(v)) { if (v.length) out[k]=v[v.length-1]; } else if (v) out[k]=v; }); return out; })(_wallet.equipped||{});
          const cur = await api('/api/wallet') || {equipped:{}}; const serverEq = (cur&&cur.equipped)||{};
          // Model first
          if (want.model && serverEq.model !== want.model) {
            const r = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId: want.model }) });
            if (r && r.error) throw new Error(r.error);
            // Update local categories to reflect model change (compatibility and upgrades visibility)
            try { _wallet.equipped = { model: want.model }; _cats = categoriesFrom(_items); renderCats(_cats); } catch {}
          }
          // Unequip removed slots
          const allSlots = new Set([...Object.keys(serverEq||{}), ...Object.keys(want||{})]); allSlots.delete('model');
          for (const slot of allSlots){
            const a = want[slot]; const b = serverEq[slot];
            if (!a && b) { await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ slot }) }); }
          }
          // Equip desired per slot
          for (const [slot,id] of Object.entries(want)){ if (slot==='model') continue; if (!id) continue; const r = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) }); if (r && r.error) throw new Error(r.error); }
          const wall = await api('/api/wallet'); const safe = (wall && !wall.error) ? wall : null; if (safe) _wallet = safe;
          try { localStorage.setItem('equippedSnapshot', JSON.stringify(want)); } catch {}
          renderPreview(); try { _cats = categoriesFrom(_items); renderCats(_cats); } catch {} renderItems(); if (status) status.textContent = 'Applied ?'; try { let png=null; if (window.__useTV && window.TV && TV.snapshot) png = TV.snapshot(); const mv=document.getElementById('mvShop'); if(!png && mv && mv.toBlob){ const blob=await mv.toBlob({ mimeType:'image/png' }); png = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); }); } if (png) localStorage.setItem('equippedPreviewPNG', png); } catch {}
          if (navigateAfter) { try{ location.href = 'lesson.html?lesson=greetings-001'; }catch{} }
        } catch (e) { if (status) status.textContent = 'Apply failed'; alert('Apply failed: ' + (e&&e.message?e.message:String(e))); }
        finally { if (btn) btn.disabled = false; if (btnNav) btnNav.disabled = false; setTimeout(()=>{ try{ if (status) status.textContent=''; }catch{} }, 1200); }
      }
      if (btn && !btn.__wired) { btn.__wired=true; btn.addEventListener('click', applyEquip); }
      if (btnNav && !btnNav.__wired) { btnNav.__wired=true; btnNav.addEventListener('click', ()=>applyEquip(true)); }
    })();
    function bindActions(){
      catalogEl.querySelectorAll('[data-buy]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-buy');
        const res = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        // Auto-equip cosmetics on purchase for preview
        if (id.startsWith('cos-')) {
          await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        }

      }));
      catalogEl.querySelectorAll('[data-equip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-equip');
        if (e.currentTarget.disabled) return;
        try {
          const it = (_items||[]).find(x=>x.id===id);
          const slot = it && it.slot;
          // Shift/Alt-click: layer in preview only (no server call)
          if ((e.shiftKey || e.altKey) && slot) {
            _wallet.equipped = _wallet.equipped || {};
            const cur = _wallet.equipped[slot];
            if (slot==='misc' && isArmorArm(id)) {
              const merged = Array.isArray(cur) ? cur.slice() : (cur ? [cur] : []);
              if (!merged.includes(id)) merged.push(id);
              _wallet.equipped[slot] = merged;
              saveArmorArmsLocal(merged);
            } else {
              if (Array.isArray(cur)) {
                if (!cur.includes(id)) cur.push(id);
              } else if (cur) {
                if (cur !== id) _wallet.equipped[slot] = [cur, id];
              } else {
                _wallet.equipped[slot] = id;
              }

            renderPreview();
            renderItems();
            return;

          // Auto-buy if not owned
          const ownedMap = _wallet.owned || {};
          if (!ownedMap[id]) {
            const buy = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
            if (buy && buy.error) { alert(buy.error); return; }
            _wallet.owned = buy?.owned || _wallet.owned || {};
          }
          // Immediate local preview: if equipping a model, clear all other slots now
          if (slot === 'model') {
            _wallet.equipped = { model: id };
            renderPreview();
            try { _cats = categoriesFrom(_items); renderCats(_cats); } catch {}
          }
          const res = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
          if (res && res.error) {
            const err = String(res.error||'');
            if (/401|unauthor/i.test(err)) {
              // Guest mode fallback: apply locally only
              if (it && it.slot) {
                if (slot === 'model') { _wallet.equipped = { model: id }; }
                else {
                  _wallet.equipped = _wallet.equipped || {};
                  if (slot==='misc' && isArmorArm(id)) {
                    const cur = _wallet.equipped[it.slot];
                    const merged = Array.isArray(cur) ? cur.slice() : (cur ? [cur] : []);
                    if (!merged.includes(id)) merged.push(id);
                    _wallet.equipped[it.slot] = merged;
                    saveArmorArmsLocal(merged);
                  } else {
                    _wallet.equipped[it.slot] = id;
                  }
                }
              }
            } else {
              alert(res.error); return;
            }
          } else {
            // Optimistic UI update when server accepted
            if (it && it.slot) {
              if (slot === 'model') { _wallet.equipped = { model: id }; }
              else {
                _wallet.equipped = _wallet.equipped || {};
                if (slot==='misc' && isArmorArm(id)) {
                  const cur = _wallet.equipped[it.slot];
                  const merged = Array.isArray(cur) ? cur.slice() : (cur ? [cur] : []);
                  if (!merged.includes(id)) merged.push(id);
                  _wallet.equipped[it.slot] = merged;
                  saveArmorArmsLocal(merged);
                } else {
                  _wallet.equipped[it.slot] = id;
                }
              }
            }
          }
          renderPreview();
          // Rebuild categories after model change to ensure upgrades show correctly
          try { if (slot === 'model') { _cats = categoriesFrom(_items); renderCats(_cats); } } catch {}
          renderItems();
          // Avoid full reload to prevent flicker
        } catch (err) { console.error('Equip failed', err); }
      }));
      catalogEl.querySelectorAll('[data-unequip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-unequip');
        if (e.currentTarget.disabled) return;
        try {
          const it = (_items||[]).find(x=>x.id===id);
          const slot = it && it.slot;
          if (slot && Array.isArray((_wallet.equipped||{})[slot])) {
            const arr = _wallet.equipped[slot];
            const nextArr = arr.filter(x=>x!==id);
            if (slot==='misc' && isArmorArm(id)) {
              saveArmorArmsLocal(nextArr);
              _wallet.equipped[slot] = nextArr;
            } else {
              _wallet.equipped[slot] = nextArr.length===1 ? nextArr[0] : nextArr;
            }
          } else {
            const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
            if (res && res.error) {
              const err = String(res.error||'');
              if (/401|unauthor/i.test(err)) {
                // Guest mode fallback: remove locally only
                if (it && it.slot && _wallet.equipped) {
                  delete _wallet.equipped[it.slot];
                  if (slot==='misc' && isArmorArm(id)) saveArmorArmsLocal([]);
                }
              } else {
                alert(res.error); return;
              }
            } else {
              // Optimistic UI update on success
              if (it && it.slot && _wallet.equipped) {
                delete _wallet.equipped[it.slot];
                if (slot==='misc' && isArmorArm(id)) saveArmorArmsLocal([]);
              }
            }
          }
          renderPreview();
          renderItems();
          // Avoid full reload to prevent flicker
        } catch (err) { console.error('Unequip failed', err); }
      }));
    }

      } catch {}
      
      try { applyEyeColorFromStorage(); } catch {}

      try { applyBootColorFromStorage(); } catch {}
      try { applyBagColorFromStorage(); } catch {}
      try { buildPoseControls(); } catch {}
      try { ensurePoseSnapshots(); } catch {}
      try { applyPoseSelection().catch(()=>{}); } catch {}
    })();

    loadAll();
