<html lang="en">

<body class="anime-bg min-h-screen p-5">
  <main class="max-w-5xl mx-auto">
    <header class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">

      </div>
      <div class="text-sm">Coins: <strong id="coins">0</strong></div>
    </header>

    <section class="manga-bubble p-3">
      <!-- 3-column layout: categories (L) | preview (C) | items list (R) -->
      <div class="shop-grid items-start">
        <!-- Categories -->
        <aside class="max-h-[70vh] overflow-auto pr-1">
          <div class="font-medium mb-2">Categories</div>
          <div id="catList" class="flex md:flex-col gap-2 overflow-x-auto pb-1"></div>
        </aside>

        <!-- Preview (sticky) -->
        <div class="flex items-start justify-center sm:sticky top-2">
          <div class="text-center">
            <div id="mvWrap" class="inline-block relative" style="display:none; width:200px; height:220px; overflow:hidden; z-index:1;">
              <model-viewer id="mvShop" class="float-slow absolute inset-0" camera-controls exposure="1" shadow-intensity="0.6" interaction-prompt="none"></model-viewer>
            </div>
            <div id="tvWrap" class="inline-block relative" style="display:none; width:200px; height:220px; overflow:hidden; z-index:1;"></div>
            <div id="equipSummary" class="text-xs text-gray-700 mt-1"></div>
            <div id="equipChips" class="flex flex-wrap gap-1 justify-center mt-1"></div>
            <div class="mt-2">
              <button id="anchorDebugToggle" class="btn btn-ghost text-xs">Anchor Debug</button>
            </div>
            <div id="anchorDebug" class="hidden text-left text-xs mt-2 p-2 border-2 border-black bg-white rounded">
              <div class="mb-1 font-semibold">Adjust Slot</div>
              <div class="mb-1">Slot:
                <select id="adSlot" class="border px-1 py-0.5 text-xs"></select>
              </div>
              <div class="grid grid-cols-3 gap-1 mb-1">
                <label>X <input id="adPosX" type="number" step="0.005" class="border px-1 py-0.5 w-20"></label>
                <label>Y <input id="adPosY" type="number" step="0.005" class="border px-1 py-0.5 w-20"></label>
                <label>Z <input id="adPosZ" type="number" step="0.005" class="border px-1 py-0.5 w-20"></label>
              </div>
              <div class="grid grid-cols-3 gap-1 mb-1">
                <label>RotX� <input id="adRotX" type="number" step="1" class="border px-1 py-0.5 w-20"></label>
                <label>RotY� <input id="adRotY" type="number" step="1" class="border px-1 py-0.5 w-20"></label>
                <label>RotZ� <input id="adRotZ" type="number" step="1" class="border px-1 py-0.5 w-20"></label>
              </div>
              <div class="mb-1">
                <label>Scale <input id="adScale" type="number" step="0.01" class="border px-1 py-0.5 w-24"></label>
              </div>
              <div class="flex gap-2">
                <button id="adApply" class="btn btn-primary text-xs">Apply</button>
                <button id="adReset" class="btn btn-amber text-xs">Reset</button>
                <button id="adLog" class="btn btn-ghost text-xs">Log Nodes</button>
              </div>
              <div id="adInfo" class="mt-1 text-gray-600"></div>
            </div>
            <div class="text-xs text-gray-600 mt-2">Tap a category and equip/buy to preview.</div>
          </div>
        </div>

        <!-- Items list -->
        <div class="max-h-[70vh] overflow-auto pr-1" id="itemsPane">
          <div class="font-medium mb-2" id="catTitle">Items</div>
          <div id="catalog" class="grid grid-cols-1 gap-2"></div>
        </div>
      </div>
    </section>

    <div class="mt-3 flex items-center gap-2">
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const catalogEl = $('#catalog');
    const coinsEl = $('#coins');
    const tutorLink = $('#tutorLink');
    const catList = $('#catList');
    const catTitle = $('#catTitle');
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        try { if (history.length > 1) history.back(); else location.href = 'lesson.html'; }
        catch (e) { location.href = 'lesson.html'; }
      });
    }

    // Anchor Debug toggle + Log wiring
    (function(){
      const anchorToggle = document.getElementById('anchorDebugToggle');
      if (anchorToggle && !anchorToggle.__wired) {
        anchorToggle.__wired = true;
        anchorToggle.addEventListener('click', ()=>{
          const panel = document.getElementById('anchorDebug');
          if (!panel) return;
          if (panel.classList.contains('hidden')) panel.classList.remove('hidden'); else panel.classList.add('hidden');
        });
      }
      const adLog = document.getElementById('adLog');
      if (adLog && !adLog.__wired) {
        adLog.__wired = true;
        adLog.addEventListener('click', ()=>{
          try {
            let names = [];
            if (window.__useTV && window.TV && typeof window.TV.getNodeNames === 'function') {
              names = window.TV.getNodeNames()||[];
            } else if (window.__ofp && typeof window.__ofp.getNodeNames === 'function') {
              names = window.__ofp.getNodeNames()||[];
            }
            const info = document.getElementById('adInfo');
            if (info) info.textContent = (names && names.length) ? ('Nodes: ' + names.join(', ')) : 'No nodes or model not loaded yet.';
            console.log('[Anchor Debug] Model nodes:', names);
          } catch (e) {}
        });
      }
    })();

    // No 2D mascot fallback; preview shows only 3D models

    async function api(path, opts){
      try {
        const url = (typeof path === 'string')
          ? (path.startsWith('http') ? path : new URL(path, location.origin).toString())
          : String(path||'');
        const r = await fetch(url, opts||{});
        let data = null;
        try { data = await r.json(); } catch (e) { data = null; }
        if (!r.ok) return data || { ok:false, error: `HTTP ${r.status}` };
        return data;
      } catch (e) {
        console.warn('api failed', path, e);
        return { ok:false, error: String(e) };
      }
    }
    let SELECTED = 'upgrades';
    const FORCE_OVERLAY_SLOT = 'top';
    // Scene-graph attachment: slot anchors (approximate). Adjust as needed.
    const SLOT_ANCHORS_DEFAULT = {
      // General body regions
      head:  { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      torso: { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      body:  { position:[0, 0.00, 0], rotation:[0,0,0], scale:[1,1,1] },
      legs:  { position:[0, -0.06, 0], rotation:[0,0,0], scale:[1,1,1] },
      feet:  { position:[0, -0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      arms:  { position:[0.02, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      hands: { position:[0.04, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      // Clothing synonyms
      hat:   { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      hair:  { position:[0, 0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      mask:  { position:[0, 0.08, 0.06], rotation:[0,0,0], scale:[1,1,1] },
      top:   { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      outfit:{ position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] },
      boots: { position:[0, -0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      skirt: { position:[0, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      belt:  { position:[0, -0.01, 0.01], rotation:[0,0,0], scale:[1,1,1] },
      bag:   { position:[-0.05, 0.02, -0.03], rotation:[0,0,0], scale:[1,1,1] },
      misc:  { position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] }
    };
    // Accessory pool (offscreen model-viewers) to load GLBs for scene-graph cloning
    const accPool = document.createElement('div'); accPool.id = 'accPool';
    accPool.style.position = 'absolute'; accPool.style.left = '-9999px'; accPool.style.top = '0'; accPool.style.width = '1px'; accPool.style.height = '1px'; accPool.style.overflow = 'hidden';
    document.body.appendChild(accPool);
    const accCache = new Map(); // id -> { mv, ready:Promise }
    async function accessoryViewerFor(id, src){
      let rec = accCache.get(id);
      if (rec && rec.mv && rec.mv.getAttribute('src') === src) return rec;
      // Ensure custom element is defined
      try { if (window.customElements && window.customElements.whenDefined) await window.customElements.whenDefined('model-viewer'); } catch {}
      const mv = document.createElement('model-viewer');
      mv.setAttribute('src', src);
      mv.setAttribute('reveal','auto');
      mv.setAttribute('preload','true');
      mv.style.width = '1px'; mv.style.height = '1px';
      accPool.appendChild(mv);
      const ready = new Promise(res=>{
        const done = ()=>{ try { res(mv); } catch { res(mv); } };
        let settled = false;
        const mark = (label)=>{ try { console.log('[attach] event', label, src); } catch(_){} };
        const tryDone = ()=>{
          try {
            if (settled) return;
            if (mv && mv.model && (mv.model.scene || mv.scene)) { settled = true; return setTimeout(done, 0); }
          } catch {}
        };
        try { if (mv && (mv.model && (mv.model.scene || mv.scene))) { settled=true; return done(); } } catch {}
        try { mv.addEventListener('load', ()=>{ mark('load'); tryDone(); }, { once: true }); } catch {}
        try { mv.addEventListener('scene-graph-ready', ()=>{ mark('scene-graph-ready'); tryDone(); }, { once: true }); } catch {}
        // Fallback poll
        let t0 = Date.now();
        (function poll(){
          tryDone();
          if (settled) return;
          if (Date.now() - t0 > 7000) { settled=true; return done(); }
          try { window.requestAnimationFrame(poll); } catch { setTimeout(poll, 50); }
        })();
      });
      rec = { mv, ready }; accCache.set(id, rec); return rec;
    }
    function getBaseRoot(mv){ try { return (mv && mv.model && mv.model.scene) ? mv.model.scene : null; } catch (e) { return null; } }
    function getSceneFromViewer(mv){ try { return (mv && mv.model && mv.model.scene) ? mv.model.scene : null; } catch (e) { return null; } }
    function getThree(){ try { return (window.__THREE||window.THREE||null); } catch (e) { return null; } }
    function computeBounds(root){ try { const THREE = getThree(); if(!THREE||!root) return null; const box = new THREE.Box3(); let has=false; root.updateWorldMatrix?.(true,true); root.traverse?.(o=>{ try{ if (o.isMesh && o.geometry){ if(!o.geometry.boundingBox && o.geometry.computeBoundingBox) o.geometry.computeBoundingBox(); const bb = o.geometry.boundingBox && o.geometry.boundingBox.clone(); if (bb){ bb.applyMatrix4(o.matrixWorld); if(has) box.union(bb); else { box.copy(bb); has=true; } } } }catch(_){}}); return has?box:null; } catch (e) { return null; } }
    function clearAttachments(mv){ try { (mv.__attachments||[]).forEach(obj=>{ try { const root=getBaseRoot(mv); if(root && obj && obj.parent===root) root.remove(obj); } catch (e) {} }); mv.__attachments=[]; } catch (e) { mv.__attachments=[]; } }
    async function attachAccessoriesToBase(mv, equip, itemsMap){
      try {
        let root = getBaseRoot(mv);
        if(!root){
          // Wait for model-viewer to finish building the scene graph
          await new Promise(res=>{
            let done=false;
            const finish=()=>{ if(done) return; done=true; res(); };
            try { mv.addEventListener('scene-graph-ready', finish, { once:true }); } catch {}
            try { mv.addEventListener('load', finish, { once:true }); } catch {}
            setTimeout(finish, 1000);
          });
          try{ await mv.updateComplete; }catch(e){}
          root = getBaseRoot(mv);
          if(!root || typeof root.add !== 'function') { try{ console.warn('[attach] no root or add() missing'); }catch(_){} return false; }
        }
        clearAttachments(mv);
        const slots = Object.keys(equip||{}).filter(s=>s!=='model');
        try { console.log('[attach] slots', slots); } catch(_){ }
        const added = [];
        // Helper: load accessory GLB via Three.js if available
        async function loadWithThree(url){
          try {
            const THREE = getThree(); if (!THREE || !window.__GLTFLoader) return null;
            const loader = new window.__GLTFLoader();
            return await new Promise((resolve) => {
              try {
                loader.load(url, (gltf)=>{ try { console.log('[attach] three loaded', url); resolve(gltf && gltf.scene ? gltf.scene : null); } catch { resolve(null); } }, undefined, (err)=>{ console.warn('[attach] three load error', url, err); resolve(null); });
              } catch { resolve(null); }
            });
          } catch { return null; }
        }
        for (const slot of slots){
          const it = itemsMap.get(equip[slot]);
          if(!it || !it.model){ try{ console.warn('[attach] missing item for slot', slot, equip[slot]); }catch(_){} continue; }
          try { console.log('[attach] loading', slot, it.id, it.model); } catch(_){ }
          // Probe that the GLB is reachable to surface network entries
          try { const head = await fetch(it.model, { method:'HEAD', cache:'no-store' }); console.log('[attach] probe', head.status, it.model); } catch (e) { console.warn('[attach] probe failed', it.model, e); }
          try {
            // Try Three.js loader first
            let srcScene = await loadWithThree(it.model);
            if (!srcScene) {
              const rec = await accessoryViewerFor(it.id, it.model);
              await rec.ready;
              srcScene = getSceneFromViewer(rec.mv);
            }
            if(!srcScene){ console.warn('[attach] no srcScene', it.id); continue; }
            let obj = null;
            try {
              if (typeof srcScene.clone === 'function') obj = srcScene.clone(true);
            } catch (err) {
              console.warn('[attach] clone failed', err);
              obj = null;
            }
            if (!obj) {
              try {
                const first = (srcScene.children && srcScene.children[0]) || null;
                if (first && typeof first.clone === 'function') obj = first.clone(true);
              } catch (e) { obj = null; }
            }
            if (!obj) { console.warn('[attach] nothing cloneable for', it.id); continue; }
            const anchors = (window.SLOT_ANCHORS || SLOT_ANCHORS_DEFAULT);
            const a = anchors[slot] || anchors.misc;
            // Attach first so world matrices are valid
            try { root.add(obj); } catch (e) { console.warn('[attach] add failed', e); continue; }
            // Auto-scale: try precise, else fallback defaults
            try {
              const baseBox = computeBounds(root);
              const accBox0 = computeBounds(obj);
              if (baseBox && accBox0) {
                const baseH = Math.max(1e-6, baseBox.max.y - baseBox.min.y);
                const accH  = Math.max(1e-6, accBox0.max.y - accBox0.min.y);
                var target = (slot==='top' || slot==='torso' || slot==='body') ? 0.35 : 0.25;
                var s = (target * baseH) / accH;
                if (isFinite(s) && s>0 && s<10) obj.scale.set(s,s,s); else obj.scale.set(target,target,target);
              } else {
                var def = (slot==='top' || slot==='torso' || slot==='body') ? 0.35 : 0.25;
                obj.scale.set(def,def,def);
              }
            } catch (e) {
              var def2 = (slot==='top' || slot==='torso' || slot==='body') ? 0.35 : 0.25;
              try { obj.scale.set(def2,def2,def2); } catch(_){ }
            }
            try { if (obj.position) obj.position.set(a.position[0], a.position[1], a.position[2]); } catch(_){}
            try { if (obj.rotation) obj.rotation.set(a.rotation[0], a.rotation[1], a.rotation[2]); } catch(_){}
            added.push(obj);
          } catch (e) { console.warn('[attach] slot failed', slot, e); }
        }
        mv.__attachments = added;
        try { console.log('[attach] attached count', added.length); } catch(_){ }
        return added.length > 0;
      } catch (e) { return false; }
    }

    // ---------- Lightweight Three.js viewer fallback ----------
    const TV = (function(){
      let initialized = false, scene=null, camera=null, renderer=null, baseGroup=null, attachGroup=null, controls=null;
      function init(){
        if (initialized) return true;
        const THREE = getThree(); if (!THREE) return false;
        const wrap = document.getElementById('tvWrap'); if(!wrap) return false;
        const w = wrap.clientWidth||200, h = wrap.clientHeight||220;
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(25, w/h, 0.01, 100);
        camera.position.set(0, 0.35, 1.0);
        const amb = new THREE.AmbientLight(0xffffff, 0.9); scene.add(amb);
        const dir = new THREE.DirectionalLight(0xffffff, 0.6); dir.position.set(1,1,1); scene.add(dir);
        renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:false, powerPreference:'low-power' });
        renderer.setSize(w, h, false);
        renderer.setPixelRatio(1);
        wrap.innerHTML = '';
        wrap.appendChild(renderer.domElement);
        attachGroup = new THREE.Group(); scene.add(attachGroup);
        try { if (window.__OrbitControls) { controls = new window.__OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0,0.1,0); } } catch(_){ }
        function tick(){ try { if(controls) controls.update(); renderer.render(scene, camera); } catch (_) {} requestAnimationFrame(tick); }
        requestAnimationFrame(tick);
        initialized = true; return true;
      }
      function clear(){ try { const THREE = getThree(); if(!THREE) return; if (baseGroup) { scene.remove(baseGroup); baseGroup=null; } while(attachGroup && attachGroup.children.length){ attachGroup.remove(attachGroup.children[0]); } } catch(_){}
      }

      \ \ \ \ \ \ async\ function\ attachAll\(equip,\ itemsMap,\ anchors\)\{

\ \ \ \ \ \ \ \ const\ slots\ =\ Object\.keys\(equip\|\|\{}\)\.filter\(s=>s!=='model'\);
\ \ \ \ \ \ \ \ for\ \(const\ slot\ of\ slots\)\{
\ \ \ \ \ \ \ \ \ \ const\ it\ =\ itemsMap\.get\(equip\[slot]\);\ if\(!it\|\|!it\.model\)\ continue;

\ \ \ \ \ \ \ \ \ \ const\ a\ =\ \(anchors\[slot]\|\|anchors\.misc\);
\ \ \ \ \ \ \ \ \ \ try\ \{
\ \ \ \ \ \ \ \ \ \ \ \ const\ boxBase\ =\ new\ THREE\.Box3\(\)\.setFromObject\(baseGroup\);
\ \ \ \ \ \ \ \ \ \ \ \ const\ boxObj\ =\ new\ THREE\.Box3\(\)\.setFromObject\(src\);
\ \ \ \ \ \ \ \ \ \ \ \ const\ baseH=Math\.max\(1e-6,\ boxBase\.max\.y-boxBase\.min\.y\);
\ \ \ \ \ \ \ \ \ \ \ \ const\ objH=Math\.max\(1e-6,\ boxObj\.max\.y-boxObj\.min\.y\);
\ \ \ \ \ \ \ \ \ \ \ \ let\ target=\(slot==='top'\|\|slot==='torso'\|\|slot==='body'\)\?0\.35:0\.25;
\ \ \ \ \ \ \ \ \ \ \ \ let\ sAuto=\(target\*baseH\)/objH;
\ \ \ \ \ \ \ \ \ \ \ \ const\ s\ =\ \(a\.scale\ &&\ a\.scale\[0]\)\ \?\ a\.scale\[0]\ :\ \(isFinite\(sAuto\)&&sAuto>0&&sAuto<10\ \?\ sAuto\ :\ target\);
\ \ \ \ \ \ \ \ \ \ \ \ wrap\.scale\.set\(s,s,s\);
\ \ \ \ \ \ \ \ \ \ }\ catch\(_\)\ \{\ let\ def=\(slot==='top'\|\|slot==='torso'\|\|slot==='body'\)\?0\.35:0\.25;\ wrap\.scale\.set\(def,def,def\);\ }
\ \ \ \ \ \ \ \ \ \ //\ Transform
\ \ \ \ \ \ \ \ \ \ try\ \{\ wrap\.position\.set\(a\.position\[0],\ a\.position\[1],\ a\.position\[2]\);\ }\ catch\(_\)\{\ }
\ \ \ \ \ \ \ \ \ \ try\ \{\ wrap\.rotation\.order\ =\ 'XYZ';\ wrap\.rotation\.set\(a\.rotation\[0],\ a\.rotation\[1],\ a\.rotation\[2]\);\ }\ catch\(_\)\{\ }
\ \ \ \ \ \ \ \ \ \ attachGroup\.add\(wrap\);
\ \ \ \ \ \ \ \ }
\ \ \ \ \ \ \ \ return\ true;
\ \ \ \ \ \ }
      function getNodeNames(){ try { const out=[]; const THREE=getThree(); if(!THREE||!baseGroup) return []; baseGroup.traverse?.(o=>{ if(o && o.name) out.push(o.name); }); return out; } catch { return []; } }
      return { init, loadBase, attachAll, getNodeNames };
    })();
    function categoriesFrom(items){
      const cats = [];
      if ((items||[]).some(it=>it.kind==='upgrade')) cats.push({ id:'upgrades', label:'Upgrades', filter:(it)=>it.kind==='upgrade' });
      // Characters category
      if ((items||[]).some(it=>it.kind==='cosmetic' && it.slot==='model')) cats.push({ id:'model', label:'Characters', filter:(it)=>it.kind==='cosmetic' && it.slot==='model' });
      // Dynamic clothing categories by slot
      const slots = Array.from(new Set((items||[]).filter(it=>it.kind==='cosmetic' && it.slot && it.slot!=='model').map(it=>it.slot)));
      const names = { outfit:'Outfits', hat:'Hats', hair:'Hair', mask:'Masks', top:'Tops', legs:'Legwear', boots:'Boots', skirt:'Skirts', belt:'Belts', bag:'Bags', misc:'Accessories' };
      const labelFor = (s)=> names[s] || (s.charAt(0).toUpperCase()+s.slice(1));
      slots.forEach(s=> cats.push({ id:s, label:labelFor(s), filter:(it)=>it.kind==='cosmetic' && it.slot===s }));
      return cats;
    }
    function renderCats(cats){
      catList.innerHTML = '';
      cats.forEach(c=>{
        const b = document.createElement('button');
        b.className = 'btn btn-ghost text-sm whitespace-nowrap ' + (SELECTED===c.id ? 'ring-2' : '');
        b.textContent = c.label; b.dataset.id = c.id;
        b.addEventListener('click', ()=>{ SELECTED = c.id; catTitle.textContent = c.label; renderItems(); });
        catList.appendChild(b);
      });
      const cur = cats.find(x=>x.id===SELECTED) || cats[0];
      if (cur) catTitle.textContent = cur.label;
    }
    let _items = [], _wallet = { coins:0, owned:{}, equipped:{} }, _cats = [];
    async function loadAll(){
      const [cat, wall] = await Promise.all([
        api('/api/shop/catalog'),
        api('/api/wallet')
      ]).catch(()=>[{items:[]},{coins:0,owned:{},equipped:{}}]);
      _items = cat.items||[];
      const safeWall = (wall && !wall.error) ? wall : { coins:0, owned:{}, equipped:{} };
      _wallet = safeWall;
      // Ensure a default model is selected client-side if server view omitted it
      try {
        if (!_wallet.equipped || !_wallet.equipped.model) {
          const hasStudent = (_items||[]).some(x=>x.id==='model-student');
          if (hasStudent) {
            _wallet.equipped = Object.assign({}, _wallet.equipped||{}, { model:'model-student' });
          }
        }
      } catch (e) {}
      coinsEl.textContent = String(_wallet.coins||0);
      renderPreview();
      _cats = categoriesFrom(_items);
      renderCats(_cats);
      renderItems();
    }

    async function renderPreview(){
      const equip = _wallet.equipped||{};
      const itemsMap = new Map((_items||[]).map(x=>[x.id,x]));
      const mv = document.getElementById('mvShop');
      // Build summary list safely
      const eqList = [];
      try { if (mv && !mv.__dbg) { mv.__dbg=true; mv.addEventListener('load', ()=>{ try { console.log('[shop] model-viewer load fired'); } catch(e){} }, { once:false }); } } catch(e){}
      // Prefer 3D model when available
      try {
        const modelItem = equip.model && itemsMap.get(equip.model);
        try { console.log('[shop] equip.model =', equip.model, 'modelItem:', !!modelItem && modelItem.model); } catch(e){}
        if (modelItem && modelItem.model && mv) {
          // Use Three.js fallback viewer (preferred)
          const tvOk = TV && TV.init && TV.init();
          if (tvOk) {
            try {
              window.__useTV = true;
              const tvWrap = document.getElementById('tvWrap'); if (tvWrap) tvWrap.style.display='inline-block';
              const mvWrap = document.getElementById('mvWrap'); if (mvWrap) mvWrap.style.display='none';
              await TV.loadBase(modelItem.model);
              const ov = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch(_){ return {}; } })();
              const anchors = Object.assign({}, (window.SLOT_ANCHORS || SLOT_ANCHORS_DEFAULT), ov);
              await TV.attachAll(equip, itemsMap, anchors);
            } catch (_){ }
          } else {
            mv.src = modelItem.model;
            try { console.log('[shop] set mv.src =', modelItem.model); } catch(e){}
            // Kick an early fallback attach pass as soon as a model is set
            try { setTimeout(()=>{ try { if (!window.__useTV) attachAccessoriesToBase(mv, equip, itemsMap); } catch(e){} }, 0); } catch(e){}
            (function(){ const wrap=document.getElementById('mvWrap'); if(wrap) wrap.style.display='inline-block'; })();
          }
          // 3D only
          try { mv.pause(); } catch (e) {}
          // Nudge animation to show change
          try { mv.classList.remove('animate-pulse'); void mv.offsetWidth; mv.classList.add('animate-pulse'); setTimeout(()=>mv.classList.remove('animate-pulse'), 300); } catch (e) {}
        } else { const wrap=document.getElementById('mvWrap'); if(wrap) wrap.style.display='none'; }
      } catch (e) {}
      // Attach clothing via plugin (scene-graph)
      try {
        function loadAnchorOverrides(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch (e) { return {}; } }
        const overrides = loadAnchorOverrides();
        if (!window.__ofp || typeof window.__ofp.attachAll !== 'function' || typeof window.__ofp.setOverrides !== 'function') {
          if (window.OutfitPreview) {
            window.__ofp = window.OutfitPreview.create({ mv: mv, overrides });
          } else {
            console.warn('OutfitPreview plugin not found');
            // Fallback: try local attach helper
            try { if (!window.__useTV) await attachAccessoriesToBase(mv, equip, itemsMap); } catch (e) {}
          }
        } else {
          try { window.__ofp.state.mv = mv; } catch (e) {}
        }
        if (window.__ofp) {
          try { window.__ofp.setOverrides(overrides); } catch (e) {}
          window.__ofp.update(equip, _items||[]);
          await window.__ofp.attachAll();
          try {
            const root = getBaseRoot(mv);
            const hasAny = Array.isArray(mv.__attachments) ? mv.__attachments.length>0 : (root && root.children && root.children.length>0);
            if (!hasAny) { if (!window.__useTV) await attachAccessoriesToBase(mv, equip, itemsMap); }
          } catch (e) {}
        }
        // Always run local fallback once to force accessory GLB requests for debugging
        try { if (!window.__useTV) await attachAccessoriesToBase(mv, equip, itemsMap); } catch (e) { console.warn('fallback attach error', e); }
      } catch (e) { console.warn('preview attach failed', e); }
        try {
          Object.keys(equip||{}).forEach(slot => {
           if (slot==='model') return;
           const it = itemsMap.get(equip[slot]);
           if (it) eqList.push(`${slot}: ${it.name}`);
          });
          const sum = document.getElementById('equipSummary');
          if (sum) sum.textContent = eqList.length ? ('Equipped: ' + eqList.join(' | ')) : '';
        } catch (e) {}
      // No fallback preview
      // Render equipped chips with quick remove buttons + refresh Anchor panel slots
      try {
        const chips = document.getElementById('equipChips');
        while (chips.firstChild) chips.removeChild(chips.firstChild);
        const slotsEquipped = Object.keys(equip||{}).filter(s=>s!=='model');
        slotsEquipped.forEach(slot => {
          if (slot==='model') return;
          const it = itemsMap.get(equip[slot]);
          if (!it) return;
          const b = document.createElement('button');
          b.className = 'btn btn-ghost text-xs';
          b.innerHTML = `${it.name} <span aria-hidden="true">x</span>`;
          b.title = `Remove ${it.name}`;
          b.addEventListener('click', async ()=>{
            try {
              const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ slot }) });
              if (!res.ok && res.error) { alert(res.error); return; }
              _wallet.equipped = res.equipped || _wallet.equipped || {};
              renderPreview();
              renderItems();
            } catch (e) {}
          });
          chips.appendChild(b);
        });
        // Anchor Debug: populate slot list
        try {
          const sel = document.getElementById('adSlot');
          const posX = document.getElementById('adPosX');
          const posY = document.getElementById('adPosY');
          const posZ = document.getElementById('adPosZ');
          const rotX = document.getElementById('adRotX');
          const rotY = document.getElementById('adRotY');
          const rotZ = document.getElementById('adRotZ');
          const scale = document.getElementById('adScale');
          const applyBtn = document.getElementById('adApply');
          const resetBtn = document.getElementById('adReset');
          if (sel) {
            const prev = sel.value;
            sel.innerHTML='';
            slotsEquipped.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
            if (prev && slotsEquipped.includes(prev)) sel.value = prev; else if (slotsEquipped[0]) sel.value = slotsEquipped[0];
            const ov = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch(e){ return {}; } })();
            const slot = sel.value;
            const a = ov[slot] || { position:[0,0.05,0], rotation:[0,0,0], scale:[1,1,1] };
            if (posX) posX.value = a.position[0]||0;
            if (posY) posY.value = a.position[1]||0.05;
            if (posZ) posZ.value = a.position[2]||0;
            if (rotX) rotX.value = Math.round((a.rotation[0]||0)*180/Math.PI);
            if (rotY) rotY.value = Math.round((a.rotation[1]||0)*180/Math.PI);
            if (rotZ) rotZ.value = Math.round((a.rotation[2]||0)*180/Math.PI);
            if (scale) scale.value = (a.scale && a.scale[0]) || 1;
            sel.onchange = ()=>{ try { const ov2 = JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; const slot2 = sel.value; const a2 = ov2[slot2] || { position:[0,0.05,0], rotation:[0,0,0], scale:[1,1,1] }; if(posX) posX.value=a2.position[0]||0; if(posY) posY.value=a2.position[1]||0.05; if(posZ) posZ.value=a2.position[2]||0; if(rotX) rotX.value=Math.round((a2.rotation[0]||0)*180/Math.PI); if(rotY) rotY.value=Math.round((a2.rotation[1]||0)*180/Math.PI); if(rotZ) rotZ.value=Math.round((a2.rotation[2]||0)*180/Math.PI); if(scale) scale.value=(a2.scale && a2.scale[0])||1; } catch(e){} };
            if (applyBtn && !applyBtn.__wired) {
              applyBtn.__wired = true;
              applyBtn.addEventListener('click', async ()=>{
                try {
                  const slot3 = sel.value; if(!slot3) return;
                  const ov3 = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch(e){ return {}; } })();
                  const rx = Number(rotX?.value||0)*Math.PI/180, ry=Number(rotY?.value||0)*Math.PI/180, rz=Number(rotZ?.value||0)*Math.PI/180;
                  const s = Number(scale?.value||1) || 1;
                  ov3[slot3] = { position:[Number(posX?.value)||0, Number(posY?.value)||0.05, Number(posZ?.value)||0], rotation:[rx,ry,rz], scale:[s,s,s] };
                  localStorage.setItem('anchorOverrides', JSON.stringify(ov3));
                  if (window.__ofp && window.__ofp.setOverrides) { window.__ofp.setOverrides(ov3); await window.__ofp.attachAll(); }
                  try {
                    if (window.__useTV && TV && TV.attachAll) {
                      const map = new Map((_items||[]).map(x=>[x.id,x]));
                      const anchors = Object.assign({}, (window.SLOT_ANCHORS||SLOT_ANCHORS_DEFAULT), ov3);
                      await TV.attachAll(_wallet.equipped||{}, map, anchors);
                    }
                  } catch(_){}
                } catch(e){ console.warn('apply failed', e); }
              });
            }
            if (resetBtn && !resetBtn.__wired) {
              resetBtn.__wired = true;
              resetBtn.addEventListener('click', async ()=>{
                try {
                  const slot4 = sel.value; if(!slot4) return;
                  const ov4 = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch(e){ return {}; } })();
                  delete ov4[slot4]; localStorage.setItem('anchorOverrides', JSON.stringify(ov4));
                  if (window.__ofp && window.__ofp.setOverrides) { window.__ofp.setOverrides(ov4); await window.__ofp.attachAll(); }
                  try {
                    if (window.__useTV && TV && TV.attachAll) {
                      const map = new Map((_items||[]).map(x=>[x.id,x]));
                      const anchors = Object.assign({}, (window.SLOT_ANCHORS||SLOT_ANCHORS_DEFAULT), ov4);
                      await TV.attachAll(_wallet.equipped||{}, map, anchors);
                    }
                  } catch(_){}
                  sel.onchange();
                } catch(e){ console.warn('reset failed', e); }
              });
            }
          }
        } catch (e) {}
      } catch (e) {}
    }
    function cardHtml(it, owned, equipped){
      const ownedBadge = '<span class="text-green-700 text-xs">Owned</span>';
      const equipBtn = (disabled=false)=>`<button data-equip="${it.id}" class="btn btn-ghost btn-equip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Equip</button>`;
      const unequipBtn = (disabled=false)=>`<button data-unequip="${it.id}" class="btn btn-amber btn-unequip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Unequip</button>`;
      const buyBtn = `<button data-buy="${it.id}" class="btn btn-primary btn-buy">Buy</button>`;
      let action = buyBtn;
      if (owned[it.id]) {
        if (it.kind==='cosmetic') {
          const slot = it.slot;
          const isEquipped = equipped && equipped[slot] === it.id;
          action = `${equipBtn(false)} ${unequipBtn(!isEquipped)}`;
        } else {
          action = ownedBadge;
        }
      }
      const sub = it.kind==='upgrade' ? 'Upgrade' : (it.slot ? it.slot : 'Cosmetic');
      return `
        <div class="p-3 rounded-xl border-2 border-black bg-white shadow">
          <div class="font-semibold">${it.name}</div>
          <div class="text-xs text-gray-600 mb-2">${sub}</div>
          <div class="flex items-center justify-between">
            <div class="text-sm">Price: <strong>${it.price}</strong></div>
            <div class="flex items-center gap-2">${action}</div>
          </div>
        </div>`;
    }
    function renderItems(){
      const owned = _wallet.owned||{}; const equipped = _wallet.equipped||{};
      const cats = _cats;
      const cat = cats.find(c=>c.id===SELECTED) || cats[0];
      const list = (cat ? _items.filter(cat.filter) : _items);
      catalogEl.innerHTML='';
      list.forEach(it=>{
        const wrap = document.createElement('div');
        wrap.innerHTML = cardHtml(it, owned, equipped);
        const node = wrap.firstElementChild; catalogEl.appendChild(node);
      });
      try { if (owned['upgrade-tutor-basic'] && tutorLink) tutorLink.classList.remove('hidden'); else if (tutorLink) tutorLink.classList.add('hidden'); } catch (e) {}
      bindActions();
      try { document.getElementById('itemsPane').scrollTop = 0; } catch (e) {}
    }
    function bindActions(){
      catalogEl.querySelectorAll('[data-buy]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-buy');
        const res = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        // Auto-equip cosmetics on purchase for preview
        if (id.startsWith('cos-')) {
          await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        }
        loadAll();
      }));
      catalogEl.querySelectorAll('[data-equip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-equip');
        if (e.currentTarget.disabled) return;
        try {
          // Auto-buy if not owned
          const ownedMap = _wallet.owned || {};
          if (!ownedMap[id]) {
            const buy = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
            if (buy && buy.error) { alert(buy.error); return; }
            _wallet.owned = buy?.owned || _wallet.owned || {};
          }
          const res = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
          if (res && res.error) { alert(res.error); return; }
          // Optimistic UI update
          const it = (_items||[]).find(x=>x.id===id);
          if (it && it.slot) {
            _wallet.equipped = _wallet.equipped || {};
            _wallet.equipped[it.slot] = id;
          }
          renderPreview();
          renderItems();
          await loadAll();
        } catch (err) { console.error('Equip failed', err); }
      }));
      catalogEl.querySelectorAll('[data-unequip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-unequip');
        if (e.currentTarget.disabled) return;
        try {
          const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
          if (res && res.error) { alert(res.error); return; }
          // Optimistic UI update
          const it = (_items||[]).find(x=>x.id===id);
          if (it && it.slot && _wallet.equipped) delete _wallet.equipped[it.slot];
          renderPreview();
          renderItems();
          await loadAll();
        } catch (err) { console.error('Unequip failed', err); }
      }));
    }

    loadAll();
  </script>
