<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader – Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
</head>
<body class="anime-bg min-h-screen p-5">
  <main class="max-w-3xl mx-auto">
    <header class="flex items-center justify-between mb-4">
      <h1 class="site-title text-2xl font-bold accent-underline">Shop</h1>
      <div class="text-sm">Coins: <strong id="coins">0</strong></div>
    </header>

    <section class="manga-bubble p-4 mb-4">
      <div class="font-medium mb-2">Preview</div>
      <div class="flex items-center gap-6">
        <div id="mascotPreview" class="w-14 h-16" style="transform:scale(0.55); transform-origin: top left;">
          <!-- same basic mascot with cosmetic hooks -->
          <svg viewBox="0 0 100 120" class="w-full h-full" aria-hidden="true">
            <rect x="28" y="62" width="44" height="34" rx="10" fill="#FFD166" stroke="#E0A700" stroke-width="2" />
            <path d="M28 72 q-10 6 -12 0" fill="none" stroke="#E0A700" stroke-width="3" stroke-linecap="round" />
            <path d="M72 72 q10 6 12 0" fill="none" stroke="#E0A700" stroke-width="3" stroke-linecap="round" />
            <rect x="40" y="98" width="8" height="8" rx="3" fill="#333" />
            <rect x="52" y="98" width="8" height="8" rx="3" fill="#333" />
            <circle cx="50" cy="50" r="24" fill="#FFD166" stroke="#E0A700" stroke-width="2" />
            <circle cx="42" cy="46" r="3" fill="#333" />
            <circle cx="58" cy="46" r="3" fill="#333" />
            <circle cx="37" cy="54" r="3" fill="#FFB4B4" opacity="0.9" />
            <circle cx="63" cy="54" r="3" fill="#FFB4B4" opacity="0.9" />
            <g class="mouth"><path d="M38 58 Q50 66 62 58" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round" /></g>
            <!-- cosmetics -->
            <g id="cos-scarf-pink"><path d="M28 70 Q50 82 72 70 L70 74 Q50 86 30 74 Z" fill="#ff6b9b" stroke="#a11a3f" stroke-width="1" /></g>
            <g id="cos-scarf-blue"><path d="M28 70 Q50 82 72 70 L70 74 Q50 86 30 74 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1" /></g>
            <g id="cos-hat-kabuto"><path d="M34 36 L66 36 L58 28 L42 28 Z" fill="#1f2937" stroke="#111" stroke-width="1" /></g>
            <g id="cos-hat-headband"><rect x="34" y="34" width="32" height="4" rx="2" fill="#dc2626" stroke="#7f1d1d" stroke-width="1" /></g>
            <g id="cos-eyes-star"><polygon points="42,46 43,44 45,44 43.5,45.5 44.2,47 42.8,46.2 41.5,47" fill="#f59e0b" /><polygon points="58,46 59,44 61,44 59.5,45.5 60.2,47 58.8,46.2 57.5,47" fill="#f59e0b" /></g>
            <g id="cos-eyes-sparkle"><circle cx="42" cy="46" r="2.2" fill="none" stroke="#f59e0b" stroke-width="1.5" /><circle cx="58" cy="46" r="2.2" fill="none" stroke="#f59e0b" stroke-width="1.5" /></g>
            <g id="cos-cheek-heart"><path d="M36 55 c-1 -1 -1 -3 1 -3 1 0 1 1 2 1 1 0 1 -1 2 -1 2 0 2 2 1 3 -1 1 -3 2 -3 3 0 -1 -2 -2 -3 -3z" fill="#fb7185" /><path d="M64 55 c-1 -1 -1 -3 1 -3 1 0 1 1 2 1 1 0 1 -1 2 -1 2 0 2 2 1 3 -1 1 -3 2 -3 3 0 -1 -2 -2 -3 -3z" fill="#fb7185" /></g>
            <g id="cos-face-catmouth"><path d="M44 60 q6 6 12 0" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" /><path d="M50 60 q-2 3 -4 0" fill="none" stroke="#333" stroke-width="2" /><path d="M50 60 q2 3 4 0" fill="none" stroke="#333" stroke-width="2" /></g>
            <g id="cos-body-sakura"><circle cx="50" cy="50" r="24" fill="#ffbcd4" opacity="0.25" /><rect x="28" y="62" width="44" height="34" rx="10" fill="#ffbcd4" opacity="0.25" /></g>
          </svg>
        </div>
        <div class="text-sm text-gray-600">Click an owned cosmetic to equip. Buy upgrades to unlock new features like Tutor.</div>
      </div>
    </section>

    <section class="manga-bubble p-4">
      <div class="font-medium mb-3">Catalog</div>
      <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>

    <div class="mt-4 flex items-center gap-2">
      <a href="index.html" class="btn btn-ghost">Home</a>
      <a href="lesson.html" class="btn btn-ghost">Lesson</a>
      <a id="tutorLink" href="tutor.html" class="btn btn-dark hidden">Open Tutor</a>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const catalogEl = $('#catalog');
    const coinsEl = $('#coins');
    const tutorLink = $('#tutorLink');
    const previewHost = $('#mascotPreview');

    function setPreviewClass(cls){ try { previewHost.className = 'w-14 h-16 ' + (cls||''); } catch {} }

    async function api(path, opts){ const r = await fetch(path, opts||{}); return await r.json(); }
    async function loadAll(){
      const [cat, wall] = await Promise.all([
        api('/api/shop/catalog'),
        api('/api/wallet')
      ]).catch(()=>[{items:[]},{coins:0,owned:{},equipped:{}}]);
      render(cat.items||[], wall);
    }

    function render(items, wallet){
      coinsEl.textContent = String(wallet.coins||0);
      const owned = wallet.owned||{};
      const equip = wallet.equipped||{};
      // preview current equipment
      const cls = Object.values(equip).filter(Boolean).join(' ');
      setPreviewClass(cls);
      catalogEl.innerHTML = '';
      items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl border-2 border-black bg-white shadow';
        card.innerHTML = `
          <div class="font-semibold">${it.name}</div>
          <div class="text-sm text-gray-600 mb-2">${it.kind}${it.slot?(' · '+it.slot):''}</div>
          <div class="flex items-center justify-between">
            <div class="text-sm">Price: <strong>${it.price}</strong></div>
            <div class="flex items-center gap-2">
              ${owned[it.id] ? (it.kind==='cosmetic' ? `<button data-equip="${it.id}" class="btn btn-ghost btn-equip">Equip</button>` : '<span class="text-green-700 text-sm">Owned</span>') : `<button data-buy="${it.id}" class="btn btn-primary btn-buy">Buy</button>`}
            </div>
          </div>`;
        catalogEl.appendChild(card);
      });
      // Tutor link if upgrade owned
      if (owned['upgrade-tutor-basic']) tutorLink.classList.remove('hidden'); else tutorLink.classList.add('hidden');
      catalogEl.querySelectorAll('[data-buy]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-buy');
        const res = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        loadAll();
      }));
      catalogEl.querySelectorAll('[data-equip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-equip');
        const res = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        const cls = Object.values((res.equipped||{})).filter(Boolean).join(' ');
        setPreviewClass(cls);
      }));
    }

    loadAll();
  </script>
</body>
</html>
