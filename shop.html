<!DOCTYPE html>
<html lang="en">

    {
      "imports": {
        "three": "https://unpkg.com/three@0.159.0/build/three.module.js"

    }
  </script>
  <script type="module">

    import { GLTFLoader } from 'https://unpkg.com/three@0.159.0/examples/jsm/loaders/GLTFLoader.js';

</head>
<body class="anime-bg min-h-screen p-5">
  <main class="max-w-7xl mx-auto">
    <header class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <a href="#" id="backBtn" class="btn btn-ghost text-sm">Back</a>
        <h1 class="site-title text-2xl font-bold accent-underline">Shop</h1>
      </div>
      <div class="text-sm">Coins: <strong id="coins">0</strong></div>
    </header>

    <section class="manga-bubble p-3">
      <!-- 3-column layout: categories (L) | preview (C) | items list (R) -->
      <div class="shop-grid items-start">
        <!-- Categories -->
        <aside class="max-h-[70vh] overflow-auto pr-1">
          <div class="font-medium mb-2">Categories</div>
          <div id="catList" class="flex md:flex-col gap-2 overflow-x-auto pb-1"></div>
        </aside>

        <!-- Preview (sticky) -->
        <div class="flex items-start justify-center sm:sticky top-2">
          <div class="text-center">
            <div id="mvWrap" class="inline-block relative" style="display:none; width:360px; height:420px; overflow:hidden; z-index:1;">
              <model-viewer id="mvShop" class="float-slow absolute inset-0" style="width:100%; height:100%;" camera-controls exposure="1" shadow-intensity="0.6" interaction-prompt="none"></model-viewer>
            </div>
            <div id="tvWrap" class="inline-block relative" style="display:none; width:360px; height:420px; overflow:hidden; z-index:1;"></div>
            <div id="equipSummary" class="text-xs text-gray-700 mt-1"></div>
            <div id="equipChips" class="flex flex-wrap gap-1 justify-center mt-1"></div>
            <div id="eyeColorRow" class="flex items-center justify-center gap-2 mt-2">
              <label for="eyeColorPick" class="text-xs font-medium">Eye Color</label>
              <div id="hatColorRow" class="flex items-center justify-center gap-2 mt-1">
                <label for="hatColorPick" class="text-xs font-medium">Hat Color</label>
                <input id="hatColorPick" type="color" value="#8a4b20" class="w-8 h-8 p-0 border rounded" />
              </div>
              <input id="eyeColorPick" type="color" value="#31a2ff" class="w-8 h-8 p-0 border rounded" />
              <select id="eyeMatSel" class="text-xs border rounded px-1 py-0.5">
                <option value="">Auto</option>
              </select>
              <!-- Removed blend/fill controls to keep focus on iris only -->
              <button id="eyeApplyBtn" class="btn btn-primary text-xs px-2 py-1">Apply</button>
            </div>
            <!-- Anchor Debug removed -->
            <div class="text-xs text-gray-600 mt-2">Tap a category and equip/buy to preview.</div>
          </div>
        </div>

        <!-- Items list -->
        <div class="max-h-[70vh] overflow-auto pr-1" id="itemsPane">
          <div class="font-medium mb-2" id="catTitle">Items</div>
          <div id="catalog" class="grid grid-cols-1 gap-2"></div>
        </div>
      </div>
    </section>

    <div class="mt-3 flex items-center gap-2">
      <button id="applyBtn" class="btn btn-primary">Apply Changes</button>
      <button id="applyNavBtn" class="btn btn-dark">Apply & Continue to Lessons</button>
      <span id="applyStatus" class="text-xs text-gray-600"></span>
    </div>
  </main>

  <script>

    }

    // Anchor Debug toggle + Log wiring

      }
      const adLog = document.getElementById('adLog');
      if (adLog && !adLog.__wired) {
        adLog.__wired = true;
        adLog.addEventListener('click', ()=>{
          try {
            let names = [];

              names = window.TV.getNodeNames()||[];
            } else if (window.__ofp && typeof window.__ofp.getNodeNames === 'function') {
              names = window.__ofp.getNodeNames()||[];

            console.log('[Anchor Debug] Model nodes:', names);
          } catch (e) {}
        });
      }
    })();

    // No 2D mascot fallback; preview shows only 3D models

    async function api(path, opts){

        const r = await fetch(url, opts||{});
        let data = null;
        try { data = await r.json(); } catch (e) { data = null; }
        if (!r.ok) return data || { ok:false, error: `HTTP ${r.status}` };
        return data;
      } catch (e) {
        console.warn('api failed', path, e);
        return { ok:false, error: String(e) };
      }
    }
    let SELECTED = 'upgrades';
    const FORCE_OVERLAY_SLOT = 'top';
    // Scene-graph attachment: slot anchors (approximate). Adjust as needed.
    const SLOT_ANCHORS_DEFAULT = {
      // General body regions
      head:  { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      torso: { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      body:  { position:[0, 0.00, 0], rotation:[0,0,0], scale:[1,1,1] },
      legs:  { position:[0, -0.06, 0], rotation:[0,0,0], scale:[1,1,1] },
      feet:  { position:[0, -0.35, 0], rotation:[0,0,0], scale:[1,1,1] },
      arms:  { position:[0.02, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      hands: { position:[0.04, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      // Clothing synonyms
      hat:   { position:[0, 0.16, 0], rotation:[0,0,0], scale:[1,1,1] },
      hair:  { position:[0, 0.12, 0], rotation:[0,0,0], scale:[1,1,1] },
      mask:  { position:[0, 0.08, 0.06], rotation:[0,0,0], scale:[1,1,1] },
      top:   { position:[0, 0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      outfit:{ position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] },
      boots: { position:[0, -0.355, 0], rotation:[0,0,0], scale:[1,1,1] },
      skirt: { position:[0, -0.02, 0], rotation:[0,0,0], scale:[1,1,1] },
      belt:  { position:[0, -0.01, 0.01], rotation:[0,0,0], scale:[1,1,1] },
      bag:   { position:[-0.05, 0.02, -0.03], rotation:[0,0,0], scale:[1,1,1] },
      misc:  { position:[0, 0, 0], rotation:[0,0,0], scale:[1,1,1] }
    };
    // Seed a sane per-item default for armor shoes to sit slightly forward
    (function seedDefaultItemAnchors(){
      try {
        const key = 'cos-armorshoe';
        const ov = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })();
        const locks = (function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })();
        if (!locks[key] && !ov[key]) { ov[key] = { position:[0, -0.39, 0.06], rotation:[0,0,0], scale:[1,1,1] }; localStorage.setItem('anchorOverrides', JSON.stringify(ov)); }
        // Apply same forward offset to all boots by default (slot-level)
        // and to feet slot for any items categorized there.
        let changed = false;
        if (!locks.boots && !ov.boots) { ov.boots = { position:[0,-0.39,0.06], rotation:[0,0,0], scale:[1,1,1] }; changed = true; }
        if (!locks.feet  && !ov.feet)  { ov.feet  = { position:[0,-0.39,0.06], rotation:[0,0,0], scale:[1,1,1] }; changed = true; }
        // Per-item nudges: raise further so feet don't poke through
        // Larger margin per request
        const targetY = -0.30;  // ~9cm above boots baseline (-0.39)
        const targetZ = 0.06;
        const candidates = ['cos-ninjashoe', 'cos-bottesgreen', 'cos-bottes'];
        for (const k of candidates){
          if (!locks[k] && !ov[k]) { ov[k] = { position:[0, targetY, targetZ], rotation:[0,0,0], scale:[1,1,1] }; changed = true; }
        }
        // Ninjashoe needs a separate higher placement (only if not locked and missing)
        (function(){ try { const id='cos-ninjashoe'; const y=-0.26, z=0.06; if (!locks[id] && !ov[id]) { ov[id] = { position:[0,y,z], rotation:[0,0,0], scale:[1,1,1] }; changed=true; } } catch{} })();
        if (changed) localStorage.setItem('anchorOverrides', JSON.stringify(ov));
      } catch {}
    })();
    // Accessory pool (offscreen model-viewers) to load GLBs for scene-graph cloning
    const accPool = document.createElement('div'); accPool.id = 'accPool';
    accPool.style.position = 'absolute'; accPool.style.left = '-9999px'; accPool.style.top = '0'; accPool.style.width = '1px'; accPool.style.height = '1px'; accPool.style.overflow = 'hidden';
    document.body.appendChild(accPool);
    // ---- Anchor sync helpers (server <-> localStorage) ----
    async function fetchServerAnchors(){
      try {
        const res = await fetch('/api/anchors', { cache:'no-store' });
        if (!res.ok) return false; const data = await res.json();
        const cur = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })();
        const merged = Object.assign({}, cur, data.anchors||{});
        localStorage.setItem('anchorOverrides', JSON.stringify(merged));
        if (data.locks && typeof data.locks==='object') localStorage.setItem('anchorLocks', JSON.stringify(Object.assign({}, (function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })(), data.locks)));
        return true;
      } catch { return false; }
    }
    let __syncTimer=null; async function pushServerAnchorsSoon(){ try { if(__syncTimer) return; __syncTimer=setTimeout(async()=>{ __syncTimer=null; try { const anchors=(function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch { return {}; } })(); const locks=(function(){ try { return JSON.parse(localStorage.getItem('anchorLocks')||'{}')||{}; } catch { return {}; } })(); await fetch('/api/anchors', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ anchors, locks, merge:true }) }); } catch {} }, 1500); } catch {} }
    const accCache = new Map(); // id -> { mv, ready:Promise }
    async function accessoryViewerFor(id, src){
      let rec = accCache.get(id);
      if (rec && rec.mv && rec.mv.getAttribute('src') === src) return rec;
      // Ensure custom element is defined
      try { if (window.customElements && window.customElements.whenDefined) await window.customElements.whenDefined('model-viewer'); } catch {}
      const mv = document.createElement('model-viewer');
      mv.setAttribute('src', src);
      mv.setAttribute('reveal','auto');
      mv.setAttribute('preload','true');
      mv.style.width = '1px'; mv.style.height = '1px';
      accPool.appendChild(mv);
      const ready = new Promise(res=>{
        const done = ()=>{ try { res(mv); } catch { res(mv); } };
        let settled = false;
        const mark = (label)=>{ try { console.log('[attach] event', label, src); } catch(_){} };
        const tryDone = ()=>{
          try {
            if (settled) return;
            if (mv && mv.model && (mv.model.scene || mv.scene)) { settled = true; return setTimeout(done, 0); }
          } catch {}
        };
        try { if (mv && (mv.model && (mv.model.scene || mv.scene))) { settled=true; return done(); } } catch {}
        try { mv.addEventListener('load', ()=>{ mark('load'); tryDone(); }, { once: true }); } catch {}
        try { mv.addEventListener('scene-graph-ready', ()=>{ mark('scene-graph-ready'); tryDone(); }, { once: true }); } catch {}
        // Fallback poll
        let t0 = Date.now();
        (function poll(){
          tryDone();
          if (settled) return;
          if (Date.now() - t0 > 7000) { settled=true; return done(); }
          try { window.requestAnimationFrame(poll); } catch { setTimeout(poll, 50); }
        })();
      });
      rec = { mv, ready }; accCache.set(id, rec); return rec;
    }
    function getBaseRoot(mv){
      try { return (mv && mv.model && mv.model.scene) ? mv.model.scene : (mv && mv.scene ? mv.scene : null); } catch (e) { return null; }
    }
    function getSceneFromViewer(mv){
      try { return (mv && mv.model && mv.model.scene) ? mv.model.scene : (mv && mv.scene ? mv.scene : null); } catch (e) { return null; }
    }
    function getThree(){ try { return (window.__THREE||window.THREE||null); } catch (e) { return null; } }
    // Inflate helpers to thicken meshes (reduce skin poke-through)
    function readBootInflate(){ try { const v=parseFloat(localStorage.getItem('bootInflate')||'0.009'); return (isFinite(v)&&v>=0)?v:0.009; } catch { return 0.009; } }
    function readTopInflate(){ try { const v=parseFloat(localStorage.getItem('topInflate')||'0.01'); return (isFinite(v)&&v>=0)?v:0.01; } catch { return 0.01; } }
    function readHairInflate(){ try { const v=parseFloat(localStorage.getItem('hairInflate')||'0.012'); return (isFinite(v)&&v>=0)?v:0.012; } catch { return 0.012; } }
    function readMaskInflate(){ try { const v=parseFloat(localStorage.getItem('maskInflate')||'0.012'); return (isFinite(v)&&v>=0)?v:0.012; } catch { return 0.012; } }
    function shouldThickenHair(){ try { return !!JSON.parse(localStorage.getItem('hairThickenEnabled')||'false'); } catch { return false; } }
    function readOutfitInflate(){ try { const v=parseFloat(localStorage.getItem('outfitInflate')||'0.012'); return (isFinite(v)&&v>=0)?v:0.012; } catch { return 0.012; } }
    function readLegInflate(){ try { const v=parseFloat(localStorage.getItem('legInflate')||'0.01'); return (isFinite(v)&&v>=0)?v:0.01; } catch { return 0.01; } }
    function readSkirtInflate(){ try { const v=parseFloat(localStorage.getItem('skirtInflate')||'0.012'); return (isFinite(v)&&v>=0)?v:0.012; } catch { return 0.012; } }
    function readArmInflate(){ try { const v=parseFloat(localStorage.getItem('armInflate')||'0.012'); return (isFinite(v)&&v>=0)?v:0.012; } catch { return 0.012; } }
    function readChemiseInflateMul(){ try { const v=parseFloat(localStorage.getItem('chemiseInflateMul')||'2.5'); return (isFinite(v)&&v>0)?v:2.5; } catch { return 2.5; } }
    function readChemiseInflateMin(){ try { const v=parseFloat(localStorage.getItem('chemiseInflateMin')||'0.02'); return (isFinite(v)&&v>=0)?v:0.02; } catch { return 0.02; } }
    function isBootish(id, slot){ try { return slot==='boots' || slot==='feet' || /shoe|bottes/i.test(String(id||'')); } catch { return false; } }
    function isTopish(id, slot){ try { return (slot==='top'||slot==='torso'||slot==='body'||/shirt|chemise|plastron|torso|chest|top/i.test(String(id||''))); } catch { return false; } }
    function isHairish(id, slot){ try { return (slot==='hair'||/\bhair(?!pin)/i.test(String(id||''))); } catch { return false; } }
    function isMaskish(id, slot){ try { return (slot==='mask'||/mask/i.test(String(id||''))); } catch { return false; } }
    function isOutfitish(id, slot){ try { return (slot==='outfit'||/outfit|suit|armor/i.test(String(id||''))); } catch { return false; } }
    function isLegish(id, slot){ try { return (slot==='legs'||/pants|trouser|legging|legwear|thigh|knee/i.test(String(id||''))); } catch { return false; } }
    function isSkirtish(id, slot){ try { return (slot==='skirt'||/skirt|dress|armorskirt/i.test(String(id||''))); } catch { return false; } }
    function isArmish(id, slot){ try { return (slot==='arms'||slot==='hands'||/amorarm|arm\b|bracer|gauntlet/i.test(String(id||''))); } catch { return false; } }
    function inflateScene(root, amount){
      try {
        const THREE = getThree(); if(!THREE || !root || !amount || !isFinite(amount) || amount<=0) return;
        root.traverse?.(o=>{ try { if (!o || !o.isMesh || !o.geometry) return; const g0=o.geometry; const g=g0.clone(); o.geometry=g; if (!g.attributes||!g.attributes.position) return; if(!g.attributes.normal){ try{ g.computeVertexNormals(); }catch{} } const pos=g.attributes.position, nor=g.attributes.normal; const pa=pos.array, na=nor.array; const len=Math.min(pa.length, na.length); for(let i=0;i<len;i+=3){ pa[i]+= (na[i]||0)*amount; pa[i+1]+= (na[i+1]||0)*amount; pa[i+2]+= (na[i+2]||0)*amount; } pos.needsUpdate=true; try{ g.computeBoundingBox(); g.computeBoundingSphere(); }catch{} } catch {} });
      } catch {}
    }
    // Keep boots/feet near the expected foot plane. Baseline is the chosen
    // anchor's own Y (item/slot/default), falling back to the map if missing.
    function snapFeetAnchor(a, slot, anchors){
      try {
        const enabled = (function(){ try { return JSON.parse(localStorage.getItem('feetSnapEnabled')||'true'); } catch { return true; } })();
        if (!enabled || !a || (slot!=='boots' && slot!=='feet')) return a;
        const pads = {
          up:  (function(){ try { return parseFloat(localStorage.getItem('feetSnapPadUp')||'0.04'); } catch { return 0.04; } })(),
          dn:  (function(){ try { return parseFloat(localStorage.getItem('feetSnapPadDown')||'0.06'); } catch { return 0.06; } })(),
        };
        // Prefer the Y of the already-chosen anchor 'a'; this matches
        // Anchor Tool results when per-item/slot overrides are present.
        const yDef = (function(){
          try {
            if (a && a.position && typeof a.position[1] === 'number') return a.position[1];
            const m=anchors||{}; const b=(m.boots&&m.boots.position&&m.boots.position[1]); const f=(m.feet&&m.feet.position&&m.feet.position[1]);
            return (typeof b==='number')?b:((typeof f==='number')?f:-0.18);
          } catch { return -0.18; }
        })();
        const footTop = yDef + pads.up;    // a bit above the expected foot line
        const footBot = yDef - pads.dn;    // allow small below-floor tolerance
        const y0 = (a.position?.[1] ?? 0);
        const y = Math.min(Math.max(y0, footBot), footTop);
        return { position:[a.position?.[0]||0, y, a.position?.[2]||0], rotation:a.rotation||[0,0,0], scale:a.scale||[1,1,1] };
      } catch { return a; }
    }
    function computeBounds(root){ try { const THREE = getThree(); if(!THREE||!root) return null; const box = new THREE.Box3(); let has=false; root.updateWorldMatrix?.(true,true); root.traverse?.(o=>{ try{ if (o.isMesh && o.geometry){ if(!o.geometry.boundingBox && o.geometry.computeBoundingBox) o.geometry.computeBoundingBox(); const bb = o.geometry.boundingBox && o.geometry.boundingBox.clone(); if (bb){ bb.applyMatrix4(o.matrixWorld); if(has) box.union(bb); else { box.copy(bb); has=true; } } } }catch(_){}}); return has?box:null; } catch (e) { return null; } }
    function clearAttachments(mv){ try { (mv.__attachments||[]).forEach(obj=>{ try { const root=getBaseRoot(mv); if(root && obj && obj.parent===root) root.remove(obj); } catch (e) {} }); mv.__attachments=[]; } catch (e) { mv.__attachments=[]; } }
    // Eye color: persistence + application helpers
    function getSavedHatHex(){ try { const v=String(localStorage.getItem("hatColorHex")||"").trim(); return /^#?[0-9a-fA-F]{6}$/.test(v)?(v.startsWith('#')?v:'#'+v):null; } catch (e) { return null; } }
    function setSavedHatHex(hex){ try { if (typeof hex==='string' && /^#?[0-9a-fA-F]{6}$/.test(hex)) localStorage.setItem("hatColorHex", hex.startsWith('#')?hex:'#'+hex); } catch (e) {} }
    function applyHatColorToRoot(root, hex){
      try {
        if (!root || !hex) return false;
        let changed=false;
        const traverse = root.traverse ? (fn)=>root.traverse(fn) : (fn)=>{ (function walk(o){ try{ fn(o); (o.children||[]).forEach(walk); }catch(e){} })(root); };
        // First pass: try strict hat_tint material/mesh names
        traverse((o)=>{
          try {
            if (!o || !o.isMesh) return;
            const arr = Array.isArray(o.material) ? o.material : (o.material?[o.material]:[]);
            const on = String(o.name||'').toLowerCase();
            for (let i=0;i<arr.length;i++){
              const m = arr[i];
              try {
                const nm = String((m&&m.name)||'').toLowerCase();
                if (/\bhat_tint\b/.test(nm) || /\bhat_tint\b/.test(on)) { try{ m.color&&m.color.set&&m.color.set(hex); }catch(e){} try{ if (m.map) m.map=null;}catch(e){} try{ if(m.needsUpdate!==undefined) m.needsUpdate=true;}catch(e){} changed=true; }
              } catch (e) {}
            }
          } catch (e) {}
        });
        if (!changed) {
          // Fallback: limit to attachments tagged as slot 'hat'
          try {
            const targets = [];
            const markIfHat = (g)=>{
              try {
                const n = String(g?.name||'').toLowerCase();
                const slot = (g&&g.userData&&g.userData.__slot)||null;
                if (slot==='hat' || /(^|[^a-z0-9])slot[:\-]?hat([^a-z0-9]|$)/.test(n)) targets.push(g);
              } catch {}
            };
            // Collect candidate wrapper groups
            root.traverse?.(o=>{ try { if (o && !o.isMesh) markIfHat(o); } catch{} });
            for (const g of targets){
              try {
                g.traverse?.(o=>{

                  ov3[slot3] = { position:[Number(posX?.value)||0, Number(posY?.value)||0.05, Number(posZ?.value)||0], rotation:[rx,ry,rz], scale:[s,s,s] };
                  localStorage.setItem('anchorOverrides', JSON.stringify(ov3));
                  try { pushServerAnchorsSoon(); } catch {}
                  if (window.__ofp && window.__ofp.setOverrides) { window.__ofp.setOverrides(ov3); await window.__ofp.attachAll(); }
                  try {
                    if (window.__useTV && TV && TV.attachAll) {
                      const map = new Map((_items||[]).map(x=>[x.id,x]));
                      const anchors = Object.assign({}, (window.SLOT_ANCHORS||SLOT_ANCHORS_DEFAULT), ov3);
                      await TV.attachAll(_wallet.equipped||{}, map, anchors);
                    }
                  } catch(_){}
                } catch(e){ console.warn('apply failed', e); }
              });
            }
            if (resetBtn && !resetBtn.__wired) {
              resetBtn.__wired = true;
              resetBtn.addEventListener('click', async ()=>{
                try {
                  const slot4 = sel.value; if(!slot4) return;
                  const ov4 = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch(e){ return {}; } })();
                  delete ov4[slot4]; localStorage.setItem('anchorOverrides', JSON.stringify(ov4));
                  try { pushServerAnchorsSoon(); } catch {}
                  if (window.__ofp && window.__ofp.setOverrides) { window.__ofp.setOverrides(ov4); await window.__ofp.attachAll(); }
                  try {
                    if (window.__useTV && TV && TV.attachAll) {
                      const map = new Map((_items||[]).map(x=>[x.id,x]));
                      const anchors = Object.assign({}, (window.SLOT_ANCHORS||SLOT_ANCHORS_DEFAULT), ov4);
                      await TV.attachAll(_wallet.equipped||{}, map, anchors);
                    }
                  } catch(_){}
                  sel.onchange();
                } catch(e){ console.warn('reset failed', e); }
              });
            }
          }
        } catch (e) {}
      } catch (e) {}
    }
      function cardHtml(it, owned, equipped){
        const curModel = (equipped||{}).model || 'model-basemesh';
        const isCompat = (function(){ try{ if(it.kind==='upgrade'||it.slot==='model') return true; const list=it.compatibleWith; if(!Array.isArray(list)||!list.length) return true; return list.includes(curModel);}catch{return true;} })();
        const ownedBadge = '<span class="text-green-700 text-xs">Owned</span>';
        const equipBtn = (disabled=false)=>`<button data-equip="${it.id}" class="btn btn-ghost btn-equip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Equip</button>`;
        const unequipBtn = (disabled=false)=>`<button data-unequip="${it.id}" class="btn btn-amber btn-unequip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Unequip</button>`;
        const buyBtn = `<button data-buy="${it.id}" class="btn btn-primary btn-buy">Buy</button>`;
        let action = buyBtn;
        if (owned[it.id]) {
          if (it.kind==='cosmetic') {
            const slot = it.slot;
            const val = equipped && equipped[slot];
            const isEquipped = Array.isArray(val) ? val.includes(it.id) : (val === it.id);
            action = isCompat ? `${equipBtn(false)} ${unequipBtn(!isEquipped)}` : '<span class="text-xs text-gray-500">Not compatible</span>';
          } else {
            action = ownedBadge;
          }
        }
      const sub = it.kind==='upgrade' ? 'Upgrade' : (it.slot ? it.slot : 'Cosmetic');
      return `
        <div class="p-3 rounded-xl border-2 border-black bg-white shadow">
          <div class="font-semibold">${it.name}</div>
          <div class="text-xs text-gray-600 mb-2">${sub}</div>
          <div class="flex items-center justify-between">
            <div class="text-sm">Price: <strong>${it.price}</strong></div>
            <div class="flex items-center gap-2">${action}</div>
          </div>
        </div>`;
    }
    function renderItems(){
      const owned = _wallet.owned||{}; const equipped = _wallet.equipped||{};
      const cats = _cats;
      const cat = cats.find(c=>c.id===SELECTED) || cats[0];
      const curModel = ((_wallet||{}).equipped||{}).model || 'model-basemesh'; const compat = (it)=>{ try{ if(it.kind==='upgrade'||it.slot==='model') return true; const list=it.compatibleWith; if(!Array.isArray(list)||!list.length) return true; return list.includes(curModel);}catch{return true;} }; const list = (cat ? _items.filter(cat.filter) : _items).filter(compat).filter(it=>!isHiddenItem(it));
      catalogEl.innerHTML='';
      list.forEach(it=>{
        const wrap = document.createElement('div');
        wrap.innerHTML = cardHtml(it, owned, equipped);
        const node = wrap.firstElementChild; catalogEl.appendChild(node);
      });
      try { if (owned['upgrade-tutor-basic'] && tutorLink) tutorLink.classList.remove('hidden'); else if (tutorLink) tutorLink.classList.add('hidden'); } catch (e) {}
      bindActions();
      try { document.getElementById('itemsPane').scrollTop = 0; } catch (e) {}
    }

    // Apply button: persist current preview equipment to server (top-most per slot)
    (function(){
      const btn = document.getElementById('applyBtn'); const btnNav = document.getElementById('applyNavBtn'); const status = document.getElementById('applyStatus');
      async function applyEquip(navigateAfter=false){
        if (btn) btn.disabled = true; if (btnNav) btnNav.disabled = true; if (status) status.textContent = 'Applying...';
        try {
          const want = (function flatten(eq){ const out={}; Object.keys(eq||{}).forEach(k=>{ if(k==='model'){ out.model=eq.model; return; } const v=eq[k]; if (Array.isArray(v)) { if (v.length) out[k]=v[v.length-1]; } else if (v) out[k]=v; }); return out; })(_wallet.equipped||{});
          const cur = await api('/api/wallet') || {equipped:{}}; const serverEq = (cur&&cur.equipped)||{};
          // Model first
          if (want.model && serverEq.model !== want.model) {
            const r = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId: want.model }) });
            if (r && r.error) throw new Error(r.error);
            // Update local categories to reflect model change (compatibility and upgrades visibility)
            try { _wallet.equipped = { model: want.model }; _cats = categoriesFrom(_items); renderCats(_cats); } catch {}
          }
          // Unequip removed slots
          const allSlots = new Set([...Object.keys(serverEq||{}), ...Object.keys(want||{})]); allSlots.delete('model');
          for (const slot of allSlots){
            const a = want[slot]; const b = serverEq[slot];
            if (!a && b) { await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ slot }) }); }
          }
          // Equip desired per slot
          for (const [slot,id] of Object.entries(want)){ if (slot==='model') continue; if (!id) continue; const r = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) }); if (r && r.error) throw new Error(r.error); }
          const wall = await api('/api/wallet'); const safe = (wall && !wall.error) ? wall : null; if (safe) _wallet = safe;
          try { localStorage.setItem('equippedSnapshot', JSON.stringify(want)); } catch {}
          renderPreview(); try { _cats = categoriesFrom(_items); renderCats(_cats); } catch {} renderItems(); if (status) status.textContent = 'Applied ?'; try { let png=null; if (window.__useTV && window.TV && TV.snapshot) png = TV.snapshot(); const mv=document.getElementById('mvShop'); if(!png && mv && mv.toBlob){ const blob=await mv.toBlob({ mimeType:'image/png' }); png = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); }); } if (png) localStorage.setItem('equippedPreviewPNG', png); } catch {}
          if (navigateAfter) { try{ location.href = 'lesson.html?lesson=greetings-001'; }catch{} }
        } catch (e) { if (status) status.textContent = 'Apply failed'; alert('Apply failed: ' + (e&&e.message?e.message:String(e))); }
        finally { if (btn) btn.disabled = false; if (btnNav) btnNav.disabled = false; setTimeout(()=>{ try{ if (status) status.textContent=''; }catch{} }, 1200); }
      }
      if (btn && !btn.__wired) { btn.__wired=true; btn.addEventListener('click', applyEquip); }
      if (btnNav && !btnNav.__wired) { btnNav.__wired=true; btnNav.addEventListener('click', ()=>applyEquip(true)); }
    })();
    function bindActions(){
      catalogEl.querySelectorAll('[data-buy]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-buy');
        const res = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        // Auto-equip cosmetics on purchase for preview
        if (id.startsWith('cos-')) {
          await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        }
        loadAll();
      }));
      catalogEl.querySelectorAll('[data-equip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-equip');
        if (e.currentTarget.disabled) return;
        try {
          const it = (_items||[]).find(x=>x.id===id);
          const slot = it && it.slot;
          // Shift/Alt-click: layer in preview only (no server call)
          if ((e.shiftKey || e.altKey) && slot) {
            _wallet.equipped = _wallet.equipped || {};
            const cur = _wallet.equipped[slot];
            if (Array.isArray(cur)) {
              if (!cur.includes(id)) cur.push(id);
            } else if (cur) {
              if (cur !== id) _wallet.equipped[slot] = [cur, id];
            } else {
              _wallet.equipped[slot] = id;
            }
            renderPreview();
            renderItems();
            return;
          }
          // Auto-buy if not owned
          const ownedMap = _wallet.owned || {};
          if (!ownedMap[id]) {
            const buy = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
            if (buy && buy.error) { alert(buy.error); return; }
            _wallet.owned = buy?.owned || _wallet.owned || {};
          }
          // Immediate local preview: if equipping a model, clear all other slots now
          if (slot === 'model') {
            _wallet.equipped = { model: id };
            renderPreview();
            try { _cats = categoriesFrom(_items); renderCats(_cats); } catch {}
          }
          const res = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
          if (res && res.error) {
            const err = String(res.error||'');
            if (/401|unauthor/i.test(err)) {
              // Guest mode fallback: apply locally only
              if (it && it.slot) {
                if (slot === 'model') { _wallet.equipped = { model: id }; }
                else { _wallet.equipped = _wallet.equipped || {}; _wallet.equipped[it.slot] = id; }
              }
            } else {
              alert(res.error); return;
            }
          } else {
            // Optimistic UI update when server accepted
            if (it && it.slot) {
              if (slot === 'model') { _wallet.equipped = { model: id }; }
              else { _wallet.equipped = _wallet.equipped || {}; _wallet.equipped[it.slot] = id; }
            }
          }
          renderPreview();
          // Rebuild categories after model change to ensure upgrades show correctly
          try { if (slot === 'model') { _cats = categoriesFrom(_items); renderCats(_cats); } } catch {}
          renderItems();
          // Avoid full reload to prevent flicker
        } catch (err) { console.error('Equip failed', err); }
      }));
      catalogEl.querySelectorAll('[data-unequip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-unequip');
        if (e.currentTarget.disabled) return;
        try {
          const it = (_items||[]).find(x=>x.id===id);
          const slot = it && it.slot;
          if (slot && Array.isArray((_wallet.equipped||{})[slot])) {
            const arr = _wallet.equipped[slot];
            _wallet.equipped[slot] = arr.filter(x=>x!==id);
            if (_wallet.equipped[slot].length===1) _wallet.equipped[slot] = _wallet.equipped[slot][0];
          } else {
            const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
            if (res && res.error) {
              const err = String(res.error||'');
              if (/401|unauthor/i.test(err)) {
                // Guest mode fallback: remove locally only
                if (it && it.slot && _wallet.equipped) delete _wallet.equipped[it.slot];
              } else {
                alert(res.error); return;
              }
            } else {
              // Optimistic UI update on success
              if (it && it.slot && _wallet.equipped) delete _wallet.equipped[it.slot];
            }
          }
          renderPreview();
          renderItems();
          // Avoid full reload to prevent flicker
        } catch (err) { console.error('Unequip failed', err); }
      }));
    }

    // Wire eye color picker UI and apply saved color on start
    (function(){
      try {
        const el = document.getElementById('eyeColorPick');
        if (el && !el.__wired) {
          el.__wired = true;
          try { const saved = getSavedEyeHex(); if (saved) el.value = saved; } catch {}
          el.addEventListener('input', ()=>{ try { const v=String(el.value||'').trim(); setSavedEyeHex(v); applyEyeColorFromStorage(); } catch {} });
        }
      } catch {}
      try {
        const hat = document.getElementById('hatColorPick');
        if (hat && !hat.__wired){
          hat.__wired = true;
          try { const savedH = getSavedHatHex(); if (savedH) hat.value = savedH; } catch {}
          hat.addEventListener('input', ()=>{ try { const v=String(hat.value||'').trim(); setSavedHatHex(v); applyHatColorFromStorage(); } catch {} });
        }
      } catch {}
      try {
        const btn = document.getElementById('eyeApplyBtn');
        const pick = document.getElementById('eyeColorPick');
        const sel = document.getElementById('eyeMatSel');
        if (btn && !btn.__wired) {
          btn.__wired = true;
          btn.addEventListener('click', async ()=>{
            try {
              const v = String((pick && pick.value) || '').trim();
              if (v) setSavedEyeHex(v);
              try { if (sel) setEyeMatFilter(sel.value||''); } catch {}
              
              btn.disabled = true; const prev = btn.textContent; btn.textContent = 'Applying…';
              try {
                let ok = await applyEyeColorFromStorage();
                // Fallback: if nothing applied (e.g., scene not ready), rebuild preview then re-apply
                if (!ok) {
                  try { await renderPreview(); } catch {}
                  try { ok = await applyEyeColorFromStorage(); } catch {}
                }
              } finally { btn.disabled=false; btn.textContent = prev; }
            } catch {}
          });
        }
      } catch {}
      try {
        const sel = document.getElementById('eyeMatSel');
        if (sel && !sel.__wired) {
          sel.__wired = true;
          const cur = getEyeMatFilter(); if (cur) sel.value = cur;
          sel.addEventListener('change', ()=>{ try { setEyeMatFilter(sel.value||''); applyEyeColorFromStorage(); } catch {} });
        }
      } catch {}
      
      try { applyEyeColorFromStorage(); } catch {}
      try { applyHatColorFromStorage(); } catch {}
    })();

    loadAll();
  </script>
