<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader – Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
</head>
<body class="anime-bg min-h-screen p-5">
  <main class="max-w-5xl mx-auto">
    <header class="flex items-center justify-between mb-3">
      <h1 class="site-title text-2xl font-bold accent-underline">Shop</h1>
      <div class="text-sm">Coins: <strong id="coins">0</strong></div>
    </header>

    <section class="manga-bubble p-3">
      <!-- 3-column layout: categories (L) | preview (C) | items list (R) -->
      <div class="shop-grid items-start">
        <!-- Categories -->
        <aside class="max-h-[70vh] overflow-auto pr-1">
          <div class="font-medium mb-2">Categories</div>
          <div id="catList" class="flex md:flex-col gap-2 overflow-x-auto pb-1"></div>
        </aside>

        <!-- Preview (sticky) -->
        <div class="flex items-start justify-center sm:sticky top-2">
          <div class="text-center">
            <div id="mascotPreview2D" class="inline-block mascot-stack tiny" style="display:none"></div>
            <div id="mascotPreview" class="w-12 h-14 inline-block" style="transform:scale(0.36); transform-origin: top center;">
              <svg viewBox="0 0 100 120" class="w-full h-full" aria-hidden="true">
                <rect x="28" y="62" width="44" height="34" rx="10" fill="#FFD166" stroke="#E0A700" stroke-width="2" />
                <path d="M28 72 q-10 6 -12 0" fill="none" stroke="#E0A700" stroke-width="3" stroke-linecap="round" />
                <path d="M72 72 q10 6 12 0" fill="none" stroke="#E0A700" stroke-width="3" stroke-linecap="round" />
                <rect x="40" y="98" width="8" height="8" rx="3" fill="#333" />
                <rect x="52" y="98" width="8" height="8" rx="3" fill="#333" />
                <circle cx="50" cy="50" r="24" fill="#FFD166" stroke="#E0A700" stroke-width="2" />
                <circle cx="42" cy="46" r="3" fill="#333" />
                <circle cx="58" cy="46" r="3" fill="#333" />
                <circle cx="37" cy="54" r="3" fill="#FFB4B4" opacity="0.9" />
                <circle cx="63" cy="54" r="3" fill="#FFB4B4" opacity="0.9" />
                <g class="mouth"><path d="M38 58 Q50 66 62 58" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round" /></g>
                <!-- cosmetics -->
                <g id="cos-scarf-pink"><path d="M28 70 Q50 82 72 70 L70 74 Q50 86 30 74 Z" fill="#ff6b9b" stroke="#a11a3f" stroke-width="1" /></g>
                <g id="cos-scarf-blue"><path d="M28 70 Q50 82 72 70 L70 74 Q50 86 30 74 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1" /></g>
                <g id="cos-hat-kabuto"><path d="M34 36 L66 36 L58 28 L42 28 Z" fill="#1f2937" stroke="#111" stroke-width="1" /></g>
                <g id="cos-hat-headband"><rect x="34" y="34" width="32" height="4" rx="2" fill="#dc2626" stroke="#7f1d1d" stroke-width="1" /></g>
                <g id="cos-eyes-star"><polygon points="42,46 43,44 45,44 43.5,45.5 44.2,47 42.8,46.2 41.5,47" fill="#f59e0b" /><polygon points="58,46 59,44 61,44 59.5,45.5 60.2,47 58.8,46.2 57.5,47" fill="#f59e0b" /></g>
                <g id="cos-eyes-sparkle"><circle cx="42" cy="46" r="2.2" fill="none" stroke="#f59e0b" stroke-width="1.5" /><circle cx="58" cy="46" r="2.2" fill="none" stroke="#f59e0b" stroke-width="1.5" /></g>
                <g id="cos-cheek-heart"><path d="M36 55 c-1 -1 -1 -3 1 -3 1 0 1 1 2 1 1 0 1 -1 2 -1 2 0 2 2 1 3 -1 1 -3 2 -3 3 0 -1 -2 -2 -3 -3z" fill="#fb7185" /><path d="M64 55 c-1 -1 -1 -3 1 -3 1 0 1 1 2 1 1 0 1 -1 2 -1 2 0 2 2 1 3 -1 1 -3 2 -3 3 0 -1 -2 -2 -3 -3z" fill="#fb7185" /></g>
                <g id="cos-face-catmouth"><path d="M44 60 q6 6 12 0" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" /><path d="M50 60 q-2 3 -4 0" fill="none" stroke="#333" stroke-width="2" /><path d="M50 60 q2 3 4 0" fill="none" stroke="#333" stroke-width="2" /></g>
                <g id="cos-body-sakura"><circle cx="50" cy="50" r="24" fill="#ffbcd4" opacity="0.25" /><rect x="28" y="62" width="44" height="34" rx="10" fill="#ffbcd4" opacity="0.25" /></g>
              </svg>
            </div>
            <div class="text-xs text-gray-600 mt-2">Tap a category and equip/buy to preview.</div>
          </div>
        </div>

        <!-- Items list -->
        <div class="max-h-[70vh] overflow-auto pr-1" id="itemsPane">
          <div class="font-medium mb-2" id="catTitle">Items</div>
          <div id="catalog" class="grid grid-cols-1 gap-2"></div>
        </div>
      </div>
    </section>

    <div class="mt-3 flex items-center gap-2">
      <a href="index.html" class="btn btn-ghost">Home</a>
      <a href="lesson.html" class="btn btn-ghost">Lesson</a>
      <a id="tutorLink" href="tutor.html" class="btn btn-dark hidden">Open Tutor</a>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const catalogEl = $('#catalog');
    const coinsEl = $('#coins');
    const tutorLink = $('#tutorLink');
    const previewHost = $('#mascotPreview');
    const catList = $('#catList');
    const catTitle = $('#catTitle');

    function setPreviewClass(cls){ try { previewHost.className = 'w-14 h-16 ' + (cls||''); } catch {} }

    async function api(path, opts){
      const r = await fetch(path, opts||{});
      let data = null;
      try { data = await r.json(); } catch { data = null; }
      if (!r.ok) return data || { ok:false, error: `HTTP ${r.status}` };
      return data;
    }
    let SELECTED = 'upgrades';
    function categoriesFrom(items){
      const has = (slot)=>items.some(it=>it.kind==='cosmetic' && it.slot===slot);
      const cats = [];
      if (items.some(it=>it.kind==='upgrade')) cats.push({ id:'upgrades', label:'Upgrades', filter:(it)=>it.kind==='upgrade' });
      const slots = ['hat','scarf','eyes','cheek','mouth','body'];
      const names = { hat:'Hats', scarf:'Scarves', eyes:'Eyes', cheek:'Cheeks', mouth:'Mouth', body:'Body' };
      slots.forEach(s=>{ if (has(s)) cats.push({ id:s, label:names[s], filter:(it)=>it.kind==='cosmetic' && it.slot===s }); });
      return cats;
    }
    function renderCats(cats){
      catList.innerHTML = '';
      cats.forEach(c=>{
        const b = document.createElement('button');
        b.className = 'btn btn-ghost text-sm whitespace-nowrap ' + (SELECTED===c.id ? 'ring-2' : '');
        b.textContent = c.label; b.dataset.id = c.id;
        b.addEventListener('click', ()=>{ SELECTED = c.id; catTitle.textContent = c.label; renderItems(); });
        catList.appendChild(b);
      });
      const cur = cats.find(x=>x.id===SELECTED) || cats[0];
      if (cur) catTitle.textContent = cur.label;
    }
    let _items = [], _wallet = { coins:0, owned:{}, equipped:{} }, _cats = [];
    async function loadAll(){
      const [cat, wall] = await Promise.all([
        api('/api/shop/catalog'),
        api('/api/wallet')
      ]).catch(()=>[{items:[]},{coins:0,owned:{},equipped:{}}]);
      _items = cat.items||[]; _wallet = wall||{coins:0,owned:{},equipped:{}};
      coinsEl.textContent = String(_wallet.coins||0);
      renderPreview();
      _cats = categoriesFrom(_items);
      renderCats(_cats);
      renderItems();
    }

    function renderPreview(){
      const equip = _wallet.equipped||{};
      const cls = Object.values(equip).filter(Boolean).join(' ');
      setPreviewClass(cls);
      // Try 2D layered preview from catalog src
      const host = document.getElementById('mascotPreview2D');
      const svgHost = document.getElementById('mascotPreview');
      const order = ['skin','outfit','scarf','hat','eyes','mouth','cheek','body'];
      const map = new Map((_items||[]).map(x=>[x.id, x]));
      while (host.firstChild) host.removeChild(host.firstChild);
      let any = false;
      order.forEach(slot=>{
        const id = equip[slot];
        const it = id && map.get(id);
        const src = it && it.src;
        if (src) {
          const img = document.createElement('img');
          img.className = 'mascot-layer'; img.alt = slot; img.loading = 'lazy';
          img.src = src; img.onerror = ()=>{ try { host.removeChild(img); } catch {} };
          host.appendChild(img); any = true;
        }
      });
      if (any) { host.style.display='inline-block'; svgHost.style.display='none'; }
      else { host.style.display='none'; svgHost.style.display='inline-block'; }
    }
    function cardHtml(it, owned, equipped){
      const ownedBadge = '<span class="text-green-700 text-xs">Owned</span>';
      const equipBtn = (disabled=false)=>`<button data-equip="${it.id}" class="btn btn-ghost btn-equip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Equip</button>`;
      const unequipBtn = (disabled=false)=>`<button data-unequip="${it.id}" class="btn btn-amber btn-unequip ${disabled?'opacity-50 cursor-not-allowed':''}" ${disabled?'disabled':''}>Unequip</button>`;
      const buyBtn = `<button data-buy="${it.id}" class="btn btn-primary btn-buy">Buy</button>`;
      let action = buyBtn;
      if (owned[it.id]) {
        if (it.kind==='cosmetic') {
          const slot = it.slot;
          const isEquipped = equipped && equipped[slot] === it.id;
          action = `${equipBtn(isEquipped)} ${unequipBtn(!isEquipped)}`;
        } else {
          action = ownedBadge;
        }
      }
      const sub = it.kind==='upgrade' ? 'Upgrade' : (it.slot ? it.slot : 'Cosmetic');
      return `
        <div class="p-3 rounded-xl border-2 border-black bg-white shadow">
          <div class="font-semibold">${it.name}</div>
          <div class="text-xs text-gray-600 mb-2">${sub}</div>
          <div class="flex items-center justify-between">
            <div class="text-sm">Price: <strong>${it.price}</strong></div>
            <div class="flex items-center gap-2">${action}</div>
          </div>
        </div>`;
    }
    function renderItems(){
      const owned = _wallet.owned||{}; const equipped = _wallet.equipped||{};
      const cats = _cats;
      const cat = cats.find(c=>c.id===SELECTED) || cats[0];
      const list = (cat ? _items.filter(cat.filter) : _items);
      catalogEl.innerHTML='';
      list.forEach(it=>{
        const wrap = document.createElement('div');
        wrap.innerHTML = cardHtml(it, owned, equipped);
        const node = wrap.firstElementChild; catalogEl.appendChild(node);
      });
      if (owned['upgrade-tutor-basic']) tutorLink.classList.remove('hidden'); else tutorLink.classList.add('hidden');
      bindActions();
      try { document.getElementById('itemsPane').scrollTop = 0; } catch {}
    }
    function bindActions(){
      catalogEl.querySelectorAll('[data-buy]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-buy');
        const res = await api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        // Auto-equip cosmetics on purchase for preview
        if (id.startsWith('cos-')) {
          await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        }
        loadAll();
      }));
      catalogEl.querySelectorAll('[data-equip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-equip');
        if (e.currentTarget.disabled) return;
        const res = await api('/api/shop/equip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        _wallet.equipped = res.equipped || _wallet.equipped || {};
        renderPreview();
        renderItems();
      }));
      catalogEl.querySelectorAll('[data-unequip]')?.forEach(btn => btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-unequip');
        if (e.currentTarget.disabled) return;
        const res = await api('/api/shop/unequip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itemId:id }) });
        if (!res.ok && res.error) { alert(res.error); return; }
        _wallet.equipped = res.equipped || _wallet.equipped || {};
        renderPreview();
        renderItems();
      }));
    }

    loadAll();
  </script>
</body>
</html>
