<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 3 NSW Learning Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#bfdbfe,#dcfce7);color:#1f2937}.app{max-width:1050px;margin:auto;padding:14px}.hero,.card{background:#fffdf7;border:4px solid #fff;border-radius:28px;padding:16px;box-shadow:0 8px 0 #0002,0 18px 30px #0002}.hero{background:linear-gradient(135deg,#fef08a,#fbcfe8,#bfdbfe);position:sticky;top:0;z-index:3}h1{font-size:clamp(2rem,7vw,4rem);margin:0;line-height:.95}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}button{border:0;border-radius:18px;padding:13px 16px;background:#2563eb;color:white;font-weight:900;box-shadow:0 5px 0 #1e40af}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.pink{background:#db2777;box-shadow:0 5px 0 #831843}button.ghost{background:white;color:#1f2937;border:3px solid #cbd5e1;box-shadow:0 5px 0 #94a3b8}input,textarea{width:100%;padding:15px;border-radius:18px;border:3px solid #93c5fd;font:inherit;margin:8px 0}.stat{font-size:2rem;font-weight:1000}.small{color:#475569}.title{font-size:1.45rem;font-weight:1000}.icon{font-size:3rem}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:6px 10px;margin:3px;font-weight:800}.question{background:#eff6ff;border:4px dashed #93c5fd;border-radius:24px;padding:16px;margin:12px 0;font-size:1.25rem;font-weight:900}.feedback{padding:14px;border-radius:22px;margin-top:12px;font-weight:800}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.idea{background:#fff7ed;border:3px solid #fdba74}.hidden{display:none}textarea{min-height:120px}.footer{text-align:center;color:#475569;padding:25px}.subject-card{display:flex;flex-direction:column;justify-content:space-between;min-height:185px}
</style>
</head>
<body>
<main class="app">
<section class="hero"><h1>🌈 Year 3 Learning Adventure</h1><p>English, creative writing, maths, science and art for a Sydney NSW Year 3 learner.</p><div class="row"><button onclick="daily()">Start today’s quest</button><button class="green" onclick="showSubjects()">Choose subject</button><button class="orange" onclick="brainBreak()">Brain break</button><button class="ghost" onclick="resetProgress()">Reset</button></div></section>
<section class="grid"><div class="card"><div class="small">Stars</div><div id="stars" class="stat">0 ⭐</div></div><div class="card"><div class="small">Correct</div><div id="correct" class="stat">0</div></div><div class="card"><div class="small">Writing power</div><div id="writingPower" class="stat">0</div></div><div class="card"><div class="small">Level</div><div id="level" class="stat">1</div></div></section>
<section id="subjects" class="grid"></section>
<section id="lesson" class="card hidden"><div class="row" style="justify-content:space-between"><div><div id="lessonTitle" class="title"></div><div id="meta"></div></div><button class="ghost" onclick="showSubjects()">Back</button></div><p id="explain" class="small"></p><div id="words"></div><div id="question" class="question"></div><input id="answer" placeholder="Type your answer" onkeydown="if(event.key==='Enter')checkAnswer()"><div class="row"><button onclick="checkAnswer()">Check</button><button class="pink" onclick="hint()">Hint</button><button class="orange" onclick="nextQ()">Next</button></div><div id="feedback"></div><div id="writeBox" class="hidden"><h3>✏️ Writing challenge</h3><p id="writePrompt"></p><textarea id="writing" placeholder="Write your sentence here..."></textarea><button class="green" onclick="checkWriting()">Check writing</button><div id="writingFeedback"></div></div></section>
<section id="brain" class="card"><div class="title">🧠 Brain Break Zone</div><p class="small">Memory, patterns, words and art prompts.</p><div class="row"><button onclick="memoryGame()">Memory</button><button class="green" onclick="patternGame()">Pattern</button><button class="orange" onclick="wordGame()">Word power</button><button class="pink" onclick="artPrompt()">Art prompt</button></div><div id="brainGame"></div></section>
<div class="footer">Separate branch prototype. Progress saves on this device.</div>
</main>
<script>
const subjects=[
{id:'english',icon:'📖',title:'English Reading',goal:'Reading, vocabulary, punctuation and grammar.',words:['infer: use clues','adjective: describing word','paragraph: sentences about one idea'],explain:'Practise reading for meaning, new words, punctuation and clear answers.',qs:[['Which word is an adjective? The fluffy dog barked.','fluffy','Fluffy describes the dog.','Write a sentence with one adjective.'],['Best punctuation: Wow that is huge','!','An exclamation mark shows strong feeling.','Write an excited sentence using !'],['A character packs an umbrella. What might the weather be?','rainy','The umbrella is a clue.','Explain using because.']]},
{id:'writing',icon:'✏️',title:'Creative Writing',goal:'Plan, describe, sequence and edit stories.',words:['setting: where and when','character: person or creature','problem: tricky part to solve'],explain:'A strong story has a character, setting, problem and ending.',qs:[['Best starter: A) Blue. B) At midnight, Mia heard a tiny roar.','b','B gives mystery and detail.','Write your own exciting opening.'],['What should you do after writing a draft?','edit','Editing improves your work.','Write one thing to check when editing.'],['Choose a stronger verb than went: raced, thing, blue','raced','Raced is an action word with energy.','Rewrite: The boy went home.']]},
{id:'maths',icon:'🔢',title:'Maths',goal:'Number, operations, fractions, measurement and data.',words:['place value: digit value by position','array: equal rows and columns','fraction: equal part of a whole'],explain:'Build confidence with numbers, multiplication, fractions, measurement and patterns.',qs:[['What is the value of 7 in 472?','70','The 7 is in the tens place.','Explain place value.'],['6 groups of 4 equals?','24','6 × 4 = 24.','Write a multiplication sentence.'],['Half of 18 is?','9','18 shared into two equal parts is 9.','Explain what half means.']]},
{id:'science',icon:'🔬',title:'Science',goal:'Observe, classify, predict, test and explain.',words:['observe: notice carefully','predict: say what might happen','material: what something is made from'],explain:'Ask questions, observe carefully, test ideas and explain what you notice.',qs:[['Which sense helps you notice colour?','sight','Sight uses your eyes.','Write one observation about a leaf.'],['If dark clouds arrive, what might happen?','rain','Dark clouds can be evidence of rain.','Write a prediction using because.'],['Wood, metal and plastic are examples of what?','materials','Materials are what objects are made from.','Name two materials in your room.']]},
{id:'art',icon:'🎨',title:'Art',goal:'Create, notice, describe and respond to artworks.',words:['line: straight, curved or zigzag mark','texture: how something feels or looks','contrast: strong difference'],explain:'Use line, colour, shape, texture and pattern to express ideas.',qs:[['Straight, curved or zigzag mark?','line','A line can move in many ways.','Describe three types of lines.'],['Rough, smooth and bumpy describe what?','texture','Texture is how something feels.','Describe tree bark.'],['Black beside white shows strong what?','contrast','Contrast means strong difference.','Name two contrasting colours.']]}
];
let state=JSON.parse(localStorage.getItem('year3-nsw-state')||'{"stars":0,"correct":0,"writingPower":0,"progress":{}}');let current=null,q=0;
function norm(s){return String(s).toLowerCase().trim().replace(/[.!?\s]/g,'')}function lvl(){return Math.max(1,Math.floor(state.correct/4)+1)}function save(){localStorage.setItem('year3-nsw-state',JSON.stringify(state));render()}function render(){stars.textContent=state.stars+' ⭐';correct.textContent=state.correct;writingPower.textContent=state.writingPower;level.textContent=lvl();subjects.innerHTML=subjectsData()}function subjectsData(){return subjects.map(s=>`<div class="card subject-card"><div><div class="icon">${s.icon}</div><div class="title">${s.title}</div><p class="small">${s.goal}</p><span class="pill">${state.progress[s.id]||0}/${s.qs.length} done</span></div><button onclick="openSubject('${s.id}')">Play</button></div>`).join('')}function showSubjects(){lesson.classList.add('hidden');subjects.scrollIntoView({behavior:'smooth'})}function openSubject(id){current=subjects.find(s=>s.id===id);q=state.progress[id]||0;if(q>=current.qs.length)q=0;lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'});showQ()}function showQ(){let item=current.qs[q];lessonTitle.textContent=current.icon+' '+current.title;meta.innerHTML=`<span class="pill">Question ${q+1}/${current.qs.length}</span><span class="pill">Level ${lvl()}</span>`;explain.textContent=current.explain;words.innerHTML=current.words.map(w=>`<span class="pill">${w}</span>`).join('');question.textContent=item[0];answer.value='';feedback.innerHTML='';writeBox.classList.add('hidden');writing.value='';writingFeedback.innerHTML=''}function checkAnswer(){let item=current.qs[q];let ok=norm(answer.value)===norm(item[1]);feedback.className='feedback '+(ok?'good':'bad');if(ok){feedback.innerHTML='🌟 Correct! '+item[2];state.correct++;state.stars+=3+lvl();state.progress[current.id]=Math.max(state.progress[current.id]||0,q+1);writePrompt.textContent=item[3];writeBox.classList.remove('hidden')}else{feedback.innerHTML='Good try. Answer: <b>'+item[1]+'</b>. '+item[2];state.stars++}save()}function hint(){feedback.className='feedback idea';feedback.innerHTML='💡 Hint: '+current.qs[q][2]}function nextQ(){q=(q+1)%current.qs.length;showQ()}function checkWriting(){let t=writing.value.trim();let score=0;if(t.length>18)score+=2;if(/[A-Z]/.test(t[0]||''))score++;if(/[.!?]$/.test(t))score++;if(/because|and|then|but|so|first|next|finally/i.test(t))score+=2;state.writingPower+=score;state.stars+=score;writingFeedback.className='feedback good';writingFeedback.innerHTML='Writing power +'+score+'. Try capital letter, punctuation, detail and because.';save();setTimeout(nextQ,800)}function daily(){openSubject(subjects[state.correct%subjects.length].id)}function resetProgress(){if(confirm('Reset progress?')){state={stars:0,correct:0,writingPower:0,progress:{}};save();lesson.classList.add('hidden')}}function brainBreak(){brain.scrollIntoView({behavior:'smooth'});memoryGame()}function memoryGame(){let seq=Array.from({length:3+Math.min(5,lvl())},()=>Math.floor(Math.random()*9)+1);brainGame.innerHTML=`<div class="question">Remember: ${seq.join(' - ')}</div><button onclick="brainGame.innerHTML='<input id=mem placeholder=Type numbers><button onclick=checkMemory(\'${seq.join('')}\')>Check</button>'">I remember</button>`}function checkMemory(s){let ok=mem.value.replace(/\D/g,'')===s;brainGame.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'Amazing memory! +5 stars':'Good try. It was '+s}</div>`;if(ok)state.stars+=5;save()}function patternGame(){let a=1+Math.floor(Math.random()*5),d=2+Math.floor(Math.random()*4),ans=a+4*d;brainGame.innerHTML=`<div class="question">Pattern: ${a}, ${a+d}, ${a+2*d}, ${a+3*d}, ?</div><input id=pat><button onclick="let ok=Number(pat.value)==${ans};brainGame.innerHTML='<div class=\'feedback '+(ok?'good':'bad')+'\'>'+(ok?'Pattern champion! +5 stars':'Answer: ${ans}')+'</div>';if(ok){state.stars+=5;save()}">Check</button>`}function wordGame(){let all=subjects.flatMap(s=>s.words),item=all[Math.floor(Math.random()*all.length)];brainGame.innerHTML='<div class="question">Word power: '+item+'</div>'}function artPrompt(){let p=['Draw a Sydney animal using 5 lines.','Design a magical school garden.','Draw a weather science poster.','Create a superhero using warm and cool colours.'];brainGame.innerHTML='<div class="question">🎨 '+p[Math.floor(Math.random()*p.length)]+'</div>'}render();
</script>
</body>
</html>
