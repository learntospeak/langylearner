<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 3 Learning Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#bae6fd,#dcfce7);color:#1f2937}.app{max-width:1100px;margin:auto;padding:16px}.hero,.card{background:#fffdf7;border:4px solid #fff;border-radius:28px;padding:18px;box-shadow:0 8px 0 #0002,0 18px 35px #0002}.hero{background:linear-gradient(135deg,#fde68a,#fbcfe8,#bfdbfe);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,7vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{font:inherit;font-weight:900;border:0;border-radius:18px;background:#2563eb;color:white;padding:16px 18px;box-shadow:0 5px 0 #1e40af;min-height:54px;cursor:pointer}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.pink{background:#db2777;box-shadow:0 5px 0 #831843}input,textarea{width:100%;font:inherit;font-size:1.1rem;padding:16px;border:3px solid #93c5fd;border-radius:18px;margin:10px 0}.small{color:#475569;line-height:1.5}.title{font-size:1.5rem;font-weight:1000}.big{font-size:2rem;font-weight:1000}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}.question{background:#eff6ff;border:4px dashed #93c5fd;border-radius:24px;padding:18px;margin:14px 0;font-size:1.35rem;font-weight:900}.feedback{padding:14px;border-radius:22px;margin-top:12px;font-weight:900}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.idea{background:#fff7ed;border:3px solid #fdba74}.hidden{display:none}.arena{height:340px;position:relative;background:linear-gradient(#dbeafe,#fef9c3);border-radius:24px;border:4px solid white;overflow:hidden;touch-action:manipulation}.star{position:absolute;font-size:3.4rem;background:white;border-radius:999px;padding:10px;box-shadow:0 8px 16px #0003;transition:transform .08s linear}</style>
</head>
<body>
<main class="app">
<section class="hero"><h1>🌈 Year 3 Learning Quest</h1><p class="small">Mini lessons, concept clues, writing prompts, stars and proper moving iPad games.</p><div class="row"><button id="mixedBtn">Start mixed quest</button><button id="gameBtn" class="orange">Play Star Catcher</button><a href="challenges.html"><button class="pink">Challenge Arcade</button></a><button id="resetBtn" class="green">Reset</button></div></section>
<section class="grid"><div class="card"><div class="small">Stars</div><div id="stars" class="big">0 ⭐</div></div><div class="card"><div class="small">Correct</div><div id="correct" class="big">0</div></div><div class="card"><div class="small">Writing power</div><div id="writing" class="big">0</div></div></section>
<section id="subjects" class="grid"></section>
<section id="lesson" class="card hidden"><div id="lt" class="title"></div><p id="context" class="small"></p><div id="words"></div><div id="q" class="question"></div><input id="ans" placeholder="Type answer here"><div class="row"><button id="checkBtn">Check</button><button id="clueBtn" class="pink">Concept clue</button><button id="hintBtn" class="orange">Small hint</button><button id="nextBtn" class="green">Next</button></div><div id="fb"></div><div id="writeBox" class="hidden"><p id="wp" class="small"></p><textarea id="writetxt" placeholder="Write one clear sentence..."></textarea><button id="scoreBtn" class="green">Score writing</button><div id="wfb"></div></div></section>
<section id="gameBox" class="card hidden"><div class="title">⭐ Star Catcher</div><p class="small">The star now moves continuously. Catch it 10 times before time runs out.</p><div id="arena" class="arena"></div><div id="gameFb" class="feedback idea">Tap Start.</div><button id="startGame" class="green">Start game</button></section>
</main>
<script>
const lessons=[
{id:'eng',icon:'📖',title:'English Reading',context:'Strong readers use clues, notice punctuation and explain with because.',words:['infer = use clues','adjective = describing word','verb = action word','evidence = proof'],qs:[['The tired puppy slept. Which word describes the puppy?','tired','It describes the puppy.','Write a sentence with an adjective.','An adjective describes a noun.'],['Mia whispered. What mood is created?','quiet','Whispered suggests quiet.','Explain using because.','Mood is the feeling of the scene.'],['Best punctuation: What a huge wave','!','Strong feeling uses !','Write an exclamation sentence.','Exclamation marks show strong feeling.'],['Which word is a verb: The bird swooped.','swooped','Swooped is the action.','Write a sentence with a verb.','A verb is a doing word.'],['Best evidence Ben is cold? A) outside B) shivered','b','Shivered is the clue.','Explain why B is better evidence.','Evidence is a detail that proves an idea.'],['Which word is a noun: The red kite flew.','kite','A kite is a thing.','Write three nouns.','A noun is a person, place or thing.']]},
{id:'write',icon:'✏️',title:'Creative Writing',context:'Stories need character, setting, problem and ending. Better writing uses detail.',words:['setting = where and when','problem = tricky part','edit = improve','verb = action'],qs:[['Best opener? A) A dog. B) At sunset, a dog found a glowing key.','b','B has detail and mystery.','Write your own opening.','Strong openings give detail.'],['Strongest verb: went, sprinted, nice','sprinted','Sprinted is precise.','Improve: The girl went home.','Precise verbs create clearer pictures.'],['Story tricky event is called?','problem','The problem gives purpose.','Invent a story problem.','A problem is what must be solved.'],['What should you check when editing?','spelling','Editing improves writing.','Write an editing checklist item.','Editing means looking again to improve.'],['Where a story happens is the?','setting','Setting tells where and when.','Describe a spooky setting.','Setting is place and time.'],['An ending should do what?','finish','An ending completes the story.','Write an ending sentence.','Endings should feel complete.']]},
{id:'math',icon:'🔢',title:'Maths',context:'Practise place value, multiplication, fractions, perimeter and patterns.',words:['array = rows and columns','fraction = equal part','perimeter = distance around'],qs:[['Value of 6 in 368?','60','6 is in the tens place.','Explain place value.','Look at hundreds, tens and ones.'],['7 groups of 3?','21','7 × 3 = 21.','Write a multiplication sentence.','Groups of means multiply.'],['Half of 24?','12','Half is two equal parts.','Explain half.','Split into 2 equal groups.'],['Perimeter of square side 5 cm?','20','5+5+5+5=20.','Write answer with cm.','Perimeter is around the outside.'],['345 rounded to nearest ten?','350','5 rounds up.','Explain rounding.','Look at the ones digit.'],['Next: 5,10,15,20,?','25','Add 5 each time.','Make your own pattern.','Find the step.']]},
{id:'sci',icon:'🔬',title:'Science',context:'Scientists observe, predict, test fairly and record results.',words:['observe = notice','predict = say what might happen','material = what something is made from'],qs:[['Which sense notices a loud sound?','hearing','Hearing uses ears.','Write an observation.','Think of the five senses.'],['Dark clouds predict?','rain','Clouds are evidence.','Write prediction using because.','Predictions use clues.'],['Glass, metal and paper are?','materials','Materials are what things are made from.','Name two materials.','Material means the stuff something is made from.'],['A fair test changes how many things?','one','One change keeps it fair.','Explain fair test.','Changing many things confuses results.'],['Ice melting becomes?','liquid','Melted ice is water.','Name a melting example.','Liquid flows.'],['Scientists write down?','results','Results are what happened.','Write one result.','Results are observations or measurements.']]},
{id:'art',icon:'🎨',title:'Art',context:'Artists use line, colour, shape, texture, contrast and pattern.',words:['line = mark','texture = feel','contrast = difference','pattern = repeated design'],qs:[['Rough, smooth and bumpy describe?','texture','Texture is feel.','Describe a texture.','Texture is how something feels or looks.'],['Black beside white shows?','contrast','Contrast is strong difference.','Name contrasting colours.','Contrast means very different.'],['Zigzag is a type of?','line','Line can be zigzag.','Describe three lines.','Lines can be straight, curved or zigzag.'],['Repeated shapes make a?','pattern','A pattern repeats.','Design a pattern.','Pattern repeats.'],['Red and yellow are warm or cool?','warm','They are warm colours.','Plan warm artwork.','Warm colours remind us of sun or fire.'],['Main thing your eye sees first?','focus','Focus is the main part.','Describe an artwork focus.','Focus stands out most.']]}
];
let st=JSON.parse(localStorage.getItem('y3-main-fixed')||'{"stars":0,"correct":0,"writing":0,"p":{}}'),cur=null,i=0,gameTimer=null,gameScore=0,starObj=null;
function save(){localStorage.setItem('y3-main-fixed',JSON.stringify(st));stars.textContent=st.stars+' ⭐';correct.textContent=st.correct;writing.textContent=st.writing;renderSubjects()}function norm(x){return String(x).toLowerCase().replace(/[.!?\s]/g,'')}function tag(t,c){let e=document.createElement(t);if(c)e.className=c;return e}
function renderSubjects(){subjects.textContent='';lessons.forEach(l=>{let c=tag('div','card'),b=tag('button');c.innerHTML='<div class=title>'+l.icon+' '+l.title+'</div><p class=small>'+l.context+'</p><span class=pill>'+(st.p[l.id]||0)+'/'+l.qs.length+' done</span>';b.textContent='Start';b.onclick=()=>openL(l.id);c.append(b);subjects.append(c)})}
function openL(id){cur=lessons.find(x=>x.id===id);i=st.p[id]||0;if(i>=cur.qs.length)i=0;lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'});showQ()}function showQ(){let item=cur.qs[i];lt.textContent=cur.icon+' '+cur.title;context.textContent=cur.context;words.textContent='';cur.words.forEach(w=>{let s=tag('span','pill');s.textContent=w;words.append(s)});q.textContent=item[0];ans.value='';fb.textContent='';fb.className='';writeBox.classList.add('hidden');wfb.textContent=''}function checkA(){let item=cur.qs[i],ok=norm(ans.value)===norm(item[1]);fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct! '+item[2]:'Good try. Answer: '+item[1]+'. '+item[2];if(ok){st.correct++;st.stars+=5;st.p[cur.id]=Math.max(st.p[cur.id]||0,i+1);wp.textContent=item[3];writeBox.classList.remove('hidden')}else st.stars++;save()}function showClue(){fb.className='feedback idea';fb.textContent='Concept clue: '+cur.qs[i][4]}function showHint(){fb.className='feedback idea';fb.textContent='Small hint: '+cur.qs[i][2]}function nextQ(){i=(i+1)%cur.qs.length;showQ()}function scoreW(){let t=writetxt.value.trim(),s=0;if(t.length>20)s+=2;if(/[A-Z]/.test(t[0]||''))s++;if(/[.!?]$/.test(t))s++;if(/because|and|then|but|so/i.test(t))s+=2;st.writing+=s;st.stars+=s;wfb.className='feedback good';wfb.textContent='Writing power +'+s;save();setTimeout(nextQ,700)}function mixed(){openL(lessons[st.correct%lessons.length].id)}function reset(){st={stars:0,correct:0,writing:0,p:{}};save()}
function startStarGame(){clearInterval(gameTimer);arena.textContent='';gameScore=0;gameFb.textContent='Catch 10 moving stars!';let s=tag('button','star');s.textContent='⭐';arena.append(s);starObj={el:s,x:40,y:40,vx:3+Math.random()*3,vy:2+Math.random()*3};s.onclick=()=>{gameScore++;st.stars+=2;gameFb.textContent='Caught '+gameScore+'/10';save();starObj.vx=(3+Math.random()*5)*(Math.random()<.5?-1:1);starObj.vy=(2+Math.random()*5)*(Math.random()<.5?-1:1);if(gameScore>=10){clearInterval(gameTimer);arena.textContent='';gameFb.textContent='Great catching! Bonus +20 stars.';st.stars+=20;save()}};gameTimer=setInterval(moveStar,30)}function moveStar(){if(!starObj)return;let maxX=arena.clientWidth-80,maxY=arena.clientHeight-80;starObj.x+=starObj.vx;starObj.y+=starObj.vy;if(starObj.x<0||starObj.x>maxX)starObj.vx*=-1;if(starObj.y<0||starObj.y>maxY)starObj.vy*=-1;starObj.x=Math.max(0,Math.min(maxX,starObj.x));starObj.y=Math.max(0,Math.min(maxY,starObj.y));starObj.el.style.transform='translate('+starObj.x+'px,'+starObj.y+'px)'}
mixedBtn.onclick=mixed;gameBtn.onclick=()=>{gameBox.classList.remove('hidden');gameBox.scrollIntoView({behavior:'smooth'})};resetBtn.onclick=reset;checkBtn.onclick=checkA;clueBtn.onclick=showClue;hintBtn.onclick=showHint;nextBtn.onclick=nextQ;scoreBtn.onclick=scoreW;startGame.onclick=startStarGame;ans.onkeydown=e=>{if(e.key==='Enter')checkA()};save();
</script>
</body></html>
