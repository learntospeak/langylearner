<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>iPad Star Catcher</title><style>html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui;background:#0f172a;color:white}.top{padding:10px;background:#111827}.pill{display:inline-block;background:#1d4ed8;border-radius:999px;padding:8px 10px;margin:3px;font-weight:800}button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 12px;margin:3px;background:#22c55e;color:#052e16}.game{height:calc(100% - 92px);position:relative}canvas{width:100%;height:100%;display:block;background:linear-gradient(#bfdbfe,#fef3c7)}.msg{position:absolute;left:8px;right:8px;bottom:8px;background:#111827dd;border-radius:14px;padding:10px;font-weight:800}</style></head><body><div class="top"><span id="lvl" class="pill">Level 1</span><span id="score" class="pill">Score 0</span><span id="best" class="pill">Best 0</span><span id="target" class="pill">Target ⭐</span><button onclick="start()">Start</button><button onclick="resetGame()">Start Again</button><a href="./"><button>Back</button></a></div><div class="game" id="box"><canvas id="c"></canvas><div id="msg" class="msg">Catch the star. Avoid the bug.</div></div><script>let cv=c,ctx=cv.getContext('2d'),box=document.getElementById('box'),items=[],timer=null,st=JSON.parse(localStorage.getItem('ipadStarGame')||'{"level":1,"score":0,"best":0,"hits":0}');function fit(){cv.width=box.clientWidth;cv.height=box.clientHeight}addEventListener('resize',fit);fit();function save(){st.best=Math.max(st.best,st.score);localStorage.setItem('ipadStarGame',JSON.stringify(st));lvl.textContent='Level '+st.level;score.textContent='Score '+st.score;best.textContent='Best '+st.best}function make(s,good){let sp=2+st.level*.3;return{s,good,x:50+Math.random()*(cv.width-100),y:50+Math.random()*(cv.height-100),vx:sp*(Math.random()<.5?-1:1),vy:sp*(Math.random()<.5?-1:1),r:28}}function start(){items=[make('⭐',true),make('👾',false)];let dec=['💫','🌙','🍌','🎈','🍕','⚽','💎','🔥','🍎','🪐'];for(let i=0;i<Math.min(16,4+st.level*2);i++)items.push(make(dec[i%dec.length],false));clearInterval(timer);timer=setInterval(draw,30);msg.textContent='Catch ⭐ before it changes.';save()}function resetGame(){st={level:1,score:0,best:0,hits:0};items=[];clearInterval(timer);ctx.clearRect(0,0,cv.width,cv.height);msg.textContent='Reset. Tap Start.';save()}function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(let it of items){if(it.s==='👾'){let t=items[0],dx=t.x-it.x,dy=t.y-it.y,l=Math.max(1,Math.hypot(dx,dy));it.vx+=dx/l*.025;it.vy+=dy/l*.025}it.x+=it.vx;it.y+=it.vy;if(it.x<30||it.x>cv.width-30)it.vx*=-1;if(it.y<30||it.y>cv.height-30)it.vy*=-1;ctx.font=(it.good?'44':'38')+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.s,it.x,it.y)}if(Math.hypot(items[0].x-items[1].x,items[0].y-items[1].y)<42){st.score=Math.max(0,st.score-5);items[0]=make('⭐',true);msg.textContent='The bug grabbed it. -5';save()}}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let it of items){if(Math.hypot(x-it.x,y-it.y)<35){if(it.good){st.score+=10;st.hits++;msg.textContent='Pop!';if(st.hits>=4+st.level*2){st.level++;st.hits=0;msg.textContent='Level up!'}items[0]=make('⭐',true)}else{st.score=Math.max(0,st.score-3);msg.textContent='Wrong one. -3'}save();return}}});save();</script></body></html>
