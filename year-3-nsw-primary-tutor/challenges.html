<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 3 Challenge Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#fef3c7,#bfdbfe,#dcfce7);color:#1f2937}.app{max-width:1050px;margin:auto;padding:16px}.hero,.card{background:#fffdf7;border:4px solid white;border-radius:28px;padding:18px;box-shadow:0 8px 0 #0002,0 18px 35px #0002}.hero{background:linear-gradient(135deg,#fde68a,#fbcfe8,#bfdbfe);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,7vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:900;border:0;border-radius:18px;background:#2563eb;color:white;padding:16px 18px;box-shadow:0 5px 0 #1e40af;min-height:56px;cursor:pointer}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.pink{background:#db2777;box-shadow:0 5px 0 #831843}.small{color:#475569;line-height:1.5}.title{font-size:1.55rem;font-weight:1000}.big{font-size:2rem;font-weight:1000}.question{font-size:1.35rem;font-weight:1000;background:#eff6ff;border:4px dashed #93c5fd;border-radius:24px;padding:18px;margin:14px 0}.feedback{padding:14px;border-radius:22px;margin-top:12px;font-weight:900}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.idea{background:#fff7ed;border:3px solid #fdba74}.choice{display:block;width:100%;margin:8px 0;text-align:left}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}a{text-decoration:none}</style></head><body><main class="app"><section class="hero"><h1>🎮 Year 3 Challenge Arcade</h1><p class="small">30 quick challenges plus memory, boss battles, badges, daily quest and parent snapshot. Built for iPad taps.</p><div class="row"><button id="randomBtn">Random challenge</button><button id="dailyBtn" class="orange">Daily quest</button><button id="bossBtn" class="pink">Boss battle</button><button id="parentBtn" class="green">Parent snapshot</button><button id="resetBtn" class="pink">Reset</button><a href="./"><button class="green">Back to lessons</button></a></div></section><section class="grid"><div class="card"><div class="small">Arcade stars</div><div id="stars" class="big">0 ⭐</div></div><div class="card"><div class="small">Streak</div><div id="streak" class="big">0</div></div><div class="card"><div class="small">Badges</div><div id="badges" class="big">0</div></div></section><section class="grid"><button class="orange" onclick="start('word')">Word Ninja</button><button class="green" onclick="start('math')">Maths Monster</button><button onclick="start('science')">Science Sorter</button><button class="pink" onclick="start('story')">Story Dice</button><button class="orange" onclick="start('art')">Art Spinner</button><button class="green" onclick="memory()">Memory Sprint</button></section><section id="play" class="card"><div class="title">Pick a challenge to begin.</div><p class="small">Correct answers earn stars. Wrong answers give concept clues instead of just “wrong”.</p></section></main><script>let state=JSON.parse(localStorage.getItem('y3-arcade-v2')||'{"stars":0,"streak":0,"done":0,"badges":[]}');const bank={word:[['Tap the adjective: The shiny shell sparkled.','shiny',['shell','shiny','sparkled'],'An adjective describes a noun.'],['Tap the verb: The koala climbed slowly.','climbed',['koala','climbed','slowly'],'A verb is an action word.'],['Tap the noun: The rocket zoomed upward.','rocket',['rocket','zoomed','upward'],'A noun is a person, place or thing.'],['Which punctuation shows excitement?','!',['.','!','?'],'An exclamation mark shows strong feeling.'],['Tap the adverb: The horse ran quickly.','quickly',['horse','ran','quickly'],'An adverb can describe how an action happens.'],['Best evidence that Lily is scared?','Lily hid behind the chair.',['Lily likes chairs.','Lily hid behind the chair.','Lily ate lunch.'],'Evidence is a clue that supports an idea.']],math:[['8 groups of 3 = ?','24',['18','21','24'],'Groups of means multiplication.'],['Half of 32 = ?','16',['14','16','18'],'Half means split into two equal parts.'],['Round 267 to nearest ten.','270',['260','267','270'],'Look at the ones digit.'],['Perimeter of a 4 cm square?','16',['8','12','16'],'Add all four sides.'],['One quarter of 28?','7',['6','7','14'],'Quarter means one of four equal parts.'],['Next pattern: 6,12,18,24...?','30',['28','30','32'],'The pattern adds 6 each time.']],science:[['Best prediction: Dark clouds mean it may...','rain',['rain','snow in summer','turn purple'],'Use clues to predict.'],['A fair test changes...','one thing',['one thing','everything','nothing'],'Change one variable only.'],['Ice melting becomes...','liquid',['gas','liquid','sand'],'Melted ice becomes water.'],['A magnet attracts...','iron',['wood','plastic','iron'],'Magnets attract some metals.'],['Plants need which one?','sunlight',['sunlight','shoes','pencils'],'Plants need sunlight, water and air.'],['Writing what happened in a test is recording...','results',['results','guesses','colours'],'Results are observations or measurements.']],story:[['Choose the most exciting opener.','At midnight, the map began to glow.',['A map.','At midnight, the map began to glow.','It was there.'],'Strong openings give detail and mystery.'],['Best problem for a story.','The bridge vanished before school.',['Lunch was nice.','The bridge vanished before school.','I have shoes.'],'A problem creates something to solve.'],['Choose the strongest verb.','sprinted',['went','sprinted','nice'],'Precise verbs make writing stronger.'],['Best ending job.','solve or finish the story',['start again','solve or finish the story','add random facts'],'Endings should feel complete.'],['Best setting detail.','Fog curled around the empty playground.',['It was a place.','Fog curled around the empty playground.','The end.'],'Setting detail helps the reader imagine the place.'],['Best editing check.','capital letters and full stops',['shoes','capital letters and full stops','favourite colour'],'Editing improves clarity.']],art:[['Repeated shapes create a...','pattern',['texture','pattern','volume'],'A pattern repeats.'],['Rough, smooth and bumpy are...','textures',['textures','numbers','verbs'],'Texture is how something feels.'],['Black next to white shows...','contrast',['contrast','quiet','fraction'],'Contrast means strong difference.'],['The main thing your eye sees first is the...','focus',['focus','weather','noun'],'Focus is the main part.'],['Red and yellow are usually...','warm colours',['warm colours','cool colours','fractions'],'Warm colours can feel bright or energetic.'],['Blue and green are usually...','cool colours',['warm colours','cool colours','verbs'],'Cool colours can feel calm.']]};function save(){localStorage.setItem('y3-arcade-v2',JSON.stringify(state));stars.textContent=state.stars+' ⭐';streak.textContent=state.streak;badges.textContent=state.badges.length}function allQs(){return Object.values(bank).flat()}function start(type){let set=bank[type],q=set[Math.floor(Math.random()*set.length)];ask(label(type),q)}function ask(title,q){play.innerHTML='<div class=title>'+title+'</div><div class=question>'+q[0]+'</div><div id=choices></div><div id=fb></div>';q[2].slice().sort(()=>Math.random()-.5).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(c===q[1],q[3]);choices.appendChild(b)})}function answer(ok,tip){fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct! +5 stars':'Try again. Concept clue: '+tip;if(ok){state.stars+=5;state.streak++;state.done++;award()}else state.streak=0;save()}function award(){if(state.streak>=5&&!state.badges.includes('Streak Star'))state.badges.push('Streak Star');if(state.done>=10&&!state.badges.includes('Quest Starter'))state.badges.push('Quest Starter');if(state.done>=30&&!state.badges.includes('Arcade Hero'))state.badges.push('Arcade Hero')}function label(t){return {word:'🥷 Word Ninja',math:'👾 Maths Monster',science:'🔬 Science Sorter',story:'🎲 Story Dice',art:'🎨 Art Spinner'}[t]}function memory(){let seq=Array.from({length:4+Math.min(4,state.streak)},()=>Math.floor(Math.random()*9)+1);play.innerHTML='<div class=title>🧠 Memory Sprint</div><div class=question>'+seq.join(' - ')+'</div><button id=hide class=green>I remember</button><div id=fb></div>';hide.onclick=()=>{play.innerHTML='<div class=title>Type the numbers</div><input id=mem style="width:100%;font:inherit;font-size:1.4rem;padding:16px;border-radius:18px;border:3px solid #93c5fd"><button id=check class=green>Check</button><div id=fb></div>';check.onclick=()=>answer(mem.value.replace(/\D/g,'')===seq.join(''),'Try grouping the numbers in pairs.')}}function dailyQuest(){let qs=[bank.word[0],bank.math[0],bank.science[0],bank.story[0],bank.art[0]];play.innerHTML='<div class=title>🌞 Daily Quest</div><p class=small>Do one from each subject. Use Random Challenge after each answer.</p><div id=dailyList></div>';dailyList.innerHTML=qs.map(x=>'<span class=pill>'+x[0]+'</span>').join('')}function boss(){let q=allQs()[Math.floor(Math.random()*allQs().length)];ask('🐉 Boss Battle: mixed subject',q)}function parent(){play.innerHTML='<div class=title>👨‍👩‍👧 Parent Snapshot</div><p class=small>Questions attempted: '+state.done+'<br>Current streak: '+state.streak+'<br>Stars: '+state.stars+'<br>Badges: '+(state.badges.join(', ')||'none yet')+'<br><br>Suggestion: ask her to explain one wrong answer in her own words.</p>'}randomBtn.onclick=()=>{let q=allQs()[Math.floor(Math.random()*allQs().length)];ask('🎲 Random Challenge',q)};dailyBtn.onclick=dailyQuest;bossBtn.onclick=boss;parentBtn.onclick=parent;resetBtn.onclick=()=>{state={stars:0,streak:0,done:0,badges:[]};save()};save();</script></body></html>
