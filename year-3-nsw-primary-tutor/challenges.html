<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 3 Challenge Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#fef3c7,#bfdbfe,#dcfce7);color:#1f2937}.app{max-width:1050px;margin:auto;padding:16px}.hero,.card{background:#fffdf7;border:4px solid white;border-radius:28px;padding:18px;box-shadow:0 8px 0 #0002,0 18px 35px #0002}.hero{background:linear-gradient(135deg,#fde68a,#fbcfe8,#bfdbfe);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,7vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:900;border:0;border-radius:18px;background:#2563eb;color:white;padding:16px 18px;box-shadow:0 5px 0 #1e40af;min-height:56px;cursor:pointer}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.pink{background:#db2777;box-shadow:0 5px 0 #831843}.small{color:#475569;line-height:1.5}.title{font-size:1.55rem;font-weight:1000}.big{font-size:2rem;font-weight:1000}.question{font-size:1.25rem;font-weight:900;background:#eff6ff;border:4px dashed #93c5fd;border-radius:24px;padding:18px;margin:14px 0;line-height:1.45}.feedback{padding:14px;border-radius:22px;margin-top:12px;font-weight:900}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.choice{display:block;width:100%;margin:8px 0;text-align:left}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}input,textarea{width:100%;font:inherit;font-size:1.1rem;padding:14px;border:3px solid #93c5fd;border-radius:16px;margin:10px 0}textarea{min-height:110px}a{text-decoration:none}</style></head><body><main class="app"><section class="hero"><h1>🎮 Year 3 Challenge Arcade</h1><p class="small">Now with 60 challenges: tap choices, fill-in-the-blank, longer thinking questions and explanation tasks.</p><div class="row"><button id="allBtn">All 60 Questions</button><button id="dailyBtn" class="orange">Daily Quest</button><button id="bossBtn" class="pink">Boss Battle</button><button id="parentBtn" class="green">Parent Snapshot</button><button id="resetBtn" class="pink">Reset</button><a href="./"><button class="green">Back to lessons</button></a></div></section><section class="grid"><div class="card"><div class="small">Arcade stars</div><div id="stars" class="big">0 ⭐</div></div><div class="card"><div class="small">Streak</div><div id="streak" class="big">0</div></div><div class="card"><div class="small">Badges</div><div id="badges" class="big">0</div></div></section><section class="grid"><button class="orange" onclick="startRun('word')">Word Ninja</button><button class="green" onclick="startRun('math')">Maths Monster</button><button onclick="startRun('science')">Science Sorter</button><button class="pink" onclick="startRun('story')">Story Builder</button><button class="orange" onclick="startRun('art')">Art Spinner</button><button class="green" onclick="memory()">Memory Sprint</button></section><section id="play" class="card"><div class="title">Pick a challenge to begin.</div><p class="small">Some answers are tap choices. Some need typing. Some need a longer sentence.</p></section></main><script>
let state=JSON.parse(localStorage.getItem('y3-arcade-v4')||'{"stars":0,"streak":0,"done":0,"badges":[]}');let run=[],idx=0,answered=false,runTitle='';
const bank={
word:[
{q:'Tap the adjective: The shiny shell sparkled.',a:'shiny',choices:['shell','shiny','sparkled'],tip:'An adjective describes a noun.'},{q:'Tap the verb: The koala climbed slowly.',a:'climbed',choices:['koala','climbed','slowly'],tip:'A verb is an action word.'},{q:'Fill in the blank: An adjective is a ___ word.',a:'describing',type:'text',tip:'It tells what something is like.'},{q:'Type the verb in this sentence: The rocket zoomed upward.',a:'zoomed',type:'text',tip:'Look for the action.'},{q:'Which punctuation shows excitement?',a:'!',choices:['.','!','?'],tip:'An exclamation mark shows strong feeling.'},{q:'Longer answer: Explain why “Lily hid behind the chair” is better evidence that Lily is scared than “Lily was outside.”',a:'hid',type:'long',tip:'A good answer mentions the clue “hid” or explains that hiding shows fear.'},{q:'Tap the adverb: The horse ran quickly.',a:'quickly',choices:['horse','ran','quickly'],tip:'An adverb can describe how an action happens.'},{q:'Fill in the blank: A noun is a person, place or ___.',a:'thing',type:'text',tip:'Person, place or thing.'},{q:'Type the noun: The red kite flew high.',a:'kite',type:'text',tip:'A noun is a thing.'},{q:'Which sentence is complete?',a:'The dog ran fast.',choices:['ran fast','The dog ran fast.','very quickly'],tip:'A complete sentence has a subject and action.'},{q:'Fill in the blank: A comma can show a short ___.',a:'pause',type:'text',tip:'Think of a little stop in the sentence.'},{q:'Longer answer: Write a complete sentence using one adjective.',a:' ',type:'long',tip:'Any sensible complete sentence with a describing word is good.'}
],
math:[
{q:'8 groups of 3 = ?',a:'24',choices:['18','21','24'],tip:'Groups of means multiplication.'},{q:'Half of 32 = ?',a:'16',choices:['14','16','18'],tip:'Half means split into two equal parts.'},{q:'Fill in: 7 groups of 4 means 7 × ___.',a:'4',type:'text',tip:'The number in each group is 4.'},{q:'A box has 6 rows of 5 stickers. How many stickers altogether?',a:'30',type:'text',tip:'Rows of equal groups means multiplication.'},{q:'Round 267 to nearest ten.',a:'270',choices:['260','267','270'],tip:'Look at the ones digit.'},{q:'Perimeter of a 4 cm square?',a:'16',choices:['8','12','16'],tip:'Add all four sides.'},{q:'One quarter of 28?',a:'7',choices:['6','7','14'],tip:'Quarter means one of four equal parts.'},{q:'Next pattern: 6,12,18,24...?',a:'30',choices:['28','30','32'],tip:'The pattern adds 6 each time.'},{q:'A class has 24 pencils. They share them between 4 tables. How many pencils per table?',a:'6',type:'text',tip:'Sharing equally means division.'},{q:'Longer answer: Explain how you know 3 rows of 6 dots makes 18.',a:'3',type:'long',tip:'A good explanation mentions 3 groups of 6, 6+6+6, or 3×6.'},{q:'Fill in: The value of 5 in 356 is ___.',a:'50',type:'text',tip:'5 is in the tens column.'},{q:'A toy costs $7. You buy 3 toys. How much?',a:'21',type:'text',tip:'3 groups of 7.'}
],
science:[
{q:'Best prediction: Dark clouds mean it may...',a:'rain',choices:['rain','snow in summer','turn purple'],tip:'Use clues to predict.'},{q:'A fair test changes...',a:'one thing',choices:['one thing','everything','nothing'],tip:'Change one variable only.'},{q:'Fill in: An observation is something you carefully ___.',a:'notice',type:'text',tip:'Observe means notice carefully.'},{q:'Ice melting becomes...',a:'liquid',choices:['gas','liquid','sand'],tip:'Melted ice becomes water.'},{q:'A magnet attracts...',a:'iron',choices:['wood','plastic','iron'],tip:'Magnets attract some metals.'},{q:'Plants need which one?',a:'sunlight',choices:['sunlight','shoes','pencils'],tip:'Plants need sunlight, water and air.'},{q:'Writing what happened in a test is recording...',a:'results',choices:['results','guesses','colours'],tip:'Results are observations or measurements.'},{q:'Fill in: A material is what something is made ___.',a:'from',type:'text',tip:'Made from.'},{q:'Longer answer: Why is it unfair to change water and sunlight in the same plant test?',a:'because',type:'long',tip:'A good answer says you would not know which change caused the result.'},{q:'Type one thing a plant needs to grow.',a:'water',type:'text',alts:['sunlight','air','soil'],tip:'Water, sunlight and air are common answers.'},{q:'Which sense helps you hear a bell?',a:'hearing',type:'text',tip:'Ears are for hearing.'},{q:'Longer answer: Write a prediction using “because”.',a:'because',type:'long',tip:'Use: I predict ___ because ___.'}
],
story:[
{q:'Choose the most exciting opener.',a:'At midnight, the map began to glow.',choices:['A map.','At midnight, the map began to glow.','It was there.'],tip:'Strong openings give detail and mystery.'},{q:'Best problem for a story.',a:'The bridge vanished before school.',choices:['Lunch was nice.','The bridge vanished before school.','I have shoes.'],tip:'A problem creates something to solve.'},{q:'Choose the strongest verb.',a:'sprinted',choices:['went','sprinted','nice'],tip:'Precise verbs make writing stronger.'},{q:'Fill in: A story setting tells where and ___.',a:'when',type:'text',tip:'Setting = where and when.'},{q:'Best ending job.',a:'solve or finish the story',choices:['start again','solve or finish the story','add random facts'],tip:'Endings should feel complete.'},{q:'Best setting detail.',a:'Fog curled around the empty playground.',choices:['It was a place.','Fog curled around the empty playground.','The end.'],tip:'Setting detail helps the reader imagine the place.'},{q:'Best editing check.',a:'capital letters and full stops',choices:['shoes','capital letters and full stops','favourite colour'],tip:'Editing improves clarity.'},{q:'Longer answer: Write one sentence that starts a mystery story.',a:' ',type:'long',tip:'A good mystery opening includes a clue, setting or problem.'},{q:'Fill in: The tricky part of a story is the ___.',a:'problem',type:'text',tip:'It is what the character must solve.'},{q:'Rewrite with a stronger verb: The girl went across the oval.',a:' ',type:'long',tip:'Try sprinted, raced, dashed, crept or wandered.'},{q:'Type one word that could create a spooky mood.',a:'dark',type:'text',alts:['creepy','silent','shadow','whispered','foggy'],tip:'Words like dark, shadow, silent and creepy help mood.'},{q:'Longer answer: Describe a character with two adjectives.',a:' ',type:'long',tip:'Example: The nervous, brave girl opened the door.'}
],
art:[
{q:'Repeated shapes create a...',a:'pattern',choices:['texture','pattern','volume'],tip:'A pattern repeats.'},{q:'Rough, smooth and bumpy are...',a:'textures',choices:['textures','numbers','verbs'],tip:'Texture is how something feels.'},{q:'Black next to white shows...',a:'contrast',choices:['contrast','quiet','fraction'],tip:'Contrast means strong difference.'},{q:'Fill in: A line can be straight, curved or ___.',a:'zigzag',type:'text',tip:'Zigzag is a type of line.'},{q:'The main thing your eye sees first is the...',a:'focus',choices:['focus','weather','noun'],tip:'Focus is the main part.'},{q:'Red and yellow are usually...',a:'warm colours',choices:['warm colours','cool colours','fractions'],tip:'Warm colours can feel bright or energetic.'},{q:'Blue and green are usually...',a:'cool colours',choices:['warm colours','cool colours','verbs'],tip:'Cool colours can feel calm.'},{q:'Longer answer: Describe an artwork using contrast.',a:' ',type:'long',tip:'A good answer mentions two things that are very different.'},{q:'Fill in: Texture means how something feels or ___.',a:'looks',type:'text',tip:'Texture can be real or visual.'},{q:'Type one warm colour.',a:'red',type:'text',alts:['yellow','orange'],tip:'Warm colours include red, yellow and orange.'},{q:'Longer answer: Plan a border pattern using two shapes.',a:' ',type:'long',tip:'Example: circle, square, circle, square.'},{q:'What should an artist make before final artwork?',a:'plan',type:'text',tip:'Planning helps choose ideas.'}
]};
function save(){localStorage.setItem('y3-arcade-v4',JSON.stringify(state));stars.textContent=state.stars+' ⭐';streak.textContent=state.streak;badges.textContent=state.badges.length}function allQs(){return Object.values(bank).flat()}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function startRun(type){run=shuffle(bank[type]);idx=0;runTitle=label(type);showCurrent()}function startAll(){run=shuffle(allQs());idx=0;runTitle='🌟 All 60 Questions';showCurrent()}function showCurrent(){answered=false;if(idx>=run.length)return finishRun();let q=run[idx];play.innerHTML='<div class=title>'+runTitle+'</div><span class=pill>Question '+(idx+1)+' / '+run.length+'</span><div class=question>'+q.q+'</div><div id=answerArea></div><div id=fb></div>';if(q.type==='text'){answerArea.innerHTML='<input id=typed placeholder="Type your answer"><button class="green" onclick="checkTyped()">Check Answer</button>';typed.focus()}else if(q.type==='long'){answerArea.innerHTML='<textarea id=typed placeholder="Write a longer answer or explanation"></textarea><button class="green" onclick="checkTyped()">Check Answer</button>'}else{shuffle(q.choices).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(matches(c,q),q.tip);answerArea.appendChild(b)})}}function matches(v,q){let x=String(v).toLowerCase().trim(),a=String(q.a).toLowerCase().trim();if(x===a)return true;if(q.alts&&q.alts.map(z=>z.toLowerCase()).includes(x))return true;if(q.type==='long')return x.length>15&&(a===' '||x.includes(a));return false}function checkTyped(){let q=run[idx];answer(matches(typed.value,q),q.tip)}function answer(ok,tip){if(answered)return;answered=true;fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=(ok?'Correct! +5 stars':'Try again. Concept clue: '+tip)+'<br><button class="green" onclick="nextQuestion()">Next Question</button>';if(ok){state.stars+=5;state.streak++;state.done++;award()}else state.streak=0;save()}function nextQuestion(){idx++;showCurrent()}function finishRun(){play.innerHTML='<div class=title>🏁 Challenge complete!</div><p class=small>You finished '+run.length+' questions. Stars: '+state.stars+'. Streak: '+state.streak+'.</p><button onclick="startAll()">Play all 60 again</button>'}function award(){if(state.streak>=5&&!state.badges.includes('Streak Star'))state.badges.push('Streak Star');if(state.done>=20&&!state.badges.includes('Quest Builder'))state.badges.push('Quest Builder');if(state.done>=60&&!state.badges.includes('Arcade Hero'))state.badges.push('Arcade Hero')}function label(t){return {word:'🥷 Word Ninja',math:'👾 Maths Monster',science:'🔬 Science Sorter',story:'🎲 Story Builder',art:'🎨 Art Spinner'}[t]}function memory(){let seq=Array.from({length:4+Math.min(4,state.streak)},()=>Math.floor(Math.random()*9)+1);play.innerHTML='<div class=title>🧠 Memory Sprint</div><div class=question>'+seq.join(' - ')+'</div><button id=hide class=green>I remember</button><div id=fb></div>';hide.onclick=()=>{play.innerHTML='<div class=title>Type the numbers</div><input id=mem style="width:100%;font:inherit;font-size:1.4rem;padding:16px;border-radius:18px;border:3px solid #93c5fd"><button id=check class=green>Check</button><div id=fb></div>';check.onclick=()=>answer(mem.value.replace(/\D/g,'')===seq.join(''),'Try grouping the numbers in pairs.')}}function dailyQuest(){run=[bank.word[0],bank.math[0],bank.science[0],bank.story[0],bank.art[0]];idx=0;runTitle='🌞 Daily Quest';showCurrent()}function boss(){run=shuffle(allQs()).slice(0,15);idx=0;runTitle='🐉 Boss Battle';showCurrent()}function parent(){play.innerHTML='<div class=title>👨‍👩‍👧 Parent Snapshot</div><p class=small>Questions attempted: '+state.done+'<br>Current streak: '+state.streak+'<br>Stars: '+state.stars+'<br>Badges: '+(state.badges.join(', ')||'none yet')+'<br><br>Suggestion: ask her to explain one longer answer out loud.</p>'}allBtn.onclick=startAll;dailyBtn.onclick=dailyQuest;bossBtn.onclick=boss;parentBtn.onclick=parent;resetBtn.onclick=()=>{state={stars:0,streak:0,done:0,badges:[]};save()};save();</script></body></html>
