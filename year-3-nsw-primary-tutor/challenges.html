<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 3 Challenge Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#fef3c7,#bfdbfe,#dcfce7);color:#1f2937}.app{max-width:1050px;margin:auto;padding:16px}.hero,.card{background:#fffdf7;border:4px solid white;border-radius:28px;padding:18px;box-shadow:0 8px 0 #0002,0 18px 35px #0002}.hero{background:linear-gradient(135deg,#fde68a,#fbcfe8,#bfdbfe);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,7vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:900;border:0;border-radius:18px;background:#2563eb;color:white;padding:16px 18px;box-shadow:0 5px 0 #1e40af;min-height:56px}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.pink{background:#db2777;box-shadow:0 5px 0 #831843}.small{color:#475569;line-height:1.5}.title{font-size:1.55rem;font-weight:1000}.big{font-size:2rem;font-weight:1000}.question{font-size:1.4rem;font-weight:1000;background:#eff6ff;border:4px dashed #93c5fd;border-radius:24px;padding:18px;margin:14px 0}.feedback{padding:14px;border-radius:22px;margin-top:12px;font-weight:900}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.idea{background:#fff7ed;border:3px solid #fdba74}.choice{display:block;width:100%;margin:8px 0;text-align:left}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}</style></head><body><main class="app"><section class="hero"><h1>🎮 Year 3 Challenge Arcade</h1><p class="small">Quick, fun practice games for English, maths, science, writing and art. Great for iPad when lesson mode starts feeling slow.</p><div class="row"><button id="randomBtn">Random challenge</button><button id="resetBtn" class="pink">Reset score</button><a href="./"><button class="green">Back to lessons</button></a></div></section><section class="grid"><div class="card"><div class="small">Arcade stars</div><div id="stars" class="big">0 ⭐</div></div><div class="card"><div class="small">Streak</div><div id="streak" class="big">0</div></div><div class="card"><div class="small">Challenge</div><div id="mode" class="big">Ready</div></div></section><section class="grid"><button class="orange" onclick="start('word')">Word Ninja</button><button class="green" onclick="start('math')">Maths Monster</button><button onclick="start('science')">Science Sorter</button><button class="pink" onclick="start('story')">Story Dice</button><button class="orange" onclick="start('art')">Art Spinner</button><button class="green" onclick="start('memory')">Memory Sprint</button></section><section id="play" class="card"><div class="title">Pick a challenge to begin.</div><p class="small">Tip: aim for 5 correct in a row.</p></section></main><script>let state=JSON.parse(localStorage.getItem('y3-arcade')||'{"stars":0,"streak":0}');const bank={word:[['Tap the adjective: The shiny shell sparkled.','shiny',['shell','shiny','sparkled'],'An adjective describes a noun.'],['Tap the verb: The koala climbed slowly.','climbed',['koala','climbed','slowly'],'A verb is an action word.'],['Tap the noun: The rocket zoomed upward.','rocket',['rocket','zoomed','upward'],'A noun is a person, place or thing.'],['Which punctuation shows excitement?','!',['.','!','?'],'An exclamation mark shows strong feeling.']],math:[['8 groups of 3 = ?','24',['18','21','24'],'Groups of means multiplication.'],['Half of 32 = ?','16',['14','16','18'],'Half means split into two equal parts.'],['Round 267 to nearest ten.','270',['260','267','270'],'Look at the ones digit.'],['Perimeter of a 4 cm square?','16',['8','12','16'],'Add all four sides.']],science:[['Best prediction: Dark clouds mean it may...','rain',['rain','snow in summer','turn purple'],'Use clues to predict.'],['A fair test changes...','one thing',['one thing','everything','nothing'],'Change one variable only.'],['Ice melting becomes...','liquid',['gas','liquid','sand'],'Melted ice becomes water.'],['A magnet attracts...','iron',['wood','plastic','iron'],'Magnets attract some metals.']],story:[['Choose the most exciting opener.','At midnight, the map began to glow.',['A map.','At midnight, the map began to glow.','It was there.'],'Strong openings give detail and mystery.'],['Best problem for a story.','The bridge vanished before school.',['Lunch was nice.','The bridge vanished before school.','I have shoes.'],'A problem creates something to solve.'],['Choose the strongest verb.','sprinted',['went','sprinted','nice'],'Precise verbs make writing stronger.'],['Best ending job.','solve or finish the story',['start again','solve or finish the story','add random facts'],'Endings should feel complete.']],art:[['Repeated shapes create a...','pattern',['texture','pattern','volume'],'A pattern repeats.'],['Rough, smooth and bumpy are...','textures',['textures','numbers','verbs'],'Texture is how something feels.'],['Black next to white shows...','contrast',['contrast','quiet','fraction'],'Contrast means strong difference.'],['The main thing your eye sees first is the...','focus',['focus','weather','noun'],'Focus is the main part.']],memory:[]};function save(){localStorage.setItem('y3-arcade',JSON.stringify(state));stars.textContent=state.stars+' ⭐';streak.textContent=state.streak}function start(type){mode.textContent=type;if(type==='memory')return memory();let set=bank[type],q=set[Math.floor(Math.random()*set.length)];play.innerHTML='<div class=title>'+label(type)+'</div><div class=question>'+q[0]+'</div><div id=choices></div><div id=fb></div>';q[2].sort(()=>Math.random()-.5).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(c===q[1],q[3]);choices.appendChild(b)})}function answer(ok,tip){fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct! +5 stars':'Try again. Concept clue: '+tip;if(ok){state.stars+=5;state.streak++}else state.streak=0;save()}function label(t){return {word:'🥷 Word Ninja',math:'👾 Maths Monster',science:'🔬 Science Sorter',story:'🎲 Story Dice',art:'🎨 Art Spinner'}[t]}function memory(){mode.textContent='memory';let seq=Array.from({length:4+Math.min(4,state.streak)},()=>Math.floor(Math.random()*9)+1);play.innerHTML='<div class=title>🧠 Memory Sprint</div><div class=question>'+seq.join(' - ')+'</div><button id=hide class=green>I remember</button><div id=fb></div>';hide.onclick=()=>{play.innerHTML='<div class=title>Type the numbers</div><input id=mem style="width:100%;font:inherit;font-size:1.4rem;padding:16px;border-radius:18px;border:3px solid #93c5fd"><button id=check class=green>Check</button><div id=fb></div>';check.onclick=()=>answer(mem.value.replace(/\D/g,'')===seq.join(''),'Try grouping the numbers in pairs.')}}randomBtn.onclick=()=>start(['word','math','science','story','art','memory'][Math.floor(Math.random()*6)]);resetBtn.onclick=()=>{state={stars:0,streak:0};save()};save();</script></body></html>
