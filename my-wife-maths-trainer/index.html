<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Wife Maths Trainer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#111827,#1e3a8a,#064e3b);color:#111827}.app{max-width:1120px;margin:auto;padding:16px}.hero,.card{background:#f8fafc;border:1px solid #ffffff55;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 18px 40px #0004}.hero{background:linear-gradient(135deg,#e0f2fe,#fef3c7,#dcfce7);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,6vw,4rem);margin:0;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{font:inherit;font-weight:800;border:0;border-radius:16px;background:#2563eb;color:white;padding:14px 16px;min-height:52px;box-shadow:0 5px 0 #1e3a8a;cursor:pointer}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.purple{background:#7c3aed;box-shadow:0 5px 0 #4c1d95}button.ghost{background:white;color:#111827;border:2px solid #cbd5e1;box-shadow:0 5px 0 #94a3b8}input,textarea{width:100%;font:inherit;font-size:1.05rem;padding:14px;border:2px solid #93c5fd;border-radius:14px;margin:8px 0}.small{color:#475569;line-height:1.55}.title{font-size:1.45rem;font-weight:900}.big{font-size:2rem;font-weight:900}.pill{display:inline-block;background:#e0f2fe;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800;color:#075985}.question{background:#eff6ff;border:3px solid #93c5fd;border-radius:20px;padding:18px;margin:14px 0;font-size:1.25rem;font-weight:800}.feedback{padding:14px;border-radius:18px;margin-top:12px;font-weight:800}.good{background:#dcfce7;border:2px solid #22c55e}.bad{background:#fee2e2;border:2px solid #ef4444}.idea{background:#fff7ed;border:2px solid #fdba74}.choice{display:block;width:100%;text-align:left;margin:8px 0}.hidden{display:none}.progress{height:16px;border-radius:999px;background:#e5e7eb;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#16a34a);width:0}</style></head><body><main class="app"><section class="hero"><h1>💍 My Wife Maths Trainer</h1><p class="small">A respectful high-school maths retraining app for an intelligent adult learner who wants confidence from the foundations upward. Built for quick practice, concept explanations, saved logs and gradual progression.</p><div class="row"><button onclick="startPath()">Start learning path</button><button class="green" onclick="startAdaptive()">Adaptive practice</button><button class="orange" onclick="showModules()">Choose topic</button><button class="purple" onclick="showLog()">Progress log</button><button class="ghost" onclick="resetAll()">Reset</button></div></section><section class="grid"><div class="card"><div class="small">XP</div><div id="xp" class="big">0</div></div><div class="card"><div class="small">Correct</div><div id="correct" class="big">0</div></div><div class="card"><div class="small">Attempted</div><div id="attempted" class="big">0</div></div><div class="card"><div class="small">Current level</div><div id="level" class="big">1</div></div></section><section id="modules" class="grid"></section><section id="lesson" class="card hidden"><div id="lt" class="title"></div><div id="meta"></div><p id="explain" class="small"></p><div id="words"></div><div id="q" class="question"></div><input id="ans" placeholder="Type your answer here"><div class="row"><button onclick="checkAnswer()">Check</button><button class="purple" onclick="showConcept()">Teach the concept</button><button class="orange" onclick="showHint()">Small hint</button><button class="green" onclick="nextQuestion()">Next</button></div><div id="fb"></div><div id="reflection" class="hidden"><p id="reflectPrompt" class="small"></p><textarea id="reflectText" placeholder="Optional: explain the step in your own words..."></textarea><button class="green" onclick="saveReflection()">Save reflection</button><div id="reflectFb"></div></div></section><section id="logBox" class="card hidden"></section></main><script>
const modulesData=[
{id:'number',title:'Number Sense & Arithmetic',level:'Foundation',goal:'Rebuild confidence with operations, negatives, order of operations and estimation.',words:['integer = whole number','operation = maths action','estimate = sensible rough answer'],qs:[['Calculate: 7 + 8 × 2','23','Multiplication happens before addition.','Use BIDMAS/order of operations. Do 8×2 first, then add 7.','Explain why multiplication came first.'],['Calculate: -3 + 8','5','Moving 8 steps up from -3 lands on 5.','Negative plus positive moves toward the positive side if the positive is larger.','Write a number-line explanation.'],['Calculate: 45 ÷ 5 + 6','15','45 ÷ 5 is 9, then add 6.','Division happens before addition.','Explain the two steps.'],['Estimate: 198 + 403 is closest to?','600','198 is close to 200 and 403 is close to 400.','Estimation rounds numbers to make mental maths easier.','Explain why 600 is sensible.']]},
{id:'fractions',title:'Fractions, Decimals & Percentages',level:'Foundation to Year 8',goal:'Understand equivalent values, converting forms and percentage thinking.',words:['equivalent = same value','percentage = out of 100','denominator = bottom number'],qs:[['Simplify 6/12','1/2','Divide top and bottom by 6.','Equivalent fractions keep the same value when you divide numerator and denominator by the same number.','Explain why 6/12 and 1/2 match.'],['Convert 0.25 to a fraction','1/4','0.25 is 25/100, which simplifies to 1/4.','Decimals can be read as tenths, hundredths or thousandths.','Explain 25 hundredths.'],['Find 20% of 80','16','10% is 8, so 20% is 16.','Percent means out of 100. Break percentages into easy chunks.','Explain the 10% method.'],['Which is larger: 2/3 or 3/5?','2/3','2/3 is about 0.67; 3/5 is 0.6.','Compare fractions using decimals or common denominators.','Explain one comparison method.']]},
{id:'algebra',title:'Algebra Basics',level:'Year 8–9',goal:'Understand variables, substitution, collecting like terms and solving equations.',words:['variable = unknown or changing value','coefficient = number multiplying a variable','inverse = opposite operation'],qs:[['If x = 4, calculate 3x + 2','14','3×4+2 = 14.','Substitution means replacing the letter with its value.','Explain substitution.'],['Simplify: 3x + 2x','5x','Like terms can be combined.','Only like terms can be collected. 3 lots of x plus 2 lots of x makes 5 lots of x.','Explain like terms.'],['Solve: x + 7 = 15','8','Subtract 7 from both sides.','Use inverse operations to keep the equation balanced.','Explain why subtracting 7 works.'],['Solve: 4x = 28','7','Divide both sides by 4.','When x is multiplied by 4, divide by 4 to undo it.','Explain inverse operation.']]},
{id:'linear',title:'Linear Equations & Graphs',level:'Year 9–10',goal:'Read gradients, intercepts and solve two-step equations.',words:['gradient = steepness','intercept = where graph crosses axis','linear = straight-line relationship'],qs:[['Solve: 2x + 5 = 17','6','Subtract 5, then divide by 2.','Undo addition/subtraction first, then multiplication/division.','Explain the two steps.'],['In y = 3x + 2, what is the gradient?','3','The coefficient of x is the gradient.','In y=mx+b, m is gradient.','Explain gradient in plain English.'],['In y = 4x - 7, what is the y-intercept?','-7','The constant term is the y-intercept.','In y=mx+b, b is the y-intercept.','Explain intercept.'],['If y = 2x + 1 and x = 5, find y','11','2×5+1 = 11.','Substitute x first, then calculate.','Explain the substitution.']]},
{id:'geometry',title:'Measurement & Geometry',level:'Year 7–10',goal:'Area, perimeter, angles, volume and practical measurement.',words:['perimeter = distance around','area = space inside','volume = space inside 3D object'],qs:[['Area of rectangle 8 cm by 5 cm','40','Area = length × width.','Area counts square units inside a shape.','Write the answer with cm².'],['Perimeter of rectangle 8 cm by 5 cm','26','8+5+8+5 = 26.','Perimeter is the total distance around.','Explain perimeter vs area.'],['Angles in a triangle add to?','180','Triangle angles add to 180 degrees.','This is a core geometry fact.','Write one example of triangle angles.'],['Volume of box 3×4×5','60','3×4×5 = 60.','Volume of rectangular prism = length × width × height.','Explain volume units.']]},
{id:'quadratics',title:'Quadratics Preview',level:'Year 10+',goal:'Build readiness for factorising, parabolas and algebraic patterns.',words:['quadratic = includes x squared','factorise = rewrite as multiplication','parabola = U-shaped graph'],qs:[['Expand: (x + 2)(x + 3)','x^2+5x+6','Multiply each part and collect like terms.','Use FOIL: first, outside, inside, last.','Explain FOIL.'],['Factorise: x² + 5x + 6','(x+2)(x+3)','2 and 3 multiply to 6 and add to 5.','Find two numbers with product c and sum b.','Explain product and sum.'],['Solve: x² = 25','x=5 or x=-5','Both 5 and -5 square to 25.','Squaring removes the sign, so there can be two roots.','Explain two solutions.'],['What shape is a quadratic graph?','parabola','Quadratics make U-shaped curves.','The graph of y=x² is a parabola.','Describe a parabola.']]}
];
let st=JSON.parse(localStorage.getItem('my-wife-maths-progress')||'{"xp":0,"correct":0,"attempted":0,"moduleProgress":{},"log":[]}');let current=null,idx=0,adaptive=[];
function save(){localStorage.setItem('my-wife-maths-progress',JSON.stringify(st));xp.textContent=st.xp;correct.textContent=st.correct;attempted.textContent=st.attempted;level.textContent=Math.max(1,Math.floor(st.correct/8)+1);renderModules()}function norm(x){return String(x).toLowerCase().replace(/\s/g,'').replace(/²/g,'^2').replace(/−/g,'-')}function renderModules(){modules.textContent='';modulesData.forEach(m=>{let card=document.createElement('div');card.className='card';let p=st.moduleProgress[m.id]||0;card.innerHTML='<div class=title>'+m.title+'</div><p class=small>'+m.goal+'</p><span class=pill>'+m.level+'</span><span class=pill>'+p+'/'+m.qs.length+' complete</span><br>';let b=document.createElement('button');b.textContent='Open module';b.onclick=()=>openModule(m.id);card.appendChild(b);modules.appendChild(card)})}function showModules(){lesson.classList.add('hidden');logBox.classList.add('hidden');modules.scrollIntoView({behavior:'smooth'})}function openModule(id){current=modulesData.find(m=>m.id===id);idx=st.moduleProgress[id]||0;if(idx>=current.qs.length)idx=0;lesson.classList.remove('hidden');logBox.classList.add('hidden');lesson.scrollIntoView({behavior:'smooth'});showQ()}function showQ(){let item=current.qs[idx];lt.textContent=current.title;meta.innerHTML='<span class=pill>'+current.level+'</span><span class=pill>Question '+(idx+1)+'/'+current.qs.length+'</span>';explain.textContent=current.goal;words.innerHTML=current.words.map(w=>'<span class=pill>'+w+'</span>').join('');q.textContent=item[0];ans.value='';fb.textContent='';fb.className='';reflection.classList.add('hidden');reflectFb.textContent=''}function checkAnswer(){let item=current.qs[idx];let ok=norm(ans.value)===norm(item[1]);st.attempted++;if(ok){st.correct++;st.xp+=10;st.moduleProgress[current.id]=Math.max(st.moduleProgress[current.id]||0,idx+1);reflectPrompt.textContent=item[4];reflection.classList.remove('hidden')}else st.xp+=2;st.log.push({date:new Date().toLocaleString(),module:current.title,q:item[0],user:ans.value,answer:item[1],correct:ok});fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=(ok?'Correct. ':'Not quite. Correct answer: '+item[1]+'. ')+item[2];save()}function showConcept(){let item=current.qs[idx];fb.className='feedback idea';fb.textContent='Concept: '+item[3]}function showHint(){let item=current.qs[idx];fb.className='feedback idea';fb.textContent='Small hint: '+item[2]}function nextQuestion(){idx=(idx+1)%current.qs.length;showQ()}function saveReflection(){st.xp+=3;reflectFb.className='feedback good';reflectFb.textContent='Reflection saved. +3 XP';save()}function startPath(){openModule(modulesData[Math.min(Math.floor(st.correct/6),modulesData.length-1)].id)}function makeAdaptive(){let pool=modulesData.slice(0,Math.min(modulesData.length,Math.max(2,Math.floor(st.correct/8)+2))).flatMap(m=>m.qs.map(q=>({m,q})));let pick=pool[Math.floor(Math.random()*pool.length)];current={id:'adaptive',title:'Adaptive Practice',level:'Mixed review',goal:'Questions are selected from earlier modules based on progress.',words:['review = strengthen memory','confidence = repeated successful practice'],qs:[pick.q]};idx=0;showQ()}function startAdaptive(){lesson.classList.remove('hidden');logBox.classList.add('hidden');makeAdaptive()}function showLog(){lesson.classList.add('hidden');modules.scrollIntoView({behavior:'smooth'});logBox.classList.remove('hidden');let recent=st.log.slice(-30).reverse().map(x=>'<p><b>'+x.module+'</b><br>'+x.q+'<br>Your answer: '+(x.user||'(blank)')+' | Correct: '+x.answer+' | '+(x.correct?'✅':'❌')+'</p>').join('');logBox.innerHTML='<div class=title>Progress log</div><p class=small>Total attempted: '+st.attempted+' | Correct: '+st.correct+' | XP: '+st.xp+'</p>'+recent;logBox.scrollIntoView({behavior:'smooth'})}function resetAll(){if(confirm('Reset progress on this device?')){st={xp:0,correct:0,attempted:0,moduleProgress:{},log:[]};save();lesson.classList.add('hidden');logBox.classList.add('hidden')}}save();</script></body></html>
