<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>iPad Focus Meteor</title><style>html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui;background:#0f172a;color:white}.top{padding:10px;background:#111827}.pill{display:inline-block;background:#1d4ed8;border-radius:999px;padding:8px 10px;margin:3px;font-weight:800}button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 12px;margin:3px;background:#22c55e;color:#052e16}.game{height:calc(100% - 96px);position:relative}canvas{width:100%;height:100%;display:block;background:linear-gradient(#020617,#1e3a8a)}.msg{position:absolute;left:8px;right:8px;bottom:8px;background:#111827dd;border-radius:14px;padding:10px;font-weight:800}</style></head><body><div class="top"><span id="lvl" class="pill">Level 1</span><span id="score" class="pill">Score 0</span><span id="best" class="pill">Best 0</span><span id="target" class="pill">Target -</span><button onclick="start()">Start</button><button onclick="resetGame()">Start Again</button><a href="./"><button>Back</button></a></div><div class="game" id="box"><canvas id="c"></canvas><div id="msg" class="msg">Tap the target word. Avoid HUNTER.</div></div><script>let cv=c,ctx=cv.getContext('2d'),box=document.getElementById('box'),items=[],hunter=null,targetObj=null,timer=null,st=JSON.parse(localStorage.getItem('ipadMeteorGame')||'{"level":1,"score":0,"best":0,"hits":0}');const words=['SIMILE','METAPHOR','EVIDENCE','VARIABLE','HYPOTHESIS','PERSPECTIVE','CONTRAST','THESIS','MEAN','GRAVITY','COHESION','SYMBOL','TONE','AREA','PERCENT','ENERGY','RESULTS','TEXTURE','COMPOSITION','INFERENCE','FRACTION','DECIMAL'];function fit(){cv.width=box.clientWidth;cv.height=box.clientHeight}addEventListener('resize',fit);fit();function save(){st.best=Math.max(st.best,st.score);localStorage.setItem('ipadMeteorGame',JSON.stringify(st));lvl.textContent='Level '+st.level;score.textContent='Score '+st.score;best.textContent='Best '+st.best;target.textContent='Target '+(targetObj?targetObj.w:'-')}function rw(ex=''){let w=words[Math.floor(Math.random()*words.length)];let n=0;while(w===ex&&n++<20)w=words[Math.floor(Math.random()*words.length)];return w}function make(w,hunter=false){let sp=1.7+st.level*.25;return{w,hunter,x:80+Math.random()*(cv.width-160),y:60+Math.random()*(cv.height-130),vx:sp*(Math.random()<.5?-1:1),vy:sp*(Math.random()<.5?-1:1),r:55}}function start(){items=[];for(let i=0;i<Math.min(20,6+st.level*2);i++)items.push(make(rw()));hunter=make('HUNTER',true);items.push(hunter);choose();clearInterval(timer);timer=setInterval(draw,30);msg.textContent='Tap '+targetObj.w+'.';save()}function resetGame(){st={level:1,score:0,best:0,hits:0};items=[];targetObj=null;clearInterval(timer);ctx.clearRect(0,0,cv.width,cv.height);msg.textContent='Reset. Tap Start.';save()}function choose(){let pool=items.filter(x=>!x.hunter);targetObj=pool[Math.floor(Math.random()*pool.length)]}function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(let it of items){if(it.hunter&&targetObj){let dx=targetObj.x-it.x,dy=targetObj.y-it.y,l=Math.max(1,Math.hypot(dx,dy));it.vx+=dx/l*.025;it.vy+=dy/l*.025}it.x+=it.vx;it.y+=it.vy;if(it.x<60||it.x>cv.width-60)it.vx*=-1;if(it.y<40||it.y>cv.height-40)it.vy*=-1;ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=it.hunter?'#fee2e2':(it===targetObj?'#fde68a':'#dbeafe');ctx.strokeStyle=it===targetObj?'#facc15':'#fff';ctx.lineWidth=3;let w=Math.max(90,it.w.length*13);roundRect(it.x-w/2,it.y-24,w,48,14);ctx.fill();ctx.stroke();ctx.fillStyle='#172554';ctx.fillText(it.w,it.x,it.y)}if(hunter&&targetObj&&Math.hypot(hunter.x-targetObj.x,hunter.y-targetObj.y)<58){st.score=Math.max(0,st.score-5);targetObj.w=rw(targetObj.w);choose();msg.textContent='HUNTER stole the word. -5';save()}}function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let it of items){let w=Math.max(90,it.w.length*13);if(x>it.x-w/2&&x<it.x+w/2&&y>it.y-28&&y<it.y+28){if(it.hunter){st.score=Math.max(0,st.score-8);msg.textContent='Tapped HUNTER. -8'}else if(it===targetObj){st.score+=10;st.hits++;msg.textContent='Correct!';it.w=rw(it.w);choose();if(st.hits>=4+st.level*2){st.level++;st.hits=0;msg.textContent='Level up!'}}else{st.score=Math.max(0,st.score-5);msg.textContent='Wrong word. -5'}save();return}}});save();</script></body></html>
