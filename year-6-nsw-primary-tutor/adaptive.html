<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 6 Adaptive Learning</title><style>body{margin:0;font-family:Verdana,system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1d4ed8,#16a34a);color:#172554}.app{max-width:1100px;margin:auto;padding:16px}.card,.hero{background:#fff;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 10px 24px #0003}.hero{background:linear-gradient(135deg,#dbeafe,#fef3c7,#dcfce7);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,6vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}button{font:inherit;font-weight:900;border:0;border-radius:16px;background:#2563eb;color:#fff;padding:16px;margin:5px;min-height:54px}button.green{background:#16a34a}button.orange{background:#f97316}button.purple{background:#7c3aed}input,textarea{width:100%;font:inherit;font-size:1.05rem;padding:14px;border:3px solid #93c5fd;border-radius:16px;margin:8px 0}.q{font-size:1.25rem;font-weight:900;background:#eff6ff;border:4px solid #93c5fd;border-radius:22px;padding:16px;margin:12px 0}.small{color:#475569;line-height:1.55}.pill{display:inline-block;background:#e0f2fe;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}.fb{padding:14px;border-radius:18px;font-weight:900}.good{background:#dcfce7}.bad{background:#fee2e2}.idea{background:#fff7ed}</style></head><body><main class="app"><section class="hero"><h1>🚀 Year 6 Adaptive Quest</h1><p class="small">A bigger question engine with mixed short and long prompts, concept clues, saved logs and fresh generated sessions.</p><button onclick="startSession()">Start 25-question session</button><button class="orange" onclick="newSet()">Generate new set</button><button class="green" onclick="showLog()">Learning log</button><a href="./"><button class="purple">Back to normal lessons</button></a></section><section class="grid"><div class="card"><b>XP</b><div id="xp">0</div></div><div class="card"><b>Correct</b><div id="correct">0</div></div><div class="card"><b>Attempted</b><div id="attempted">0</div></div></section><section id="main" class="card"><h2>Ready</h2><p class="small">This version saves attempts locally and generates fresh sessions so the content does not run out quickly.</p></section></main><script>let st=JSON.parse(localStorage.getItem('y6-adaptive-log')||'{"xp":0,"correct":0,"attempted":0,"log":[]}');let session=[],idx=0,current=null,answered=false;const subjects=['English','Writing','Maths','Science','Art'];function r(a){return a[Math.floor(Math.random()*a.length)]}function save(){localStorage.setItem('y6-adaptive-log',JSON.stringify(st));xp.textContent=st.xp;correct.textContent=st.correct;attempted.textContent=st.attempted}function makeQ(){let s=r(subjects);if(s==='Maths'){let kind=r(['percent','algebra','mean','area']);if(kind==='percent'){let base=r([80,100,120,200]),p=r([10,20,25,30,50]);return {s,q:`What is ${p}% of ${base}?`,a:String(base*p/100),clue:'Percent means out of 100. Try finding 10% or 25% first.',write:'Explain your percentage method.'}}if(kind==='algebra'){let x=2+Math.floor(Math.random()*10),m=2+Math.floor(Math.random()*8);return {s,q:`If ${m}x = ${m*x}, what is x?`,a:String(x),clue:'Use the inverse operation. Undo multiplication with division.',write:'Explain what the variable represents.'}}if(kind==='mean'){let a=2+Math.floor(Math.random()*10),b=2+Math.floor(Math.random()*10),c=2+Math.floor(Math.random()*10);return {s,q:`Find the mean of ${a}, ${b}, ${c}.`,a:String((a+b+c)/3),clue:'Mean equals total divided by how many numbers.',write:'Explain how to find the mean.'}}let l=3+Math.floor(Math.random()*10),w=3+Math.floor(Math.random()*10);return {s,q:`Area of a rectangle ${l} cm by ${w} cm?`,a:String(l*w),clue:'Area equals length times width.',write:'Write the answer with square centimetres.'}}if(s==='English'){let opts=[['The waves folded over the rocks like silver blankets. Which technique is used?','simile','A simile compares using like or as.'],['The classroom was a pressure cooker before the test. Which technique is used?','metaphor','A metaphor says one thing is another.'],['A character clenched her fists and spoke through her teeth. What can you infer?','angry','Inference uses clues from behaviour.'],['Which is stronger evidence? A) I reckon she was upset. B) The text says tears ran down her face.','b','Evidence is a specific detail from the text.']];let x=r(opts);return {s,q:x[0],a:x[1],clue:x[2],write:'Explain your answer using evidence.'}}if(s==='Writing'){let opts=[['Best thesis: A) Phones. B) Phones should be limited at school because they distract students.','b','A thesis makes a clear argument.'],['Which connective shows contrast: because, however, therefore?','however','Contrast means the idea changes direction.'],['What should a conclusion do?','summarise','A conclusion wraps up the main idea.'],['What supports a persuasive reason?','evidence','Evidence makes an argument stronger.']];let x=r(opts);return {s,q:x[0],a:x[1],clue:x[2],write:'Write a sentence applying this idea.'}}if(s==='Science'){let opts=[['A testable prediction is called a what?','hypothesis','A hypothesis must be testable.'],['A fair test changes how many variables?','one','Changing one variable makes the test fair.'],['Earth rotating causes what?','day and night','Rotation means spinning.'],['Solar panels change light into what energy?','electrical','Energy can change form.']];let x=r(opts);return {s,q:x[0],a:x[1],clue:x[2],write:'Write a science explanation using because.'}}let opts=[['A dove representing peace is what?','symbolism','A symbol stands for an idea.'],['Objects getting smaller in the distance show what?','perspective','Perspective creates depth.'],['Strong light beside dark creates what?','contrast','Contrast is strong difference.'],['Arrangement of visual parts is called what?','composition','Composition is how parts are placed.']];let x=r(opts);return {s,q:x[0],a:x[1],clue:x[2],write:'Write an artist statement sentence using this concept.'}}function newSet(){session=Array.from({length:25},makeQ);idx=0;showQ()}function startSession(){newSet()}function showQ(){if(idx>=session.length)return finish();current=session[idx];answered=false;main.innerHTML=`<span class=pill>${current.s}</span><span class=pill>Question ${idx+1}/${session.length}</span><div class=q>${current.q}</div><input id=ans placeholder='Type answer'><button onclick='check()'>Check</button><button class=orange onclick='clue()'>Concept clue</button><div id=fb></div>`;ans.focus()}function norm(x){return String(x).toLowerCase().replace(/[.!?\s]/g,'')}function check(){if(answered)return;answered=true;let ok=norm(ans.value)===norm(current.a);st.attempted++;if(ok){st.correct++;st.xp+=10}else st.xp+=2;st.log.push({date:new Date().toLocaleString(),subject:current.s,q:current.q,answer:current.a,user:ans.value,correct:ok});fb.className='fb '+(ok?'good':'bad');fb.innerHTML=(ok?'Correct!':'Not quite. Answer: '+current.a)+'<br>'+current.clue+'<br><p>'+current.write+'</p><button class=green onclick=next()>Next Question</button>';save()}function clue(){fb.className='fb idea';fb.textContent='Concept clue: '+current.clue}function next(){idx++;showQ()}function finish(){main.innerHTML='<h2>Session complete</h2><p>You finished '+session.length+' questions.</p><button onclick=startSession()>Start another 25</button><button class=green onclick=showLog()>View log</button>'}function showLog(){let recent=st.log.slice(-25).reverse().map(x=>`<p><b>${x.subject}</b>: ${x.q}<br>Your answer: ${x.user||'(blank)'} | Correct: ${x.answer} | ${x.correct?'✅':'❌'}</p>`).join('');main.innerHTML='<h2>Learning log</h2><p class=small>Total attempted: '+st.attempted+' | Correct: '+st.correct+' | XP: '+st.xp+'</p>'+recent}save();</script></body></html>
