<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 6 Challenge Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:Verdana,system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1d4ed8,#16a34a);color:#172554}.app{max-width:1120px;margin:auto;padding:16px}.hero,.card{background:#f8fafc;border:4px solid white;border-radius:24px;padding:18px;box-shadow:0 10px 0 #0003,0 24px 44px #0003}.hero{background:linear-gradient(135deg,#dbeafe,#fef3c7,#dcfce7);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,6vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:900;border:0;border-radius:16px;background:#2563eb;color:white;padding:16px 18px;box-shadow:0 5px 0 #1e3a8a;min-height:56px;cursor:pointer}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.purple{background:#7c3aed;box-shadow:0 5px 0 #4c1d95}.small{color:#475569;line-height:1.55}.title{font-size:1.5rem;font-weight:1000}.big{font-size:2rem;font-weight:1000}.question{background:#eff6ff;border:4px solid #93c5fd;border-radius:22px;padding:18px;margin:14px 0;font-size:1.25rem;font-weight:900}.feedback{padding:14px;border-radius:20px;margin-top:12px;font-weight:900}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.idea{background:#fff7ed;border:3px solid #fdba74}.choice{display:block;width:100%;margin:8px 0;text-align:left}.pill{display:inline-block;background:#e0f2fe;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}a{text-decoration:none}</style></head><body><main class="app"><section class="hero"><h1>🎮 Year 6 Challenge Arcade</h1><p class="small">30 fast challenges plus speed sort, boss battle, badges, daily quest and parent snapshot. Built for iPad taps.</p><div class="row"><button id="randomBtn">Random challenge</button><button id="dailyBtn" class="orange">Daily quest</button><button id="bossBtn" class="purple">Boss battle</button><button id="parentBtn" class="green">Parent snapshot</button><button id="resetBtn" class="orange">Reset</button><a href="./"><button class="green">Back to lessons</button></a></div></section><section class="grid"><div class="card"><div class="small">Arcade XP</div><div id="xp" class="big">0</div></div><div class="card"><div class="small">Streak</div><div id="streak" class="big">0</div></div><div class="card"><div class="small">Badges</div><div id="badges" class="big">0</div></div></section><section class="grid"><button class="purple" onclick="start('analysis')">Text Detective</button><button class="green" onclick="start('math')">Math Boss</button><button onclick="start('science')">Lab Logic</button><button class="orange" onclick="start('writing')">Argument Builder</button><button class="purple" onclick="start('art')">Art Critic</button><button class="green" onclick="speedSort()">Speed Sort</button></section><section id="play" class="card"><div class="title">Pick a challenge to begin.</div><p class="small">Concept clues appear when answers are wrong, so it teaches instead of just marking right/wrong.</p></section></main><script>let state=JSON.parse(localStorage.getItem('y6-arcade-v2')||'{"xp":0,"streak":0,"done":0,"badges":[]}');const bank={analysis:[['“The city was a furnace.” Which technique?','metaphor',['simile','metaphor','rhyme'],'A metaphor says one thing is another.'],['“As quiet as a shadow.” Which technique?','simile',['simile','metaphor','fact'],'A simile uses like or as.'],['Which is evidence?','The text says the road cracked.',['I feel it is hot.','The text says the road cracked.','Maybe it is summer.'],'Evidence is a specific detail from the text.'],['Tone of “the reckless driver ignored every warning”?','critical',['critical','joyful','calm'],'Tone is shown through opinion words.'],['“The stars danced above us” uses what?','personification',['personification','fraction','thesis'],'Personification gives human actions to non-human things.'],['Which word is most emotive?','devastating',['normal','devastating','plain'],'Emotive words create feeling.']],math:[['35% of 200?','70',['35','70','90'],'10% is 20, 30% is 60, 5% is 10.'],['3/4 as a decimal?','0.75',['0.25','0.5','0.75'],'Three quarters equals 75 hundredths.'],['If 5x=45, x=?','9',['8','9','10'],'Use inverse operation: divide by 5.'],['Mean of 5, 7, 12?','8',['7','8','9'],'Add then divide by how many numbers.'],['15% of 100?','15',['10','15','20'],'Percent means out of 100.'],['Area of 9 by 7 rectangle?','63',['56','63','72'],'Area is length times width.']],science:[['Best fair test rule?','change one variable',['change everything','change one variable','never measure'],'Only one variable changes.'],['A testable prediction is a...','hypothesis',['hypothesis','symbol','conclusion'],'A hypothesis can be tested.'],['Earth rotation causes...','day and night',['seasons','day and night','gravity'],'Rotation changes the side facing the Sun.'],['Energy from a battery is mostly...','electrical',['electrical','sound only','texture'],'A battery supplies electrical energy.'],['A result should be based on...','evidence',['evidence','guessing','favourite colour'],'Science uses evidence from observations or measurements.'],['The force pulling objects to Earth is...','gravity',['gravity','contrast','symbolism'],'Gravity pulls objects toward Earth.']],writing:[['Best thesis?','School uniforms should stay because they reduce morning stress.',['Uniforms.','School uniforms should stay because they reduce morning stress.','I have a shirt.'],'A thesis makes an argument and gives direction.'],['Best connective for contrast?','however',['because','however','therefore'],'Contrast means the idea changes direction.'],['Best evidence phrase?','For example, the survey showed...',['Stuff happened.','For example, the survey showed...','I reckon.'],'Evidence should be specific.'],['Conclusion should...','summarise the argument',['start a new topic','summarise the argument','add random facts'],'A conclusion wraps up.'],['Best persuasive modal verb?','must',['banana','must','quickly'],'Modal verbs like must and should show obligation.'],['Which improves cohesion?','linking ideas clearly',['random sentences','linking ideas clearly','no paragraphs'],'Cohesion means ideas flow together.']],art:[['Using a dove for peace is...','symbolism',['perspective','symbolism','texture'],'A symbol represents an idea.'],['Objects smaller in distance show...','perspective',['contrast','perspective','pattern'],'Perspective creates depth.'],['Light beside dark creates...','contrast',['contrast','rhythm','noun'],'Contrast is strong difference.'],['Arrangement of visual parts is...','composition',['composition','hypothesis','percentage'],'Composition is how parts are placed.'],['Repeated shapes create...','pattern',['pattern','gravity','evidence'],'Pattern is repeated visual elements.'],['A short explanation of artwork choices is an...','artist statement',['artist statement','denominator','hypothesis'],'An artist statement explains meaning and choices.']]};function save(){localStorage.setItem('y6-arcade-v2',JSON.stringify(state));xp.textContent=state.xp;streak.textContent=state.streak;badges.textContent=state.badges.length}function allQs(){return Object.values(bank).flat()}function start(type){let set=bank[type],q=set[Math.floor(Math.random()*set.length)];ask(label(type),q)}function ask(title,q){play.innerHTML='<div class=title>'+title+'</div><div class=question>'+q[0]+'</div><div id=choices></div><div id=fb></div>';q[2].slice().sort(()=>Math.random()-.5).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(c===q[1],q[3]);choices.appendChild(b)})}function answer(ok,tip){fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct. +10 XP':'Not quite. Concept clue: '+tip;if(ok){state.xp+=10;state.streak++;state.done++;award()}else state.streak=0;save()}function award(){if(state.streak>=5&&!state.badges.includes('Streak Analyst'))state.badges.push('Streak Analyst');if(state.done>=10&&!state.badges.includes('Quest Starter'))state.badges.push('Quest Starter');if(state.done>=30&&!state.badges.includes('Arcade Champion'))state.badges.push('Arcade Champion')}function label(t){return {analysis:'🕵️ Text Detective',math:'👾 Math Boss',science:'🧪 Lab Logic',writing:'🏗️ Argument Builder',art:'🎨 Art Critic'}[t]}function speedSort(){let terms=[['simile','English'],['variable','Maths'],['hypothesis','Science'],['composition','Art'],['thesis','Writing'],['percentage','Maths'],['evidence','English'],['symbolism','Art'],['gravity','Science'],['contrast','Art'],['modal verb','English'],['mean','Maths']];let item=terms[Math.floor(Math.random()*terms.length)];play.innerHTML='<div class=title>⚡ Speed Sort</div><div class=question>Which subject does this belong to?<br><br>'+item[0]+'</div><div id=choices></div><div id=fb></div>';['English','Maths','Science','Art','Writing'].forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(c===item[1],'Think about where you use that word most.');choices.appendChild(b)})}function dailyQuest(){let qs=[bank.analysis[0],bank.math[0],bank.science[0],bank.writing[0],bank.art[0]];play.innerHTML='<div class=title>🌞 Daily Quest</div><p class=small>Complete one from each subject, then try a boss battle.</p><div id=dailyList></div>';dailyList.innerHTML=qs.map(x=>'<span class=pill>'+x[0]+'</span>').join('')}function boss(){let q=allQs()[Math.floor(Math.random()*allQs().length)];ask('🐉 Boss Battle: mixed subject',q)}function parent(){play.innerHTML='<div class=title>👨‍👩‍👧 Parent Snapshot</div><p class=small>Questions attempted: '+state.done+'<br>Current streak: '+state.streak+'<br>XP: '+state.xp+'<br>Badges: '+(state.badges.join(', ')||'none yet')+'<br><br>Suggestion: ask her to explain one concept clue in her own words.</p>'}randomBtn.onclick=()=>{let q=allQs()[Math.floor(Math.random()*allQs().length)];ask('🎲 Random Challenge',q)};dailyBtn.onclick=dailyQuest;bossBtn.onclick=boss;parentBtn.onclick=parent;resetBtn.onclick=()=>{state={xp:0,streak:0,done:0,badges:[]};save()};save();</script></body></html>
