<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 6 Challenge Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:Verdana,system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1d4ed8,#16a34a);color:#172554}.app{max-width:1120px;margin:auto;padding:16px}.hero,.card{background:#f8fafc;border:4px solid white;border-radius:24px;padding:18px;box-shadow:0 10px 0 #0003,0 24px 44px #0003}.hero{background:linear-gradient(135deg,#dbeafe,#fef3c7,#dcfce7);position:sticky;top:0;z-index:2}h1{font-size:clamp(2rem,6vw,4rem);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:900;border:0;border-radius:16px;background:#2563eb;color:white;padding:16px 18px;box-shadow:0 5px 0 #1e3a8a;min-height:56px;cursor:pointer}button.green{background:#16a34a;box-shadow:0 5px 0 #166534}button.orange{background:#f97316;box-shadow:0 5px 0 #9a3412}button.purple{background:#7c3aed;box-shadow:0 5px 0 #4c1d95}.small{color:#475569;line-height:1.55}.title{font-size:1.5rem;font-weight:1000}.big{font-size:2rem;font-weight:1000}.question{background:#eff6ff;border:4px solid #93c5fd;border-radius:22px;padding:18px;margin:14px 0;font-size:1.18rem;font-weight:900;line-height:1.45}.feedback{padding:14px;border-radius:20px;margin-top:12px;font-weight:900}.good{background:#dcfce7;border:3px solid #22c55e}.bad{background:#fee2e2;border:3px solid #ef4444}.choice{display:block;width:100%;margin:8px 0;text-align:left}.pill{display:inline-block;background:#e0f2fe;border-radius:999px;padding:7px 11px;margin:4px;font-weight:800}input,textarea{width:100%;font:inherit;font-size:1.05rem;padding:14px;border:3px solid #93c5fd;border-radius:16px;margin:10px 0}textarea{min-height:120px}a{text-decoration:none}</style></head><body><main class="app"><section class="hero"><h1>🎮 Year 6 Challenge Arcade</h1><p class="small">Now with 60 challenges: multiple choice, fill-in-the-blank, longer explanations and scenario reasoning.</p><div class="row"><button id="allBtn">All 60 Questions</button><button id="dailyBtn" class="orange">Daily Quest</button><button id="bossBtn" class="purple">Boss Battle</button><button id="parentBtn" class="green">Parent Snapshot</button><button id="resetBtn" class="orange">Reset</button><a href="./"><button class="green">Back to Lessons</button></a></div></section><section class="grid"><div class="card"><div class="small">Arcade XP</div><div id="xp" class="big">0</div></div><div class="card"><div class="small">Streak</div><div id="streak" class="big">0</div></div><div class="card"><div class="small">Badges</div><div id="badges" class="big">0</div></div></section><section class="grid"><button class="purple" onclick="startRun('analysis')">Text Detective</button><button class="green" onclick="startRun('math')">Math Boss</button><button onclick="startRun('science')">Lab Logic</button><button class="orange" onclick="startRun('writing')">Argument Builder</button><button class="purple" onclick="startRun('art')">Art Critic</button><button class="green" onclick="startSpeedRun()">Speed Sort</button></section><section id="play" class="card"><div class="title">Pick a challenge to begin.</div><p class="small">Some questions need one-word answers. Some need a full explanation.</p></section></main><script>
let state=JSON.parse(localStorage.getItem('y6-arcade-v4')||'{"xp":0,"streak":0,"done":0,"badges":[]}');let run=[],idx=0,answered=false,runTitle='';
const bank={
analysis:[
{q:'“The city was a furnace.” Which technique?',a:'metaphor',choices:['simile','metaphor','rhyme'],tip:'A metaphor says one thing is another.'},{q:'“As quiet as a shadow.” Which technique?',a:'simile',choices:['simile','metaphor','fact'],tip:'A simile uses like or as.'},{q:'Fill in: A comparison using like or as is a ___.',a:'simile',type:'text',tip:'Look for like or as.'},{q:'Fill in: “The classroom was a zoo” is a ___ because it directly says one thing is another.',a:'metaphor',type:'text',tip:'Direct comparison without like/as.'},{q:'Which is evidence?',a:'The text says the road cracked.',choices:['I feel it is hot.','The text says the road cracked.','Maybe it is summer.'],tip:'Evidence is a specific detail.'},{q:'Tone of “the reckless driver ignored every warning”?',a:'critical',choices:['critical','joyful','calm'],tip:'Tone is shown through opinion words.'},{q:'“The stars danced above us” uses what?',a:'personification',choices:['personification','fraction','thesis'],tip:'Personification gives human actions to non-human things.'},{q:'Which word is most emotive?',a:'devastating',choices:['normal','devastating','plain'],tip:'Emotive words create feeling.'},{q:'Longer answer: Explain the difference between a simile and a metaphor using your own example.',a:'like',type:'long',tip:'A strong answer mentions like/as for simile and direct comparison for metaphor.'},{q:'Longer answer: Explain why “The text says the road cracked” is stronger evidence than “I think it was hot.”',a:'text',type:'long',tip:'Mention that one uses a specific text detail.'},{q:'Type one word that could create a frustrated tone.',a:'careless',type:'text',alts:['reckless','annoyed','furious','ignored'],tip:'Look for negative judgement words.'},{q:'Fill in: An inference is a conclusion based on ___.',a:'clues',type:'text',tip:'Inference uses clues.'}
],
math:[
{q:'35% of 200?',a:'70',choices:['35','70','90'],tip:'10% is 20, 30% is 60, 5% is 10.'},{q:'3/4 as a decimal?',a:'0.75',choices:['0.25','0.5','0.75'],tip:'Three quarters equals 75 hundredths.'},{q:'If 5x=45, x=?',a:'9',choices:['8','9','10'],tip:'Use inverse operation.'},{q:'Mean of 5, 7, 12?',a:'8',choices:['7','8','9'],tip:'Add then divide by how many numbers.'},{q:'Fill in: 15% of 100 is ___.',a:'15',type:'text',tip:'Percent means out of 100.'},{q:'Area of 9 by 7 rectangle?',a:'63',choices:['56','63','72'],tip:'Area is length times width.'},{q:'A shirt costs $80 and is 25% off. Type the discount amount.',a:'20',type:'text',tip:'25% is one quarter.'},{q:'Simplify 12/18.',a:'2/3',type:'text',tip:'Divide top and bottom by 6.'},{q:'Longer answer: Explain how to find 30% of 90 without a calculator.',a:'10',type:'long',tip:'A good answer mentions finding 10% first.'},{q:'Longer answer: A rectangle is 12 cm by 5 cm. Explain how to find its area and include units.',a:'60',type:'long',tip:'A good answer mentions 12 × 5 and square centimetres.'},{q:'Fill in: A variable is a symbol for an ___ value.',a:'unknown',type:'text',tip:'In algebra, a variable can represent an unknown.'},{q:'If 3x + 2 = 14, x = ?',a:'4',type:'text',tip:'Subtract 2, then divide by 3.'}
],
science:[
{q:'Best fair test rule?',a:'change one variable',choices:['change everything','change one variable','never measure'],tip:'Only one variable changes.'},{q:'A testable prediction is a...',a:'hypothesis',choices:['hypothesis','symbol','conclusion'],tip:'A hypothesis can be tested.'},{q:'Earth rotation causes...',a:'day and night',choices:['seasons','day and night','gravity'],tip:'Rotation changes the side facing the Sun.'},{q:'Energy from a battery is mostly...',a:'electrical',choices:['electrical','sound only','texture'],tip:'A battery supplies electrical energy.'},{q:'Fill in: A result should be based on ___.',a:'evidence',type:'text',tip:'Science uses evidence.'},{q:'The force pulling objects to Earth is...',a:'gravity',choices:['gravity','contrast','symbolism'],tip:'Gravity pulls objects toward Earth.'},{q:'Fill in: In a fair test, the thing you change is called a ___.',a:'variable',type:'text',tip:'A variable is something that can change.'},{q:'Type the state of matter that keeps its shape.',a:'solid',type:'text',tip:'Solids keep their shape.'},{q:'Longer answer: Why is it important to change only one variable in a fair test?',a:'because',type:'long',tip:'A good answer explains cause and effect.'},{q:'Longer answer: Explain how Earth’s rotation causes day and night.',a:'sun',type:'long',tip:'Mention the side of Earth facing the Sun.'},{q:'Fill in: Solar panels change light energy into ___ energy.',a:'electrical',type:'text',tip:'Solar panels produce electricity.'},{q:'Type one example of scientific evidence in a plant growth experiment.',a:'height',type:'text',alts:['measurement','results','colour','number of leaves','leaves'],tip:'Measurements and observations are evidence.'}
],
writing:[
{q:'Best thesis?',a:'School uniforms should stay because they reduce morning stress.',choices:['Uniforms.','School uniforms should stay because they reduce morning stress.','I have a shirt.'],tip:'A thesis makes an argument and gives direction.'},{q:'Best connective for contrast?',a:'however',choices:['because','however','therefore'],tip:'Contrast means the idea changes direction.'},{q:'Best evidence phrase?',a:'For example, the survey showed...',choices:['Stuff happened.','For example, the survey showed...','I reckon.'],tip:'Evidence should be specific.'},{q:'Conclusion should...',a:'summarise the argument',choices:['start a new topic','summarise the argument','add random facts'],tip:'A conclusion wraps up.'},{q:'Fill in: A thesis is the main ___.',a:'argument',type:'text',tip:'A thesis tells your main argument.'},{q:'Fill in: Cohesion means ideas link ___.',a:'smoothly',type:'text',tip:'Cohesion helps writing flow.'},{q:'Longer answer: Write a thesis arguing that students should or should not have homework.',a:'should',type:'long',tip:'A thesis should include a clear opinion and reason.'},{q:'Longer answer: Write two sentences using “however” correctly.',a:'however',type:'long',tip:'Use however to show contrast.'},{q:'Type a modal verb that shows strong obligation.',a:'must',type:'text',alts:['should'],tip:'Must and should are modal verbs.'},{q:'Which sentence is more precise?',a:'The eagle soared above the cliffs.',choices:['The bird went up.','The eagle soared above the cliffs.','It was nice.'],tip:'Precise nouns and verbs improve writing.'},{q:'Longer answer: Give one reason and one example for the argument “school sport is important.”',a:'because',type:'long',tip:'Use because or for example.'},{q:'Fill in: A paragraph should focus on one main ___.',a:'idea',type:'text',tip:'One paragraph, one main idea.'}
],
art:[
{q:'Using a dove for peace is...',a:'symbolism',choices:['perspective','symbolism','texture'],tip:'A symbol represents an idea.'},{q:'Objects smaller in distance show...',a:'perspective',choices:['contrast','perspective','pattern'],tip:'Perspective creates depth.'},{q:'Light beside dark creates...',a:'contrast',choices:['contrast','rhythm','noun'],tip:'Contrast is strong difference.'},{q:'Arrangement of visual parts is...',a:'composition',choices:['composition','hypothesis','percentage'],tip:'Composition is how parts are placed.'},{q:'Fill in: Repeated shapes create a ___.',a:'pattern',type:'text',tip:'Pattern repeats visual elements.'},{q:'A short explanation of artwork choices is an...',a:'artist statement',choices:['artist statement','denominator','hypothesis'],tip:'An artist statement explains meaning and choices.'},{q:'Type one warm colour.',a:'red',type:'text',alts:['orange','yellow'],tip:'Warm colours include red, orange and yellow.'},{q:'Type one cool colour.',a:'blue',type:'text',alts:['green','purple'],tip:'Cool colours include blue, green and purple.'},{q:'Longer answer: Explain how contrast could make a poster more eye-catching.',a:'contrast',type:'long',tip:'Mention strong difference, light/dark or colours standing out.'},{q:'Longer answer: Choose a symbol for courage and explain why it works.',a:'because',type:'long',tip:'Explain what the symbol represents.'},{q:'Fill in: Perspective helps an artwork look like it has ___.',a:'depth',type:'text',tip:'Depth means near and far space.'},{q:'Longer answer: Write a short artist statement for an artwork about storms.',a:'storm',type:'long',tip:'Mention what you made, why, and how.'}
]};
const speedTerms=[['simile','English'],['variable','Maths'],['hypothesis','Science'],['composition','Art'],['thesis','Writing'],['percentage','Maths'],['evidence','English'],['symbolism','Art'],['gravity','Science'],['contrast','Art'],['modal verb','English'],['mean','Maths'],['cohesion','Writing'],['perspective','Art'],['metaphor','English']];
function save(){localStorage.setItem('y6-arcade-v4',JSON.stringify(state));xp.textContent=state.xp;streak.textContent=state.streak;badges.textContent=state.badges.length}function allQs(){return Object.values(bank).flat()}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function startRun(type){runTitle=label(type);run=shuffle(bank[type]);idx=0;showCurrent()}function startAll(){runTitle='🌟 All 60 Questions';run=shuffle(allQs());idx=0;showCurrent()}function startSpeedRun(){runTitle='⚡ Speed Sort';run=shuffle(speedTerms.map(t=>({q:'Which subject does this belong to?<br><br>'+t[0],a:t[1],choices:['English','Maths','Science','Art','Writing'],tip:'Think about where you use that word most.'})));idx=0;showCurrent()}function showCurrent(){answered=false;if(idx>=run.length)return finishRun();let q=run[idx];play.innerHTML='<div class=title>'+runTitle+'</div><span class=pill>Question '+(idx+1)+' / '+run.length+'</span><div class=question>'+q.q+'</div><div id=answerArea></div><div id=fb></div>';if(q.type==='text'){answerArea.innerHTML='<input id=typed placeholder="Type your answer"><button class="green" onclick="checkTyped()">Check Answer</button>';typed.focus()}else if(q.type==='long'){answerArea.innerHTML='<textarea id=typed placeholder="Write a longer answer or explanation"></textarea><button class="green" onclick="checkTyped()">Check Answer</button>'}else{shuffle(q.choices).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(matches(c,q),q.tip);answerArea.appendChild(b)})}}function matches(v,q){let x=String(v).toLowerCase().trim(),a=String(q.a).toLowerCase().trim();if(x===a)return true;if(q.alts&&q.alts.map(z=>z.toLowerCase()).includes(x))return true;if(q.type==='long')return x.length>25&&(a===' '||x.includes(a));return false}function checkTyped(){let q=run[idx];answer(matches(typed.value,q),q.tip)}function answer(ok,tip){if(answered)return;answered=true;fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=(ok?'Correct. +10 XP':'Not quite. Concept clue: '+tip)+'<br><button class="green" onclick="nextQuestion()">Next Question</button>';if(ok){state.xp+=10;state.streak++;state.done++;award()}else state.streak=0;save()}function nextQuestion(){idx++;showCurrent()}function finishRun(){play.innerHTML='<div class=title>🏁 Challenge complete!</div><p class=small>You finished '+run.length+' questions. XP: '+state.xp+'. Streak: '+state.streak+'.</p><button onclick="startAll()">Play all 60 again</button>'}function award(){if(state.streak>=5&&!state.badges.includes('Streak Analyst'))state.badges.push('Streak Analyst');if(state.done>=20&&!state.badges.includes('Quest Builder'))state.badges.push('Quest Builder');if(state.done>=60&&!state.badges.includes('Arcade Champion'))state.badges.push('Arcade Champion')}function label(t){return {analysis:'🕵️ Text Detective',math:'👾 Math Boss',science:'🧪 Lab Logic',writing:'🏗️ Argument Builder',art:'🎨 Art Critic'}[t]}function dailyQuest(){runTitle='🌞 Daily Quest';run=[bank.analysis[0],bank.math[0],bank.science[0],bank.writing[0],bank.art[0]];idx=0;showCurrent()}function boss(){runTitle='🐉 Boss Battle';run=shuffle(allQs()).slice(0,15);idx=0;showCurrent()}function parent(){play.innerHTML='<div class=title>👨‍👩‍👧 Parent Snapshot</div><p class=small>Questions attempted: '+state.done+'<br>Current streak: '+state.streak+'<br>XP: '+state.xp+'<br>Badges: '+(state.badges.join(', ')||'none yet')+'<br><br>Suggestion: ask her to explain one longer response out loud.</p>'}allBtn.onclick=startAll;dailyBtn.onclick=dailyQuest;bossBtn.onclick=boss;parentBtn.onclick=parent;resetBtn.onclick=()=>{state={xp:0,streak:0,done:0,badges:[]};save()};save();</script></body></html>
