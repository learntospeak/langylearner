<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader -  tutor.Value.ToUpper() utor</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
</head>
<body class="anime-bg min-h-screen p-5">
  <main class="max-w-3xl mx-auto">
    <header class="flex items-center justify-between mb-4">
      <h1 class="site-title text-2xl font-bold accent-underline">Tutor</h1>
      <div id="lock" class="text-sm text-amber-700 hidden">Locked â€“ Buy the Tutor in the Shop</div>
    </header>
    <section class="manga-bubble p-4">
      <div id="chatBox" class="space-y-3 max-h-[60vh] overflow-auto mb-3"></div>
      <form id="chatForm" class="flex items-center gap-2">
        <input id="chatInput" class="field flex-1" placeholder="è©±ã—ã¾ã—ã‚‡ã†â€¦" />
        <button class="btn btn-primary">Send</button>
      </form>
      <div class="text-xs text-gray-500 mt-2">Tip: Keep messages short and practice polite Japanese.</div>
    </section>
    <div class="mt-4 flex items-center gap-2">
      <a href="index.html" class="btn btn-ghost">Home</a>
      <a href="shop.html" class="btn btn-ghost">Shop</a>
    </div>
  </main>
  <script>
    const $ = s => document.querySelector(s);
    async function getWallet(){ try { const r=await fetch('/api/wallet'); return await r.json(); } catch { return null; }}
    async function chat(messages){
      const body = { messages, level: 'A1', persona: 'tutor' };
      const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      return await r.json();
    }
    function addMsg(role, text){
      const div = document.createElement('div');
      div.className = role==='user' ? 'text-right' : 'text-left';
      div.innerHTML = `<div class="inline-block manga-bubble p-2 text-sm">${text.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`;
      $('#chatBox').appendChild(div);
      $('#chatBox').scrollTop = 1e9;
    }
    (async () => {
      const w = await getWallet();
      const owned = (w && w.owned) || {};
      if (!owned['upgrade-tutor-basic']) {
        $('#lock').classList.remove('hidden');
        $('#chatForm').classList.add('hidden');
        addMsg('system', 'Tutor is locked. Buy it in the Shop.');
        return;
      }
      addMsg('assistant', 'ã“ã‚“ã«ã¡ã¯ï¼æ—¥æœ¬èªžã§ãŠè©±ã—ã¾ã—ã‚‡ã†ã€‚');
      const msgs = [{ role: 'system', content: 'You are a friendly Japanese tutor.' }];
      $('#chatForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const t = $('#chatInput').value.trim(); if(!t) return;
        $('#chatInput').value='';
        msgs.push({ role:'user', content: t });
        addMsg('user', t);
        const res = await chat(msgs);
        const reply = (res && res.reply) || 'â€¦';
        msgs.push({ role:'assistant', content: reply });
        addMsg('assistant', reply);
      });
    })();
  </script>
</body>
</html>
