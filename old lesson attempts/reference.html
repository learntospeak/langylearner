<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Japanese Kana Reference</title>
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css"
    rel="stylesheet"
  />
  <style>
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    th { background: #f7f7f7; }
    textarea { width: 100%; height: 4rem; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; background: #2563eb; color: #fff; border: none; border-radius: 0.25rem; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 p-4">

  <header class="mb-6">
    <h1 class="text-3xl font-bold">📖 Japanese Kana Reference</h1>
    <p><a href="index.html" class="text-blue-600 hover:underline">← Back to Lessons</a></p>
  </header>

  <section>
    <h2 class="text-2xl font-semibold mb-2">Hiragana</h2>
    <table>
      <thead>
        <tr>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
        </tr>
      </thead>
      <tbody id="hiragana-body"></tbody>
    </table>
  </section>

  <section>
    <h2 class="text-2xl font-semibold mb-2">Katakana</h2>
    <table>
      <thead>
        <tr>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
          <th>Kana</th><th>Romaji</th>
        </tr>
      </thead>
      <tbody id="katakana-body"></tbody>
    </table>
  </section>

  <section class="mt-8">
    <h2 class="text-2xl font-semibold mb-2">🔄 Quick Translator</h2>
    <textarea id="translator-input" placeholder="Type English or Japanese…"></textarea><br>
    <button id="translator-btn">Translate</button>
    <p id="translator-result" class="mt-4 font-medium"></p>
  </section>

  <script>
    // Data arrays
    const HIRAGANA = [
      ['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],
      ['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],
      ['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so'],
      ['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],
      ['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],
      ['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],
      ['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo'],
      ['や','ya'],['ゆ','yu'],['よ','yo'],
      ['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],
      ['わ','wa'],['を','wo'],['ん','n'],
    ];
    const KATAKANA = [
      ['ア','a'],['イ','i'],['ウ','u'],['エ','e'],['オ','o'],
      ['カ','ka'],['キ','ki'],['ク','ku'],['ケ','ke'],['コ','ko'],
      ['サ','sa'],['シ','shi'],['ス','su'],['セ','se'],['ソ','so'],
      ['タ','ta'],['チ','chi'],['ツ','tsu'],['テ','te'],['ト','to'],
      ['ナ','na'],['ニ','ni'],['ヌ','nu'],['ネ','ne'],['ノ','no'],
      ['ハ','ha'],['ヒ','hi'],['フ','fu'],['ヘ','he'],['ホ','ho'],
      ['マ','ma'],['ミ','mi'],['ム','mu'],['メ','me'],['モ','mo'],
      ['ヤ','ya'],['ユ','yu'],['ヨ','yo'],
      ['ラ','ra'],['リ','ri'],['ル','ru'],['レ','re'],['ロ','ro'],
      ['ワ','wa'],['ヲ','wo'],['ン','n'],
    ];

    // fill tables
    function populateTable(data, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      for (let i = 0; i < data.length; i += 5) {
        const row = document.createElement('tr');
        for (let j = 0; j < 5; j++) {
          const cell = data[i + j];
          if (cell) {
            const [kana, roma] = cell;
            row.innerHTML += `<td>${kana}</td><td>${roma}</td>`;
          } else {
            row.innerHTML += `<td></td><td></td>`;
          }
        }
        tbody.appendChild(row);
      }
    }

    // translator
    async function translateText() {
      const inp = document.getElementById('translator-input').value.trim();
      if (!inp) return;
      const btn = document.getElementById('translator-btn');
      btn.disabled = true; btn.textContent = 'Translating…';
      let out = '';
      try {
        const res = await fetch('http://localhost:4000/gpt-convert', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ text: inp })
        });
        const data = await res.json();
        out = data.translation || 'No result';
      } catch {
        out = 'Error translating.';
      }
      document.getElementById('translator-result').textContent = out;
      btn.disabled = false; btn.textContent = 'Translate';
    }

    window.addEventListener('DOMContentLoaded', () => {
      populateTable(HIRAGANA, 'hiragana-body');
      populateTable(KATAKANA, 'katakana-body');
      document.getElementById('translator-btn')
              .addEventListener('click', translateText);
    });

    window.addEventListener('DOMContentLoaded', () => {
      populateTable(HIRAGANA, 'hiragana-body');
      populateTable(KATAKANA, 'katakana-body');
      document.getElementById('translator-btn')
              .addEventListener('click', translateText);

      // ── NEW: click‑to‑speak for each kana cell ──
      ['hiragana-body','katakana-body'].forEach(tbodyId => {
        // select odd <td> in each row (the kana, not the romaji)
        document
          .querySelectorAll(`#${tbodyId} td:nth-child(odd)`)
          .forEach(cell => {
            cell.style.cursor = 'pointer';
            cell.title = 'Click to hear pronunciation';
            cell.addEventListener('click', () => {
              const utter = new SpeechSynthesisUtterance(cell.textContent);
              utter.lang = 'ja-JP';
              speechSynthesis.speak(utter);
            });
          });
      });
    });
  </script>
</body>
</html>
