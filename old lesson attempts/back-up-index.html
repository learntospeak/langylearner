    <h1>KanaReader</h1>

    <!--<button id="newStoryBtn">➕ New Story</button>-->
    <button id="openConverterBtn">🌐 Open Language Converter</button>
    <div id="storyEditor" class="hidden">
      <h3>Create a New Story</h3>
      <input type="text" id="newStoryTitle" placeholder="Story Title"><br>
      <div id="linesContainer"></div>
      <button id="addLineBtn">➕ Add Line</button>
      <button id="saveStoryBtn">💾 Save</button>
      <button id="cancelStoryBtn">✖ Cancel</button>

      <label><input type="checkbox" id="wanakanaToggle" checked> Auto Kana</label>
      <label><input type="checkbox" id="autoPronounceToggle" checked> 🔊 Auto Pronounce</label>
      <button id="revertStoryBtn" class="hidden">↩️ Revert Changes</button>
    </div>



    <div id="converter-box" class="hidden">
      <h3>🧠 Language Converter</h3>
      <textarea id="converterInput" rows="3" placeholder="Type a sentence..."></textarea><br>
      <button id="convertBtn">Convert</button>
      <div id="gpt-loader" class="spinner hidden"></div>
      <div id="converter-loader" class="spinner hidden"></div>
      <button id="closeConverterBtn">❌ Close Converter</button>
      <div id="converterOutput" class="hidden">
        <p><strong>JP:</strong> <span id="out-translation"></span></p>
        <p><strong>Romaji:</strong> <span id="out-romaji"></span></p>
        <p><strong>Hiragana:</strong> <span id="out-hiragana"></span></p>
        <p><strong>Katakana:</strong> <span id="out-katakana"></span></p>
        <p><strong>Explanation:</strong> <span id="out-explanation"></span></p>
        <p><strong>Translation (JP):</strong> <span id="out-translation"></span></p>
        <!-- <button id="speakTranslationBtn">🔊 Pronounce</button> -->
        <button id="converterPronounceBtn">🔊 Pronounce</button>
      </div>
    </div>

    <select id="storySelector">
      <option disabled selected>Select a Story</option>
    </select>
