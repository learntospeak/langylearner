            <script>
              (function(){

                async function renderLessonAvatar(){
                  const token = Date.now() + Math.random();
                  try { window.__lessonAvatarToken = token; } catch (e) {}
                  try { if (window.__lessonAvatarRaf) cancelAnimationFrame(window.__lessonAvatarRaf); } catch (e) {}
                  try {

                  // Wait for module scripts to define THREE + GLTFLoader

                  await waitReady();

                  if (!THREE || !GLTFLoader) { console.warn('[lesson-lv] missing THREE/GLTFLoader'); return; }
                  console.log('[lesson-lv] ready');
                  const w = wrap.clientWidth||230, h = wrap.clientHeight||320;
                  const scene = new THREE.Scene(); try { window.__LessonScene = scene; } catch(e){}
                  const camera = new THREE.PerspectiveCamera(25, w/h, 0.01, 100);
                  // Flat lighting: ambient-only for manga-style look
                  const amb = new THREE.AmbientLight(0xffffff, 1.0); scene.add(amb);
                  try { const dir = new (window.__THREE||window.THREE).DirectionalLight(0xffffff, 0.6); dir.position.set(1,1,1); scene.add(dir); } catch (e) {}
                  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
                  renderer.setSize(w, h, false); renderer.setPixelRatio(1);
                  const clock = new THREE.Clock();
                  let mixer = null;

                  let __poseSeqToken = 0;
                  wrap.innerHTML=''; wrap.appendChild(renderer.domElement);
                  let controls=null; try { if (window.__OrbitControls) { controls = new window.__OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.enableRotate = false; controls.enableZoom = false; controls.enablePan = false; controls.enabled = false; controls.target.set(0,0.02,0); } } catch (e) {}

                  window.__lessonAvatarRaf = requestAnimationFrame(tick);
                  const loader = new GLTFLoader();
                  function getSavedEyeHex(){ try { const v=String(localStorage.getItem('eyeColorHex')||'').trim(); return /^#?[0-9a-fA-F]{6}$/.test(v)?(v.startsWith('#')?v:'#'+v):null; } catch (e) { return null; } }
                  function getSavedHatHex(){ try { const v=String(localStorage.getItem('hatColorHex')||'').trim(); return /^#?[0-9a-fA-F]{6}$/.test(v)?(v.startsWith('#')?v:'#'+v):null; } catch (e) { return null; } }
                  function getSavedBootHex(){ try { const v=String(localStorage.getItem('bootColorHex')||'').trim(); return /^#?[0-9a-fA-F]{6}$/.test(v)?(v.startsWith('#')?v:'#'+v):null; } catch (e) { return null; } }

                  function applyHatTint(root){
                    try {
                      var hex = getSavedHatHex();
                      if (!hex || !root) return false;
                      var changed=false;
                      var traverse = (root.traverse) ? function(fn){ root.traverse(fn); } : function(fn){ function walk(o){ try{ fn(o); (o.children||[]).forEach(walk); }catch(e){} } walk(root); };
                      traverse(function(o){
                        try {
                          if (!o || !o.isMesh) return;
                          var arr = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
                          var on = String((o && o.name) || '').toLowerCase();

                            } catch(e){}
                          }

<script>
  (function mascotDragAndToggle(){
    const KEY_HIDE = 'lessonMascotHidden';
    const KEY_POS = 'lessonMascotPos';
    const mascot = document.getElementById('mascot');
    const btn = document.getElementById('lsToggleMascot');
    if (!mascot) return;

    const setHidden = (hidden) => {
      mascot.style.display = hidden ? 'none' : '';
      try { localStorage.setItem(KEY_HIDE, hidden ? '1' : '0'); } catch (e) {}
      if (btn) btn.textContent = hidden ? 'Show Mascot' : 'Hide Mascot';
    };

    const applyPos = (pos) => {
      if (!pos) return;
      mascot.style.position = 'fixed';
      mascot.style.left = `${pos.x}px`;
      mascot.style.top = `${pos.y}px`;
      mascot.style.right = 'auto';
      mascot.style.bottom = 'auto';
      mascot.dataset.drag = '1';
    };

    const loadPrefs = () => {
      const hidden = (() => { try { return localStorage.getItem(KEY_HIDE) === '1'; } catch (e) { return false; } })();
      setHidden(hidden);
      const pos = (() => {
        try { return JSON.parse(localStorage.getItem(KEY_POS) || 'null'); } catch (e) { return null; }
      })();
      if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') applyPos(pos);
    };

    loadPrefs();

    if (btn) {
      btn.addEventListener('click', () => {
        const hidden = mascot.style.display === 'none';
        setHidden(!hidden);
      });
    }

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    const onPointerDown = (e) => {
      if (mascot.style.display === 'none') return;
      dragging = true;
      const rect = mascot.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      mascot.dataset.drag = '1';
      mascot.style.touchAction = 'none';
      mascot.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    };
    const onPointerMove = (e) => {
      if (!dragging) return;
      const maxX = window.innerWidth - mascot.offsetWidth;
      const maxY = window.innerHeight - mascot.offsetHeight;
      const x = clamp(e.clientX - offsetX, 0, Math.max(0, maxX));
      const y = clamp(e.clientY - offsetY, 0, Math.max(0, maxY));
      mascot.style.position = 'fixed';
      mascot.style.left = `${x}px`;
      mascot.style.top = `${y}px`;
      mascot.style.right = 'auto';
      mascot.style.bottom = 'auto';
    };
    const onPointerUp = (e) => {
      if (!dragging) return;
      dragging = false;
      mascot.style.touchAction = '';
      mascot.releasePointerCapture?.(e.pointerId);
      const x = parseFloat(mascot.style.left || '0') || 0;
      const y = parseFloat(mascot.style.top || '0') || 0;
      try { localStorage.setItem(KEY_POS, JSON.stringify({ x, y })); } catch (err) {}
    };

    mascot.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('resize', () => {
      if (mascot.dataset.drag !== '1') return;
      const rect = mascot.getBoundingClientRect();
      const x = clamp(rect.left, 0, Math.max(0, window.innerWidth - mascot.offsetWidth));
      const y = clamp(rect.top, 0, Math.max(0, window.innerHeight - mascot.offsetHeight));
      mascot.style.left = `${x}px`;
      mascot.style.top = `${y}px`;
      try { localStorage.setItem(KEY_POS, JSON.stringify({ x, y })); } catch (err) {}
    });
  })();
</script>

    let timer = null;

    try {

<script>
  // Fallback kana picker (ensures it appears even if cached shim is stale).
  (function fallbackKanaPicker(){
    const SMALL = "ゃゅょぁぃぅぇぉャュョァィゥェォっッー";
    const toHira = (s) => (window.wanakana ? wanakana.toHiragana(s || "") : (s || ""));
    const toKata = (s) => (window.wanakana ? wanakana.toKatakana(s || "") : (s || ""));
    const splitMora = (s = "") => {
      const a = [...s];
      const out = [];
      for (let i = 0; i < a.length; i++) {
        const c = a[i], n = a[i + 1];
        if (n && SMALL.includes(n)) { out.push(c + n); i++; continue; }
        out.push(c);
      }
      return out;
    };
    const buildPicker = (inp, expectedJP) => {
      if (!inp || inp.dataset.kanaPicker) return;
      const host = inp.closest('.lesson-item') || inp.parentElement;
      if (!host) return;
      if (host.querySelector('.kana-picker')) return;
      const exp = expectedJP || inp.dataset.expected || inp.dataset.answer || "";
      if (!exp) return;
      const hira = toHira(exp);
      const useKata = /[\p{sc=Katakana}ー]/u.test(exp);
      const moras = splitMora(hira).map(m => useKata ? toKata(m) : m);
      const picker = document.createElement('div');
      picker.className = 'kana-picker';
      picker.innerHTML = `
        ${moras.map(m => `<button type="button" class="kana-btn" data-kana="${m}">${m}</button>`).join('')}
        <button type="button" class="kana-btn kana-action" data-action="back">⌫</button>
        <button type="button" class="kana-btn kana-action" data-action="clear">Clear</button>
      `;
      picker.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'back') {
          const cur = toHira(inp.value || '');
          const moras = splitMora(cur);
          moras.pop();
          inp.value = moras.join('');
        } else if (action === 'clear') {
          inp.value = '';
        } else {
          const kana = btn.dataset.kana || btn.textContent || '';
          const cur = toHira(inp.value || '');
          inp.value = cur + (useKata ? toKata(kana) : kana);
        }
        try { inp.focus(); } catch {}
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      });
      host.appendChild(picker);
      inp.dataset.kanaPicker = "1";
    };

    const scan = () => {
      try {
        if (document.body?.dataset?.lessonStep !== 'translate_to_jp') return;
      } catch {}
      document.querySelectorAll('#jp-text input:not(.mora)').forEach(inp => buildPicker(inp, inp.dataset.expectedKana || inp.dataset.expected || inp.dataset.answer || ''));
    };
    scan();
    document.addEventListener('lesson:rendered', scan);
    const mo = new MutationObserver(() => scan());
    mo.observe(document.getElementById('jp-text') || document.body, { childList: true, subtree: true });
  })();
</script>

  <script type="module">
  import { initNinjaSlice } from './modules/ninjaSlice.js?v=9';
  const by = (sel, root=document) => root.querySelector(sel);

  const btnOpen = by('#openSlice');
  const btnOpenFooter = by('#openSliceFooter');
  const btnClose = by('#slice-close');
  const btnGear = by('#slice-gear');
  const menu = by('#slice-menu');

  // Ensure intro instructions reflect current visuals (sumo bombs)
  try {
    const help = by('#slice-instructions');
    if (help) help.textContent = 'Slice kana. Sumo tiles are bombs - avoid them. Swipe for combos.';
  } catch (e) {}
  function currentPhraseFromPage(){
    try {
      const cached = window.__kanaSliceSource;
      if (cached && cached.phrase) {
        const phrase = (cached.phrase || '').trim();
        const english = (cached.english || '').trim() || 'Hello';
        const romajiCached = (cached.romaji || '').trim();
        const romaji = romajiCached || ((window.wanakana && phrase) ? wanakana.toRomaji(phrase) : 'konnichiwa');
        const stages = Array.isArray(cached.stages) ? cached.stages : [];
        if (phrase) {
          return { phrase, romaji, english, stages };
          }
      }
    } catch (e) {}
    try {
      const list = document.querySelector('#jp-text');
      const jpEl = list?.querySelector('.jp');
      const enEl = list?.querySelector('.en');
      const phrase = (jpEl?.textContent || '').trim() || '\\u3053\\u3093\\u306B\\u3061\\u306F';
      const english = (enEl?.textContent || '').trim() || 'Hello';
      const romaji = (window.wanakana && phrase) ? wanakana.toRomaji(phrase) : 'konnichiwa';
      return { phrase, romaji, english, stages: [] };
    } catch (e) {
      return { phrase:'?????', romaji:'konnichiwa', english:'Hello' , stages: [] };
    }
  }
  function launchSlice(){
    const data = currentPhraseFromPage();
    const phrase = (data?.phrase || '').trim();
    if (!phrase) { alert('Pick a phrase first, then try Slice.'); return; }
    const romaji = data?.romaji || ((window.wanakana && phrase) ? wanakana.toRomaji(phrase) : '') || 'konnichiwa';
    const english = data?.english || '';
    initNinjaSlice({
      containerId: 'slice-wrap',
      canvasId: 'slice-canvas',
      closeBtnId: 'slice-close',
      overlayId: 'slice-overlay',
      scoreElId: 'slice-score',
      timerElId: 'slice-timer',
      kanaContainerId: 'slice-kana',
      romajiContainerId: 'slice-romaji',
      englishContainerId: 'slice-en',
      gameOverId: 'slice-gameover',
      tryBtnId: 'slice-try',
      finishBtnId: 'slice-finish',
      bubblesToggleId: 'slice-bubbles',
      progressElId: 'slice-progress',
      progressBarId: 'slice-progressbar',
      statsElId: 'slice-over-stats',
      phrases: Array.isArray(data?.stages) ? data.stages : [],
      phrase, romaji, english,
      heightRatio: 0.55,
      // Faster spawn for higher challenge
      spawnMsStart: 650,
      spawnMsEnd: 280,
      roundSeconds: 45,
      bombChance: 0.08,
      launchBoost: 1.8,
      gravity: 0.015,
      // Visual: spin bubbles but keep kana upright
      bubbleSpinStyle: 'upright', // 'upright' | 'flip' | 'none'
      bubbleSpinSpeed: 1.0,
      // Quiz mode disabled (scrapped)
      quizMode: false,
      quizShowPrompt: true,
      quizChoices: 4,
      memoryCue: true,
      sequenceMode: true,
      // Distractors (noise) in normal play
      noiseSpawnChance: 0.18,
      noisePenalty: 50,
      // Free-for-All coin bonus
      freeForAllEnabled: true,
      ffaSeconds: 5,
      ffaSpawnRateBoost: 2.0,
      ffaBombs: false,
      coinPerKana: 1,
      // Coin face styling in FFA
      coinFaceStyle: 'embossed',
      // Normal kana face styling
      bubbleFaceStyle: 'embossed',
      // Slice showcase (zoom/coin/speak)
      sliceShowcaseEnabled: true,
      // Stage banner: cascading reveal of phrase/romaji
      stageCascadeRevealEnabled: true,
      stageCascadeStepMs: 60,
      // New behavior toggles
      timerPerStage: true,
      bombEndsRound: false,
      // Fever tuning (can be adjusted later)
      feverEnabled: true,
      feverDurationMs: 7000,
      feverMultiplier: 2.0,
      feverDecayPerSec: 0.09,
      feverChargeSlice: 0.22,
      feverSeqChargeBoost: 1.8,
    });
  }
  btnOpen?.addEventListener('click', launchSlice);
  btnOpenFooter?.addEventListener('click', launchSlice);
  btnClose?.addEventListener('click', () => overlay.classList.add('hidden'));
  // Settings dropdown toggle
  function closeMenu(){ try{ menu?.classList.add('hidden'); btnGear?.setAttribute('aria-expanded','false'); } catch (e) {} }
  function openMenu(){ try{ menu?.classList.remove('hidden'); btnGear?.setAttribute('aria-expanded','true'); } catch (e) {} }
  btnGear?.addEventListener('click', (e)=>{ e.stopPropagation(); if (!menu) return; if (menu.classList.contains('hidden')) openMenu(); else closeMenu(); });
  btnMenuClose?.addEventListener('click', (e)=>{ e.stopPropagation(); closeMenu(); });
  // Dismiss on outside click or Esc
  overlay?.addEventListener('click', (e)=>{ if (!menu) return; if (e.target === overlay) closeMenu(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeMenu(); });
</script>

                    try { (function(){ var hex=String(localStorage.getItem('bootColorHex')||'').trim(); if(/^#?[0-9a-fA-F]{6}$/.test(hex)){ if(hex[0]!=='#') hex='#'+hex; base.traverse?.(function(o){ try { if(!o||!o.isMesh) return; var arr=Array.isArray(o.material)?o.material:(o.material?[o.material]:[]); var on=String(o.name||'').toLowerCase(); for(var i=0;i<arr.length;i++){ var m=arr[i]; var nm=String((m&&m.name)||'').toLowerCase(); if(/\bboot_tint\b/.test(nm) || /\bboot_tint\b/.test(on)){ try{ m.color&&m.color.set&&m.color.set(hex);}catch{} try{ if(m.needsUpdate!==undefined) m.needsUpdate=true; }catch{} } } } catch {} }); } })(); } catch (e) {}
                    try {
                      const box = new THREE.Box3().setFromObject(base); const c = box.getCenter(new THREE.Vector3()); base.position.sub(c); const size=new THREE.Vector3(); box.getSize(size);
                      const vFov=(camera.fov*Math.PI)/180; const hFov=2*Math.atan(Math.tan(vFov/2)*(camera.aspect||1));
                      const distV=(size.y*0.5)/Math.tan(vFov/2); const distH=(size.x*0.5)/Math.tan(hFov/2); const baseDist=Math.max(distV,distH);
                      const VIEW_SCALE = 1.87; const dist=baseDist*VIEW_SCALE;
                      camera.near=Math.max(0.01,dist*0.05); camera.far=Math.max(camera.near+1,dist*20); camera.updateProjectionMatrix();
                      camera.position.set(0,size.y*0.08,dist);
                      if (controls) { const TARGET_Y=0.48; const TARGET_OFFSET=-0.5; controls.target.set(0, size.y*(TARGET_Y + TARGET_OFFSET), 0); controls.update(); }
                    } catch (e) {}
                    // Attach items
                    const anchors = window.SLOT_ANCHORS || {};
                    async function addOne(slot, id){
                      const it2 = items.find(x=>x.id===id); if(!it2||!it2.model) return;
                      const gltf2 = await new Promise(res=>{ try{ loader.load(it2.model,g=>res(g),undefined,()=>res(null)); }catch (e) { res(null);} });
                      if(!gltf2||!gltf2.scene) return;
                      const obj = gltf2.scene.clone(true);
                      try{ const b=new THREE.Box3().setFromObject(obj); const c=b.getCenter(new THREE.Vector3()); obj.position.sub(c);}catch (e) {}
                      const wrapG=new THREE.Group(); try{ wrapG.userData=wrapG.userData||{}; wrapG.userData.__slot=slot; wrapG.userData.__itemId=id; }catch(e){} wrapG.add(obj);
                      const ov = (function(){ try { return JSON.parse(localStorage.getItem('anchorOverrides')||'{}')||{}; } catch (e) { return {}; } })();
                      const key = (slot==='bagx') ? 'bag' : slot;
                      let a = ov[id] || ov[key] || anchors[key] || anchors.misc || { position:[0,0.05,0], rotation:[0,0,0], scale:[1,1,1] };
                      try{ const infl=(typeof a.inflate==='number')?a.inflate:0; if(infl) __inflateScene(obj, infl); }catch(e){}
                      try{ let s=(a.scale&&a.scale[0])?a.scale[0]:1.0; wrapG.scale.set(s,s,s);}catch (e) {}
                      try{
                        const inv=(function(){ try { const v=parseFloat(localStorage.getItem('baseMeshScale')||'0.92'); return (isFinite(v)&&v>0)?(1/v):1; } catch (e) { return 1; } })();
                        wrapG.position.set((a.position?.[0]||0)*inv,(a.position?.[1]||0.05)*inv,(a.position?.[2]||0)*inv);
                      }catch (e) {}
                      try{ wrapG.rotation.order='XYZ'; wrapG.rotation.set(a.rotation?.[0]||0, a.rotation?.[1]||0, a.rotation?.[2]||0);}catch (e) {}
                      scene.add(wrapG);
                      try { (function(){ var hex=String(localStorage.getItem('bootColorHex')||'').trim(); if(/^#?[0-9a-fA-F]{6}$/.test(hex)){ if(hex[0]!=='#') hex='#'+hex; wrapG.traverse?.(function(o){ try { if(!o||!o.isMesh) return; var arr=Array.isArray(o.material)?o.material:(o.material?[o.material]:[]); var on=String(o.name||'').toLowerCase(); for(var i=0;i<arr.length;i++){ var m=arr[i]; var nm=String((m&&m.name)||'').toLowerCase(); if(/\bboot_tint\b/.test(nm) || /\bboot_tint\b/.test(on)){ try{ m.color&&m.color.set&&m.color.set(hex);}catch{} try{ if(m.needsUpdate!==undefined) m.needsUpdate=true; }catch{} } } } catch {} }); } })(); } catch(e){}
                    }
                    const slots = Object.keys(eq||{}).filter(s=>s!=='model');
                    for (const slot of slots){ const raw = eq[slot]; const ids = Array.isArray(raw) ? raw : [raw]; for (const id of ids){ await addOne(slot, id); } }
                  })();
                } catch (_) {}
              }
            } else {
              console.warn('[lesson] OutfitPreview not found');
            }
          } catch (e) { console.warn('[lesson] attach failed', e); }
        };
        if (mv.model || mv.scene) { await doAttach(); }
        else { mv.addEventListener('load', ()=>{ doAttach(); }, { once:true }); }
      }
    }).catch(()=>{});
  } catch (e) {}
})();
