<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader – Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
</head>
<body class="anime-bg min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm">
    <h1 class="site-title text-2xl font-bold mb-4 accent-underline">Sign In</h1>
    <section class="manga-bubble p-4">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Username</label>
          <input id="loginUser" class="field w-full" autocomplete="username" />
        </div>
        <div>
          <label class="block text-sm mb-1">Password</label>
          <input id="loginPass" type="password" class="field w-full" autocomplete="current-password" />
        </div>
        <div class="text-sm text-red-600" id="loginErr"></div>
        <div class="flex items-center gap-2">
          <button type="submit" class="btn btn-dark">Sign In</button>
          <a class="btn btn-ghost" href="index.html">Cancel</a>
        </div>
      </form>
      <div class="mt-3 text-sm">
        <a class="text-blue-700 hover:underline" href="forgot.html">Forgot your password?</a>
      </div>
      <div class="mt-1 text-sm">
        New here? <a class="text-blue-700 hover:underline" href="signup.html">Create an account</a>
      </div>
    </section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    async function login(username, password){
      const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
      return await r.json();
    }
    $('#loginForm')?.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const u = $('#loginUser')?.value?.trim();
      const p = $('#loginPass')?.value || '';
      if (!u || !p) { $('#loginErr').textContent = 'Enter username and password.'; return; }
      const res = await login(u,p);
      if (!res.ok) { $('#loginErr').textContent = (res && res.error) || 'Sign in failed'; return; }
      location.href = 'index.html';
    });
  </script>
</body>
</html>
