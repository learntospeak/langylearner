<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader – Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
</head>
<body class="anime-bg min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm">
    <h1 class="site-title text-2xl font-bold mb-4 accent-underline">Create Account</h1>
    <section class="manga-bubble p-4">
      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Username</label>
          <input id="signupUser" class="field w-full" autocomplete="username" />
        </div>
        <div>
          <label class="block text-sm mb-1">Email (for password resets)</label>
          <input id="signupEmail" type="email" class="field w-full" autocomplete="email" />
        </div>
        <div>
          <label class="block text-sm mb-1">Password (min 6 chars)</label>
          <input id="signupPass" type="password" class="field w-full" autocomplete="new-password" />
        </div>
        <div class="text-sm text-red-600" id="signupErr"></div>
        <div class="flex items-center gap-2">
          <button type="submit" class="btn btn-primary">Create Account</button>
          <a class="btn btn-ghost" href="index.html">Cancel</a>
        </div>
      </form>
      <div class="mt-3 text-sm">
        Already have an account? <a class="text-blue-700 hover:underline" href="signin.html">Sign in</a>
      </div>
    </section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    async function signup(username, password, email){
      const r = await fetch('/api/auth/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password, email }) });
      return await r.json();
    }
    $('#signupForm')?.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const u = $('#signupUser')?.value?.trim();
      const p = $('#signupPass')?.value || '';
      const em = $('#signupEmail')?.value?.trim();
      if (!u || !p) { $('#signupErr').textContent = 'Enter username and password.'; return; }
      const res = await signup(u,p,em);
      if (!res.ok) { $('#signupErr').textContent = (res && res.error) || 'Create account failed'; return; }
      location.href = 'index.html';
    });
  </script>
</body>
</html>
