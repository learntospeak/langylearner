<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KanaReader – Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.x/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anime-theme.css" />
</head>
<body class="anime-bg min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm">
    <h1 class="site-title text-2xl font-bold mb-4 accent-underline">Reset Password</h1>
    <section class="manga-bubble p-4">
      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Username</label>
          <input id="resetUser" class="field w-full" autocomplete="username" />
        </div>
        <div>
          <label class="block text-sm mb-1">Reset Code</label>
          <input id="resetToken" class="field w-full" />
        </div>
        <div>
          <label class="block text-sm mb-1">New Password</label>
          <input id="resetPass" type="password" class="field w-full" autocomplete="new-password" />
        </div>
        <div id="resetErr" class="text-sm text-red-600"></div>
        <div class="flex items-center gap-2">
          <button type="submit" class="btn btn-dark">Set New Password</button>
          <a class="btn btn-ghost" href="index.html">Cancel</a>
        </div>
      </form>
      <div class="mt-3 text-sm">Need a code? <a class="text-blue-700 hover:underline" href="forgot.html">Request reset</a></div>
    </section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    async function doReset(username, token, newPassword){
      const r = await fetch('/api/auth/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, token, newPassword }) });
      return await r.json();
    }
    $('#resetForm')?.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const u = $('#resetUser')?.value?.trim();
      const t = $('#resetToken')?.value?.trim();
      const p = $('#resetPass')?.value || '';
      if (!u || !t || !p) { $('#resetErr').textContent = 'Fill all fields.'; return; }
      const res = await doReset(u, t, p);
      if (!res.ok) { $('#resetErr').textContent = (res && res.error) || 'Reset failed'; return; }
      location.href = 'signin.html';
    });
  </script>
</body>
</html>
